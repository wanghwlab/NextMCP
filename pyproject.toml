[project]
name = "nextmcp"
version = "0.5.11"
description = "Minimal MCP server for lab bioinformatics pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyyaml>=6.0",
    "starlette",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/wanghwlab/NextMCP"
Repository = "https://github.com/wanghwlab/NextMCP"

[project.scripts]
nextmcp = "nextmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextmcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
