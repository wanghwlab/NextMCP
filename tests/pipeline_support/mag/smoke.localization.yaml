    config_field: input
    original_value: https://raw.githubusercontent.com/nf-core/test-datasets/mag/samplesheets/samplesheet.multirun.v4.csv
    localized_value: /data/nextmcp/testdata/mag/test/pipeline-data/mag/samplesheets/samplesheet.multirun.v4.csv
  - role: busco_database
