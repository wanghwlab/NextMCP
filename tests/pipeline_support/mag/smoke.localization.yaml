version: 1
kind: pipeline_test_localization
pipeline: mag
case_id: smoke
profile_name: test
localized_root: /data/nextmcp/testdata/mag/test

path_prefix_mappings:
  - remote_prefix: https://raw.githubusercontent.com/nf-core/test-datasets/
    localized_prefix: /data/nextmcp/testdata/mag/test/pipeline-data/
  - remote_prefix: https://github.com/nf-core/test-datasets/raw/
    localized_prefix: /data/nextmcp/testdata/mag/test/pipeline-data/

source_profile:
  pipeline_root: /root/key_projects/nextmcp/nf_pipeline/mag
  config: conf/test.config
  resolved_runtime_chain:
    pipelines_testdata_base_path: https://raw.githubusercontent.com/nf-core/test-datasets/
    test_profile: test
    nf_test_case: tests/default.nf.test::-profile test
  resolved_params:
    input: /data/nextmcp/testdata/mag/test/rewrites/pipeline-data/mag/samplesheets/samplesheet.multirun.v4_local.csv
    min_length_unbinned_contigs: 1
    max_unbinned_contigs: 2
    skip_ale: true
    skip_concoct: true
    skip_comebin: true
    skip_metabinner: true
    busco_db: /data/nextmcp/testdata/mag/test/pipeline-data/mag/databases/busco/bacteria_odb10.2024-01-08.tar.gz
    busco_db_lineage: bacteria_odb10
    busco_clean: true
    prokka_fast_mode: true
    gtdb_db: /data/nextmcp/testdata/mag/test/pipeline-data/mag/databases/gtdbtk/gtdbtk_mockup_20250422.tar.gz
    cat_db: /data/nextmcp/testdata/mag/test/pipeline-data/mag/databases/cat/minigut_cat.tar.gz
    cat_no_suggestive_asterisks: true
    gtdbtk_min_completeness: 0.01
    gtdbtk_skip_aniscreen: true
    gtdbtk_use_full_tree: true
    megahit_fix_cpu_1: true
    spades_fix_cpus: 1

runtime_hints:
  process_resource_limits:
    from_conf_test_config:
      cpus: 4
      memory: 15.GB
      time: 1.h
  launch_rule: Build the smoke contract from nextflow.config plus conf/test.config, keep the upstream resourceLimits in one small override config, and do not merge tests/nextflow.config because its branch-pin base path does not reconstruct the same concrete URLs.
  manifest_rule: Download and rewrite the upstream multirun samplesheet because the nested short-read FASTQ URLs only become visible after fetching the CSV, and two rows reuse the same test_minigut FASTQ pair.
  artifact_rule: Keep assertions focused on the software versions file and a small set of stable MultiQC YAML outputs derived from tests/default.nf.test.snap plus tests/.nftignore.

config_override_files:
  - path: /data/nextmcp/testdata/mag/test/project-files/pipeline-support-mag/profile_test_overrides.config
    source_fields:
      - process.resourceLimits.cpus
      - process.resourceLimits.memory
      - process.resourceLimits.time
    purpose: Keep the upstream test profile resource caps in config scope instead of nextflow_run params.
    content: |
      process {
          resourceLimits = [
              cpus: 4,
              memory: '15.GB',
              time: '1.h'
          ]
      }

