        short_reads_1: /data/nextmcp/testdata/mag/test/pipeline-data/mag/test_data/test_minigut_sample2_R1.fastq.gz
        short_reads_2: /data/nextmcp/testdata/mag/test/pipeline-data/mag/test_data/test_minigut_sample2_R2.fastq.gz
        long_reads: ""

