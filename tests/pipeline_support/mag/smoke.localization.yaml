rewritten_manifests:
  - role: input_samplesheet
    original_path: /data/nextmcp/testdata/mag/test/pipeline-data/mag/samplesheets/samplesheet.multirun.v4.csv
    localized_path: /data/nextmcp/testdata/mag/test/rewrites/pipeline-data/mag/samplesheets/samplesheet.multirun.v4_local.csv
    rewritten_columns:
      - short_reads_1
      - short_reads_2
    localized_rows:
      - sample: test_minigut
        run: "1"
        group: "0"
        short_reads_platform: ILLUMINA
        short_reads_1: /data/nextmcp/testdata/mag/test/pipeline-data/mag/test_data/test_minigut_R1.fastq.gz
        short_reads_2: /data/nextmcp/testdata/mag/test/pipeline-data/mag/test_data/test_minigut_R2.fastq.gz
        long_reads: ""
      - sample: test_minigut
        run: "2"
        group: "0"
        short_reads_platform: ILLUMINA
        short_reads_1: /data/nextmcp/testdata/mag/test/pipeline-data/mag/test_data/test_minigut_R1.fastq.gz
        short_reads_2: /data/nextmcp/testdata/mag/test/pipeline-data/mag/test_data/test_minigut_R2.fastq.gz
        long_reads: ""
      - sample: test_minigut_sample2
