version: 1
kind: pipeline_support_contract
pipeline: rnafusion
case_id: smoke
description: >-
  Minimal end-to-end MCP smoke test for rnafusion using the upstream
  `test_build` reference-build route because the top-level `test` route is
  only exercised upstream in stub mode.
mode: profile-only

source_profile:
  profile: test_build
  config: conf/test_build.config
  source_files:
    - nextflow.config
    - conf/test_build.config
    - tests/csv/fastq.csv
    - tests/test_build.nf.test
    - tests/test_build.nf.test.snap
    - tests/.nftignore
  rationale: >-
    `nextflow.config` exposes both `test` and `test_build`, but the canonical
    pipeline-level `test` route is only covered upstream through
    `tests/test_stub.nf.test` with `-stub` and a placeholder
    `fusioncatcher_ref`. The smallest top-level non-stub route is therefore
    `test_build`, which keeps the upstream reference-build workflow on concrete
    small inputs without depending on the nf-test harness beyond a temporary
    `outdir`.

classification:
  primary_mode: profile-only
  modifiers:
    - localize-remote-inputs
    - environment-sensitive
    - snapshot-rich
  evidence:
    - >-
      `nextflow.config` includes `conf/test_build.config` under the
      `test_build` profile, so the selected route is visible in the normal
      runtime config chain without merging `tests/nextflow.config`.
    - >-
      `conf/test_build.config` defines a concrete reference-only route with
      `tools=arriba,starfusion,fusionreport,salmon,fusioninspector`,
      `references_only=true`, the small tutorial FASTA and GTF, explicit Dfam
      and Pfam inputs, and the Arriba support files.
    - >-
      The upstream `test_build` comment explicitly lists `HGNC_DOWNLOAD` among
      the processes this route is meant to exercise, so the localized contract
      should not prebind `hgnc_ref` or `hgnc_date`.
    - >-
      The same route also lists `FUSIONREPORT_DOWNLOAD`, but the current
      server-side support bundle already carries a reusable local
      `fusion_report_db`. Keeping that directory as `fusionreport_ref` avoids
      an extra host dependency while preserving the rest of the reference-build
      route.
    - >-
      `references_only=true` still requires a valid samplesheet during
      pipeline initialization, so localization must copy the repo `fastq.csv`,
      rewrite its nested FASTQ URLs to server-local paths, and localize those
      two FASTQ files.
    - >-
      The upstream nf-test runtime also clears `STARFUSION_BUILD ext.args` in
      `tests/nextflow.config`. Without that one override, the normal
      `homo_sapiens` module config enables `--human_gencode_filter`, which is
      incompatible with the tutorial minigenome GTF used by `test_build`.
    - >-
      The remaining tutorial and nf-core test-dataset files are explicit small
      reference inputs for this route and should stay localized to keep the
      bundle stable.
    - >-
      `tests/test_build.nf.test.snap` and `tests/.nftignore` provide enough
      stable artifact evidence to keep assertions compact.
  next_action: localize explicit small reference inputs, FASTQs in the samplesheet, and reuse the local FusionReport database

local_data_contract:
  profile_name: test_build
  localized_root: /data/nextmcp/testdata/rnafusion/test_build
  path_layout_rule: >-
    copy_repo_fastq_csv_then_rewrite_nested_fastq_urls_and_localize_small_reference_urls_plus_reuse_local_fusionreport_db
  rewritten_manifests:
    - role: input_samplesheet
      original_name: fastq.csv
      localized_name: fastq_local.csv
      expected_path: >-
        /data/nextmcp/testdata/rnafusion/test_build/rewrites/repo-assets/tests/csv/fastq_local.csv

launch:
  pipeline: rnafusion
  project: pipeline-support-rnafusion
  run_name: smoke
  params:
    input: >-
      /data/nextmcp/testdata/rnafusion/test_build/rewrites/repo-assets/tests/csv/fastq_local.csv
    references_only: true
    tools: arriba,starfusion,fusionreport,salmon,fusioninspector
    no_cosmic: true
    genome: GRCh38
    genome_gencode_version: 46
    species: homo_sapiens
    fasta: >-
      /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.fa
    gtf: >-
      /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.gtf
    fusion_annot_lib: >-
      /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/CTAT_HumanFusionLib.mini.dat.gz
    dfam_hmm: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm
    dfam_h3f: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3f
    dfam_h3i: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3i
    dfam_h3m: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3m
    dfam_h3p: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3p
    pfam_file: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/Pfam-A.hmm.gz
    arriba_ref_protein_domains: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/protein_domains_hg38_GRCh38_v2.5.0.gff3
    arriba_ref_known_fusions: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/known_fusions_hg38_GRCh38_v2.5.0.tsv.gz
    arriba_ref_blacklist: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/blacklist_hg38_GRCh38_v2.5.0.tsv.gz
    arriba_ref_cytobands: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/cytobands_hg38_GRCh38_v2.5.0.tsv
    fusionreport_ref: /data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db
  config_files:
    - >-
      /data/nextmcp/testdata/rnafusion/test_build/project-files/pipeline-support-rnafusion/profile_test_build_overrides.config
  config_overrides:
    - path: >-
        /data/nextmcp/testdata/rnafusion/test_build/project-files/pipeline-support-rnafusion/profile_test_build_overrides.config
      content: |
        process {
            resourceLimits = [
                cpus: 4,
                memory: '15.GB',
                time: '1.h'
            ]

            withName: 'STARFUSION_BUILD' {
                ext.args = ''
            }
        }
  prepare:
    validate_params_schema: true
  run:
    detach: false
  notes:
    - Start with `nextflow_run(prepare=true)` before the real launch.
    - Omit `profile` and rely on explicit params plus one small override config.
    - Keep `HGNC_DOWNLOAD` active by omitting `hgnc_ref` and `hgnc_date`.
    - Use the rewritten samplesheet so pipeline initialization sees server-local FASTQ paths.
    - Reuse the local FusionReport database through `fusionreport_ref`.
    - Keep the upstream nf-test `STARFUSION_BUILD ext.args=''` override so this tutorial minigenome route does not enable the human Gencode filter branch.
    - Omit `outdir` so nextmcp binds the project-owned default results directory.

assertions:
  prepare:
    ok: true
    required_paths:
      - /data/nextmcp/testdata/rnafusion/test_build/repo-assets/tests/csv/fastq.csv
      - /data/nextmcp/testdata/rnafusion/test_build/rewrites/repo-assets/tests/csv/fastq_local.csv
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/81cb45949e75cbb85cbf6c5ec9009ab45b160823/testdata/human/reads_1.fq.gz
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/81cb45949e75cbb85cbf6c5ec9009ab45b160823/testdata/human/reads_2.fq.gz
      - /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.fa
      - /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.gtf
      - /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/CTAT_HumanFusionLib.mini.dat.gz
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3f
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3i
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3m
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3p
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/Pfam-A.hmm.gz
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/blacklist_hg38_GRCh38_v2.5.0.tsv.gz
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/cytobands_hg38_GRCh38_v2.5.0.tsv
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/known_fusions_hg38_GRCh38_v2.5.0.tsv.gz
      - /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/protein_domains_hg38_GRCh38_v2.5.0.gff3
      - /data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db/fusiongdb2.db
      - /data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db/mitelman.db
      - /data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db/DB-timestamp.txt
      - /data/nextmcp/testdata/rnafusion/test_build/project-files/pipeline-support-rnafusion/profile_test_build_overrides.config
  run:
    ok: true
    final_status: succeeded
  observability:
    process_get_status: succeeded
    required_log_streams:
      - nextflow
  artifacts:
    required_paths:
      - pipeline_info/nf_core_rnafusion_software_mqc_versions.yml
      - ../rnafusion_references/GRCh38/gencode_v46/gencode/minigenome.fa.fai
      - ../rnafusion_references/GRCh38/gencode_v46/salmon/info.json
      - ../rnafusion_references/GRCh38/gencode_v46/star/Genome
      - ../rnafusion_references/GRCh38/gencode_v46/starfusion/ctat_genome_lib_build_dir/fusion_annot_lib.idx
      - ../rnafusion_references/GRCh38/hgnc/hgnc_complete_set.txt
    content_checks:
      - path: ../rnafusion_references/GRCh38/gencode_v46/salmon/info.json
        kind: md5
        expected: d91d8a954afcb4be9fe7bfb3e84b5be6
      - path: ../rnafusion_references/GRCh38/gencode_v46/star/Genome
        kind: md5
        expected: 1621486e3b854fefa37c0b4e77275233
      - path: >-
          ../rnafusion_references/GRCh38/gencode_v46/starfusion/ctat_genome_lib_build_dir/ref_genome.fa
        kind: md5
        expected: ad699c56ed38566c7d3e9579486b1706

prompt_brief: |
  # Task
  
  Use the nextmcp server.
  Run the localized `rnafusion` reference-build lightweight example in project
  `pipeline-withskill-rnafusion`. Use the rewritten FASTQ samplesheet and the
  reference/support files listed below. Every path listed below already exists
  on the nextmcp server. Keep the project-owned default results directory.
  
  ## Available inputs
  
  - Input samplesheet: `/data/nextmcp/testdata/rnafusion/test_build/rewrites/repo-assets/tests/csv/fastq_local.csv`
  - FASTQ bundle root: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/81cb45949e75cbb85cbf6c5ec9009ab45b160823/testdata/human`
  - Minigenome FASTA: `/data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.fa`
  - Minigenome GTF: `/data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.gtf`
  - Arriba protein domains: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/protein_domains_hg38_GRCh38_v2.5.0.gff3`
  - Arriba known fusions: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/known_fusions_hg38_GRCh38_v2.5.0.tsv.gz`
  - Arriba blacklist: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/blacklist_hg38_GRCh38_v2.5.0.tsv.gz`
  - Arriba cytobands: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/cytobands_hg38_GRCh38_v2.5.0.tsv`
  - FusionAnnotator library: `/data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/CTAT_HumanFusionLib.mini.dat.gz`
  - PFAM HMM: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/Pfam-A.hmm.gz`
  - DFAM HMM: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm`
  - DFAM H3F: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3f`
  - DFAM H3I: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3i`
  - DFAM H3M: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3m`
  - DFAM H3P: `/data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3p`
  - FusionReport database root: `/data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db`
  
  ## Workflow goal
  
  - Run the reference-building route, not a sample-level fusion-calling analysis.
  - Build the local support assets for Arriba, STAR-Fusion, FusionReport, Salmon, and FusionInspector.
  - Use the rewritten samplesheet so pipeline initialization reads the server-local FASTQ paths already
    recorded in that file.
  - Use the listed minigenome FASTA/GTF and support files instead of downloading reference inputs at
    runtime.
  - Let the workflow create HGNC reference data during the run rather than binding pre-existing HGNC
    files.
  - Use the human GRCh38/gencode v46 minigenome setup with species label `homo_sapiens`, and do not
    require COSMIC inputs.
  - Clear any extra arguments for `STARFUSION_BUILD` so that step runs without
    appended build flags.
  - Keep the upstream test resource caps at 4 CPUs, 15.GB memory, and 1.h runtime.
  
  ## restrictions
  - Do not read pipeline README, docs, schema, source files, or online help.
  - Do not inspect `nf_pipeline/rnafusion/` materials.
  - Do not reference other projects
  
  ## Baseline restrictions
  - Include all restrictions above.
  - Use `baseline-noskill-rnafusion` as project name.
  - Do not use the `rnafusion` expert skill.
prompt_brief_path: tests/pipeline_support/rnafusion/smoke.task.md
blockers: []
