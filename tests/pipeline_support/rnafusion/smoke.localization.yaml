version: 1
kind: pipeline_test_localization
pipeline: rnafusion
case_id: smoke
profile_name: test_build
localized_root: /data/nextmcp/testdata/rnafusion/test_build

path_prefix_mappings:
  - remote_prefix: https://raw.githubusercontent.com/nf-core/test-datasets/
    localized_prefix: /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/
  - remote_prefix: https://github.com/nf-core/test-datasets/raw/
    localized_prefix: /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/

source_profile:
  pipeline_root: /root/key_projects/nextmcp/nf_pipeline/rnafusion
  config: conf/test_build.config
  resolved_runtime_chain:
    selected_profile: test_build
    selected_test_case: tests/test_build.nf.test::Test build references
    selected_route: reference_build_only
    reason_for_not_using_test_profile: >-
      The top-level `test` route is only exercised upstream through
      `tests/test_stub.nf.test` with `-stub` and a placeholder
      `fusioncatcher_ref`, so `test_build` is the smallest top-level non-stub
      route.
  resolved_params:
    input: >-
      /data/nextmcp/testdata/rnafusion/test_build/rewrites/repo-assets/tests/csv/fastq_local.csv
    genomes_base: ${params.outdir}/references
    tools: arriba,starfusion,fusionreport,salmon,fusioninspector
    references_only: true
    no_cosmic: true
    genome: GRCh38
    genome_gencode_version: 46
    species: homo_sapiens
    fasta: >-
      /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.fa
    gtf: >-
      /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/minigenome.gtf
    fusion_annot_lib: >-
      /data/nextmcp/testdata/rnafusion/test_build/downloads/github.com/STAR-Fusion/STAR-Fusion-Tutorial/raw/master/CTAT_HumanFusionLib.mini.dat.gz
    dfam_hmm: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm
    dfam_h3f: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3f
    dfam_h3i: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3i
    dfam_h3m: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3m
    dfam_h3p: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/test_starfusion_dfam.hmm.h3p
    pfam_file: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/human/Pfam-A.hmm.gz
    arriba_ref_protein_domains: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/protein_domains_hg38_GRCh38_v2.5.0.gff3
    arriba_ref_known_fusions: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/known_fusions_hg38_GRCh38_v2.5.0.tsv.gz
    arriba_ref_blacklist: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/blacklist_hg38_GRCh38_v2.5.0.tsv.gz
    arriba_ref_cytobands: >-
      /data/nextmcp/testdata/rnafusion/test_build/pipeline-data/refs/heads/rnafusion/testdata/reference/arriba/cytobands_hg38_GRCh38_v2.5.0.tsv
    fusionreport_ref: /data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db

runtime_hints:
  launch_rule: >-
    Build the smoke contract from `nextflow.config` plus
    `conf/test_build.config`, copy the repo samplesheet, rewrite its nested
    FASTQ URLs to the current localized bundle, localize the explicit small
    reference URLs, keep the dynamic `genomes_base` setting, the upstream
    resource caps, and the upstream nf-test `STARFUSION_BUILD ext.args=''`
    override in one small override config, keep `HGNC_DOWNLOAD` active by
    omitting `hgnc_ref` plus `hgnc_date`, and reuse the local FusionReport
    database through `fusionreport_ref`.
  manifest_rule: >-
    Copy the repo `fastq.csv` into the current localized root, then rewrite the
    nested FASTQ URLs to server-local paths under the same bundle. The current
    workspace already has those FASTQ files under the mapped `pipeline-data`
    tree, so localization should reuse them instead of downloading fresh copies.
  artifact_rule: >-
    Keep assertions focused on one salmon index file, one STAR genome file, one
    STAR-Fusion anchor file, one HGNC file, and the software versions output
    derived from `tests/test_build.nf.test.snap` plus `tests/.nftignore`.
  environment_rule: >-
    The runtime still needs pipeline-side network access for `HGNC_DOWNLOAD`.
    FusionReport is satisfied from the localized database bundle.

local_file_inventory:
  - role: input_samplesheet_template
    config_field: input
    source_path: /root/key_projects/nextmcp/nf_pipeline/rnafusion/tests/csv/fastq.csv
    localized_path: /data/nextmcp/testdata/rnafusion/test_build/repo-assets/tests/csv/fastq.csv

generated_file_inventory:
  - role: fusionreport_ref
    source_requirement: >-
      Reuse an existing local `fusion_report_db` directory, copy one supplied
      with `--fusionreport-db`, or build it with `fusion_report download --no-cosmic`.
    localized_path: /data/nextmcp/testdata/rnafusion/test_build/inputs/fusion_report_db

config_override_files:
  - path: >-
      /data/nextmcp/testdata/rnafusion/test_build/project-files/pipeline-support-rnafusion/profile_test_build_overrides.config
    source_fields:
      - params.genomes_base
      - process.resourceLimits.cpus
      - process.resourceLimits.memory
      - process.resourceLimits.time
      - process.withName:STARFUSION_BUILD.ext.args
    purpose: >-
      Keep the dynamic `genomes_base` value, the upstream test resource caps,
      and the upstream nf-test `STARFUSION_BUILD ext.args=''` override in
      Nextflow config scope instead of nextflow_run params.
    content: |
      params {
          genomes_base = "${params.outdir}/references"
      }

      process {
          resourceLimits = [
              cpus: 4,
              memory: '15.GB',
              time: '1.h'
          ]

          withName: 'STARFUSION_BUILD' {
              ext.args = ''
          }
      }

