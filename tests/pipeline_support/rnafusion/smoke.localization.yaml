ignored_upstream_params:
  - config_field: nextflow.config:params.input
    reason: The default repo samplesheet path is replaced by a copied and rewritten local manifest under the current localized root.
  - config_field: nextflow.config:params.genomes_base
    reason: The default S3 reference root is replaced by a local override that tracks `${params.outdir}/references`.
  - config_field: nextflow.config:params.fusioncatcher_ref
    reason: The selected route does not include `fusioncatcher`.
  - config_field: tests/nextflow.config:params.modules_testdata_base_path
    reason: nf-test module base paths are not needed for the selected pipeline-level route.
  - config_field: tests/nextflow.config:params.pipelines_testdata_base_path
    reason: The branch-pinned nf-test base path is not needed once the contract localizes the selected explicit reference URLs and FASTQ paths under the current localized root.
  - config_field: tests/nextflow.config:params.dfam_hmm
    reason: The selected route already carries direct values in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.dfam_h3f
    reason: The selected route already carries direct values in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.dfam_h3i
    reason: The selected route already carries direct values in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.dfam_h3m
    reason: The selected route already carries direct values in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.dfam_h3p
    reason: The selected route already carries direct values in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.pfam_file
    reason: The selected route already carries a direct value in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.arriba_ref_blacklist
    reason: The selected route already carries direct GitHub-hosted Arriba support files in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.arriba_ref_cytobands
    reason: The selected route already carries direct GitHub-hosted Arriba support files in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.arriba_ref_known_fusions
    reason: The selected route already carries direct GitHub-hosted Arriba support files in `conf/test_build.config`.
  - config_field: tests/nextflow.config:params.arriba_ref_protein_domains
    reason: The selected route already carries direct GitHub-hosted Arriba support files in `conf/test_build.config`.
  - config_field: aws.client.anonymous
    reason: No S3 access is required after localizing the selected explicit reference URLs and FASTQ paths.
  - config_field: params.outdir
    reason: Omit the upstream outdir so nextmcp can bind the project-owned default results directory.

natural_language_execution_brief: |
  # Task
  
  Use the nextmcp server.
  Run the localized `rnafusion` reference-build lightweight example in project
