version: 1
kind: pipeline_test_localization
pipeline: ampliseq
case_id: smoke
profile_name: test
localized_root: /data/nextmcp/testdata/ampliseq/test

path_prefix_mappings:
  - remote_prefix: https://raw.githubusercontent.com/nf-core/test-datasets/
    localized_prefix: /data/nextmcp/testdata/ampliseq/test/pipeline-data/
  - remote_prefix: https://github.com/nf-core/test-datasets/raw/
    localized_prefix: /data/nextmcp/testdata/ampliseq/test/pipeline-data/

source_profile:
  pipeline_root: /root/key_projects/nextmcp/nf_pipeline/ampliseq
  config: conf/test.config
  resolved_runtime_chain:
    pipelines_testdata_base_path: https://raw.githubusercontent.com/nf-core/test-datasets/
    test_profile: test
    nf_test_case: tests/default.nf.test::-profile test
  resolved_params:
    input: /data/nextmcp/testdata/ampliseq/test/rewrites/pipeline-data/ampliseq/samplesheets/Samplesheet_local.tsv
    metadata: /data/nextmcp/testdata/ampliseq/test/pipeline-data/ampliseq/samplesheets/Metadata.tsv
    FW_primer: GTGYCAGCMGCCGCGGTAA
    RV_primer: GGACTACNVGGGTWTCTAAT
    dada_ref_taxonomy: gtdb=R07-RS207
    cut_dada_ref_taxonomy: true
    qiime_ref_taxonomy: greengenes85
    max_len_asv: 255
    filter_ssu: bac
    min_samples: 2
    min_frequency: 10
    metadata_category_barplot: treatment1,badpairwise10
    tax_agglom_max: 4
    sbdiexport: true
    qiime_adonis_formula: treatment1,mix8
    diversity_rarefaction_depth: 500
    vsearch_cluster: true
    ancombc: true
    ancombc_formula: treatment1
    ancombc_formula_reflvl: treatment1::b
    ancombc_effect_size: 2
    ancombc_significance: 0.00001

runtime_hints:
  process_resource_limits:
    from_conf_test_config:
      cpus: 4
      memory: 15.GB
      time: 1.h
  launch_rule: >-
    Build the smoke contract from nextflow.config plus conf/test.config, keep
    the upstream resourceLimits in one small config file, and do not merge
    tests/nextflow.config because its branch-pin base path is not needed for
    the pipeline-level smoke route. Keep primers and other route-shaping
    values in launch params instead of config scope because
    `nf_pipeline/ampliseq/conf/modules.config` passes SBDI primer values
    through config-scoped `ext.args`, and a config-only params block can
    resolve there as literal `null`.
  manifest_rule: >-
    Download and rewrite the upstream samplesheet because the `forwardReads`
    and `reverseReads` columns point at nested GitHub FASTQ URLs that need
    server-local copies.
  reference_rule: >-
    Also localize the QIIME2 Greengenes85 reference pair because the selected
    route otherwise stages `85_otus.fasta` and `85_otu_taxonomy.txt` from
    `data.qiime2.org` at runtime, then rewrite that pair to `.fna` and `.tax`
    filenames so the launch can use official param `qiime_ref_tax_custom`.
  artifact_rule: >-
    Keep assertions focused on summary_report, overall_summary, DADA2, MultiQC,
    SBDI, and VSEARCH anchor files derived from tests/default.nf.test.snap plus
    tests/.nftignore.

config_override_files:
  - path: /data/nextmcp/testdata/ampliseq/test/project-files/pipeline-support-ampliseq/profile_test_overrides.config
    source_fields:
      - process.resourceLimits.cpus
      - process.resourceLimits.memory
      - process.resourceLimits.time
    purpose: Keep only the upstream test profile resource caps in config scope, and leave primers plus other route-shaping values in nextflow_run params.
    content: |
      process {
          resourceLimits = [
              cpus: 4,
              memory: '15.GB',
              time: '1.h'
          ]
      }

