pipeline:
  id: rnafusion
  name: nf-core/rnafusion
  version: 4.1.0
  summary: RNA fusion detection and visualization pipeline using Arriba, STAR-Fusion,
    FusionCatcher, FusionInspector, fusion-report, StringTie, CTAT-SPLICING, Salmon,
    FastQC, Picard, and MultiQC.
source_basis:
- authoring bundle fields: schema, documents, and source_files
- pipeline directory: /root/key_projects/nextmcp/nf_pipeline/rnafusion
- standard files: README.md, docs/usage.md, docs/output.md, main.nf, nextflow.config,
    workflows/rnafusion.nf, nextflow_schema.json
required_inputs:
- name: tools
  required_for: most runs
  placeholder: all
  notes: Comma-delimited tools list. Allowed values include arriba, ctatsplicing,
    fusioncatcher, starfusion, stringtie, fusionreport, fastp, salmon,
    fusioninspector, and all.
- name: genomes_base
  required_for: most runs and reference lookup
  placeholder: <server_reference_root>/rnafusion
  notes: Server-local directory containing downloaded or built rnafusion references.
- name: outdir
  required_for: published results
  placeholder: <server_output_root>/rnafusion
  notes: Server-local output directory for published pipeline results.
common_inputs:
- name: input
  required_for: normal analysis runs
  placeholder: <server_input_root>/samplesheet.csv
  notes: CSV, TSV, YAML, or JSON samplesheet. sample and strandedness are required;
    at least one of fastq_1, bam, cram, junctions, or splice_junctions must support
    the selected tools.
supported_modes:
- id: reference_build
  entry_target: pipeline id rnafusion
  use_when: Build or refresh references before analysis, especially after a pipeline release.
  key_params:
  - references_only: true
  - tools
  - genomes_base
  - outdir
- id: full_detection
  entry_target: pipeline id rnafusion
  use_when: Run the full fusion detection and visualization route.
  key_params:
  - tools: all
  - input
  - genomes_base
  - outdir
- id: selected_tools
  entry_target: pipeline id rnafusion
  use_when: Run a subset of detection or support tools.
  key_params:
  - tools
  - input
  - genomes_base
  - outdir
- id: fusioninspector_only
  entry_target: pipeline id rnafusion
  use_when: Validate or visualize a provided fusion list without running upstream callers.
  key_params:
  - tools: fusioninspector
  - fusioninspector_fusions
  - input
  - skip_qc: true
  - skip_vis: true
  - skip_vcf: true
- id: no_cosmic_reference_build
  entry_target: pipeline id rnafusion
  use_when: Build references without COSMIC because credentials or license coverage are unavailable.
  key_params:
  - references_only: true
  - no_cosmic: true
- id: qiagen_cosmic_reference_build
  entry_target: pipeline id rnafusion
  use_when: Build fusion-report references with QIAGEN COSMIC credentials.
  key_params:
  - references_only: true
  - cosmic_username
  - cosmic_passwd
  - qiagen: true
limitations:
- COSMIC username and password are secrets. Do not invent or store them in the skill.
- Conda and Mamba are not supported when ctatsplicing is selected.
- The usage docs state that GRCh38 is the supported genome.
- FusionCatcher reference files must exist when fusioncatcher is selected.
- Arriba reference blacklist, cytobands, known fusions, and protein domains must exist
  when arriba is selected.
- FusionInspector needs either provided fusioninspector_fusions or fusions generated by
  upstream callers plus fusionreport with visualization enabled.
