group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `reference_genome_options` for exact lookup.
parameters:
- group_id: reference_genome_options
  name: fai
  source_name: fai
  type: string
  required: false
  default: null
  enum: null
  description: Path to FASTA genome index file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/fai
  example_values:
  - <server_reference_root>/fai
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    mimetype: text/plain
    pattern: ^\S+\.fn?ai(\.gz)?$
    description: Path to FASTA genome index file.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: fasta
  source_name: fasta
  type: string
  required: false
  default: null
  enum: null
  description: Path to FASTA genome file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    description: Path to FASTA genome file.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: fusion_annot_lib
  source_name: fusion_annot_lib
  type: string
  required: false
  default: null
  enum: null
  description: Path to Fusion Annotation Library to be used in STARFUSION_BUILD.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/fusion_annot_lib
  example_values:
  - <server_reference_root>/fusion_annot_lib
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    pattern: \S+\.dat\.gz$
    description: Path to Fusion Annotation Library to be used in STARFUSION_BUILD.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: gtf
  source_name: gtf
  type: string
  required: false
  default: null
  enum: null
  description: Path to GTF genome file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genes.gtf
  example_values:
  - <server_reference_root>/genes.gtf
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    pattern: ^\S+\.gtf?(\.gz)?$
    description: Path to GTF genome file.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: no_cosmic
  source_name: no_cosmic
  type: boolean
  required: false
  default: null
  enum: null
  description: Avoid using Cosmic DB (for example in clinical case applications where
    a paid license applies.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/no_cosmic
  example_values:
  - <server_reference_root>/no_cosmic
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    fa_icon: far fa-file-code
    description: Avoid using Cosmic DB (for example in clinical case applications
      where a paid license applies.
- group_id: reference_genome_options
  name: references_only
  source_name: references_only
  type: boolean
  required: false
  default: null
  enum: null
  description: Skip running the analysis, only builds the references
