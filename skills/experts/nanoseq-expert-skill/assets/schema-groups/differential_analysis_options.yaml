parameters:
- group_id: differential_analysis_options
  name: quantification_method
  source_name: quantification_method
  type: string
  required: false
  default: bambu
  enum: null
  description: 'Specifies the transcript quantification method to use (available are:
    bambu or stringtie2). Only available when protocol is cDNA or directRNA.'
