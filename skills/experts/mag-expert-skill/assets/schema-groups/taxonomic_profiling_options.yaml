  enum: null
  description: Min. fraction of AA (in %) in the MSA for bins to be kept.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/gtdbtk_min_perc_aa
  example_values:
  - <server_reference_root>/gtdbtk_min_perc_aa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Taxonomic profiling options
  raw_schema:
    type: number
    default: 10
    description: Min. fraction of AA (in %) in the MSA for bins to be kept.
    minimum: 0
    maximum: 100
- group_id: taxonomic_profiling_options
  name: gtdbtk_pplacer_cpus
  source_name: gtdbtk_pplacer_cpus
  type: integer
  required: false
  default: 1
  enum: null
  description: Number of CPUs used for the by GTDB-Tk run tool pplacer.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/gtdbtk_pplacer_cpus
  example_values:
  - <server_reference_root>/gtdbtk_pplacer_cpus
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Taxonomic profiling options
  raw_schema:
    type: integer
    default: 1
    description: Number of CPUs used for the by GTDB-Tk run tool pplacer.
    help_text: A low number of CPUs helps to reduce the memory required/reported by
      GTDB-Tk. See also the [GTDB-Tk documentation](https://ecogenomics.github.io/GTDBTk/faq.html#gtdb-tk-reaches-the-memory-limit-pplacer-crashes).
