    description: Skip MetaEuk gene prediction and annotation
- group_id: gene_prediction_and_annotation_options
  name: skip_prodigal
  source_name: skip_prodigal
  type: boolean
  required: false
  default: null
  enum: null
  description: Skip Prodigal gene prediction
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Gene prediction and annotation options
