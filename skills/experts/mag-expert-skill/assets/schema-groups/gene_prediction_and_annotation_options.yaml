- group_id: gene_prediction_and_annotation_options
  name: metaeuk_db
  source_name: metaeuk_db
  type: string
  required: false
  default: null
  enum: null
  description: Path to either a local fasta file of protein sequences, or to a directory
    containing an MMseqs2-formatted database, for annotation of eukaryotic genomes.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/metaeuk_db
  example_values:
  - <server_reference_root>/metaeuk_db
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Gene prediction and annotation options
  raw_schema:
    type: string
    description: Path to either a local fasta file of protein sequences, or to a directory
      containing an MMseqs2-formatted database, for annotation of eukaryotic genomes.
    help_text: 'One option would be the databases from the MetaEuk publication (https://wwwuser.gwdg.de/~compbiol/metaeuk/),
      however it should be noted that these are focused on marine eukaryotes.


      If supplying an mmseqs database, you must supply a directory that _within_ it
      has the `database`, `database.dbtype`, `database_h` etc. files. For example,
      for a pre-downloaded Kalamari database, you would supply `--mmseqs_db /<path>/<to>/mmseqs_db/Kalamari/.
      Where if you were to look inside the database you would see `mmseqs_db/Kalamari/database_h`'
    format: path
    exists: true
- group_id: gene_prediction_and_annotation_options
  name: prokka_compliance_centre
  source_name: prokka_compliance_centre
  type: string
  required: false
  default: null
  enum: null
  description: Specify sequencing centre name required for Prokka's compliance mode.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Gene prediction and annotation options
  raw_schema:
    type: string
    help_text: Specify the sequencing centre name for making NCBI Genbank/ENA compatible
      annotation files (required when specifying `--prokka_with_compliance`).
    description: Specify sequencing centre name required for Prokka's compliance mode.
