- group_id: gene_prediction_and_annotation_options
  name: skip_prokka
  source_name: skip_prokka
  type: boolean
  required: false
  default: null
  enum: null
  description: Skip Prokka genome annotation.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/skip_prokka
  example_values:
  - <server_reference_root>/skip_prokka
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
