  source_section: Assembly options
  raw_schema:
    type: string
    description: Additional custom options for SPAdes and SPAdesHybrid. Do not specify
      `--meta` as this will be added for you!
    help_text: 'An example is adjusting k-mers ("-k 21,33,55,77") or adding [advanced
      options](https://github.com/ablab/spades#advanced-options). But not --meta,
      -t, -m, -o or --out-prefix, because these are already in use. Must be used like
      this: --spades_options=''-k 21,33,55,77'''
