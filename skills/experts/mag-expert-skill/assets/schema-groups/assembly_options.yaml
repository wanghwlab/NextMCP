- group_id: assembly_options
  name: spades_downstreaminput
  source_name: spades_downstreaminput
  type: string
  required: false
  default: scaffolds
  enum: &id001
  - scaffolds
  - contigs
  description: Specify whether to use contigs or scaffolds assembled by SPAdes
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/spades_downstreaminput
  example_values:
  - scaffolds
  - contigs
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Assembly options
  raw_schema:
    type: string
    description: Specify whether to use contigs or scaffolds assembled by SPAdes
    help_text: By default the SPAdes documentation recommends using scaffolds rather
      than contigs, as these are longer as they combine multiple contigs. However
      there is an increased risk of misassemblies or chimeras. Use this flag to specify
      to just use contigs for downstream processes such as binning.
    enum: *id001
    default: scaffolds
- group_id: assembly_options
  name: megahit_options
  source_name: megahit_options
  type: string
  required: false
  default: null
  enum: null
  description: Additional custom options for MEGAHIT.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Assembly options
  raw_schema:
    type: string
    description: Additional custom options for MEGAHIT.
    help_text: 'An example is adjusting presets (e.g. "--presets meta-large"), k-mers
      (e.g. "-k 21,33,55,77") or adding other [advanced options](https://github.com/voutcn/megahit#advanced-usage).
      For example, increase the minimum k-mer in the event of an error message such
      as "Too many vertices in the unitig graph, you may increase the kmer size to
      remove tons of erroneous kmers." in the MEGAHIT log file. But not --threads,
      --memory, -o or input read files, because these are already in use. Must be
      used like this: --megahit_options=''--presets meta-large'''
- group_id: assembly_options
  name: spades_options
  source_name: spades_options
  type: string
  required: false
  default: null
