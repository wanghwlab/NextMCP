  enum: &id002
  - raw_bins_only
  - refined_bins_only
  - both
  description: Specify which binning output is sent for downstream annotation, taxonomic
    classification, bin quality control etc.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/postbinning_input
  example_values:
