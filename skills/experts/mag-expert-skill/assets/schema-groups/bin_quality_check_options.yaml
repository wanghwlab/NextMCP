group:
  id: bin_quality_check_options
  label: Bin quality check options
  selection_rule: Use this group for parameters defined under the `Bin quality check
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/bin_quality_check_options.md
  - assets/schema-groups/bin_quality_check_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `bin_quality_check_options` for exact lookup.
parameters:
- group_id: bin_quality_check_options
  name: busco_clean
  source_name: busco_clean
  type: boolean
  required: false
  default: null
  enum: null
  description: Enable clean-up of temporary files created during BUSCO runs.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Bin quality check options
  raw_schema:
    type: boolean
    description: Enable clean-up of temporary files created during BUSCO runs.
    help_text: By default, BUSCO creates a large number of intermediate files every
      run. This may cause problems on some clusters which have file number limits
      in plate, particularly with large numbers of bins. Enabling this option cleans
      these files, reducing the total file count of the work directory.
- group_id: bin_quality_check_options
  name: checkm2_db
  source_name: checkm2_db
  type: string
  required: false
  default: null
  enum: null
  description: Path to local file of an already downloaded and uncompressed CheckM2
    database file (.dmnd file).
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/checkm2_db
  example_values:
  - <server_reference_root>/checkm2_db
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Bin quality check options
  raw_schema:
    type: string
    description: Path to local file of an already downloaded and uncompressed CheckM2
      database file (.dmnd file).
    help_text: The pipeline can also download this for you if not specified, and you
      can save the resulting directory into your output directory by specifying `--save_checkm2_data`.
      You should move this file to somewhere else on your machine (and supply back
      to the pipeline in future runs again with `--checkm2_db`).
    format: file-path
    exists: true
