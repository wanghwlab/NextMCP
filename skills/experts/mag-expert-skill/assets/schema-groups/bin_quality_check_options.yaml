  - refined_bins_only
  - both
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Bin quality check options
  raw_schema:
    type: string
    default: raw_bins_only
    description: Specify which binning output is sent for downstream annotation, taxonomic
