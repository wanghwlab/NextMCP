parameters:
- group_id: quality_control_for_long_reads_options
  name: keep_lambda
  source_name: keep_lambda
  type: boolean
  required: false
  default: null
  enum: null
  description: Keep reads similar to the ONT internal standard Escherichia virus Lambda
    genome.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Quality control for long reads options
  raw_schema:
    type: boolean
    description: Keep reads similar to the ONT internal standard Escherichia virus
      Lambda genome.
- group_id: quality_control_for_long_reads_options
  name: lambda_reference
  source_name: lambda_reference
  type: string
  required: false
  default: null
  enum: null
  description: Genome reference used to remove ONT Lambda contaminant reads.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/lambda_reference
  example_values:
  - <server_input_root>/lambda_reference
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Quality control for long reads options
  raw_schema:
    type: string
    description: Genome reference used to remove ONT Lambda contaminant reads.
    format: file-path
    exists: true
    help_text: 'If not supplied, and keeping lambda is turned off, an included genome
      (GCA_000840245.1) will be used '
