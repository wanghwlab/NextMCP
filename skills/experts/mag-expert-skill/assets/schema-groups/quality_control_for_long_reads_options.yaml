- group_id: quality_control_for_long_reads_options
  name: longreads_length_weight
  source_name: longreads_length_weight
  type: integer
  required: false
  default: 10
  enum: null
  description: The higher the more important is read length when choosing the best
    reads.
  classification: lookup_only
  channel: params
  placeholder: <server_input_root>/longreads_length_weight
  example_values:
  - <server_input_root>/longreads_length_weight
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Quality control for long reads options
  raw_schema:
    type: integer
    default: 10
    description: The higher the more important is read length when choosing the best
      reads.
    help_text: 'The default value focuses on length instead of quality to improve
      assembly size.

      In order to assign equal weights to read lengths and read qualities set this
      parameter to 1.

      This might be useful, for example, to benefit indirectly from the removal of
      short host reads (causing lower qualities for reads not overlapping filtered
      short reads).'
