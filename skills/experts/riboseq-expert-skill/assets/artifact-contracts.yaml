artifacts:
- id: results_root
  path: results/<run_id>/
  produced_when: The main pipeline entry finishes successfully.
  meaning: Project-owned published results root for review and downstream handoff.
- id: multiqc_report
  path: multiqc/multiqc_report.html
  produced_when: skip_multiqc is false.
  meaning: Primary QC summary across preprocessing, strandedness checks, alignment, quantification,
    riboseq QC, and workflow traceability.
- id: pipeline_params
  path: pipeline_info/params.json
  produced_when: Every completed run.
  meaning: Source-backed run parameters used to confirm route compatibility for reruns and historical
    reuse.
- id: pipeline_reports
  path: pipeline_info/
  produced_when: Every completed run.
  meaning: Nextflow execution timeline, trace, report, DAG, software versions, validated samplesheet,
    and optional email reports.
- id: preprocessing_fastqc
  path: preprocessing/fastqc/
  produced_when: skip_fastqc is false.
  meaning: Raw-read FastQC reports before trimming.
- id: trimmed_reads
  path: preprocessing/trimgalore/ or preprocessing/fastp/
  produced_when: save_trimmed is true, with trimmer selecting trimgalore or fastp.
  meaning: Saved trimmed FASTQ intermediates and trimming logs.
- id: bbsplit_reads
  path: preprocessing/bbsplit/
  produced_when: skip_bbsplit is false; split reads are saved when save_bbsplit_reads is true.
  meaning: Contaminant or primary-reference split read statistics and optional FASTQ files.
- id: sortmerna_reads
  path: preprocessing/sortmerna/
  produced_when: remove_ribo_rna is true and ribo_removal_tool is sortmerna; retained reads are saved when save_non_ribo_reads is true.
  meaning: rRNA filtering logs and optional non-rRNA FASTQ files.
- id: star_alignment
  path: alignment/star/
  produced_when: The standard STAR alignment stage runs; skip_alignment is not a 2.0.0 parameter.
  meaning: STAR genome/transcriptome alignments, sorted BAMs, indexes, STAR logs, and SAMtools mapping
    statistics. save_align_intermeds controls original BAM publication.
- id: umi_deduplicated_bam
  path: alignment/star/deduplicated/
  produced_when: with_umi is true.
  meaning: UMI-deduplicated sorted BAMs plus BAI or CSI indexes and UMI deduplication logs.
- id: ribotish_qc
  path: riboseq_qc/ribotish/
  produced_when: skip_ribotish is false.
  meaning: Ribo-TISH quality report, read distribution plots, and P-site offset parameter files.
- id: ribotricer_qc
  path: riboseq_qc/ribotricer/
  produced_when: run_ribotricer is true.
  meaning: Read length distribution, metagene plots, inferred protocol, and metagene profile tables.
- id: ribotish_orf_predictions
  path: orf_predictions/ribotish/
  produced_when: skip_ribotish is false.
  meaning: Ribo-TISH thresholded and unthresholded ORF predictions plus transcript profiles.
- id: ribotricer_orf_predictions
  path: orf_predictions/ribotricer/
  produced_when: run_ribotricer is true.
  meaning: Ribotricer translating ORF TSV files and derived P-site offsets when not supplied.
- id: salmon_quantification
  path: quantification/salmon/
  produced_when: STAR transcriptome alignments and Salmon quantification complete.
  meaning: Gene and transcript count/TPM matrices, per-sample quant.sf files, and SummarizedExperiment
    RDS outputs.
- id: translational_efficiency
  path: translational_efficiency/anota2seq/
  produced_when: contrasts is supplied with matched rnaseq and riboseq samples.
  meaning: anota2seq total mRNA, translated mRNA, mRNA abundance, buffering, and translation result
    tables plus model diagnostic plots.
- id: reference_files
  path: genome/
  produced_when: save_reference is true or reference files are generated by the pipeline.
  meaning: Saved FASTA/GTF-derived files and generated STAR index files for later reuse.
- id: bowtie2_rrna
  path: preprocessing/bowtie2_rrna/
  produced_when: remove_ribo_rna=true and ribo_removal_tool=bowtie2
  meaning: Alignment logs for reference depletion; retained FASTQs are published only with save_non_ribo_reads=true.
- id: ribocode
  path: orf_predictions/ribocode/
  produced_when: skip_ribocode is false
  meaning: RiboCode ORF predictions; inspect riboseq_qc/ribocode/ for metaplots and P-site QC.
- id: inframe_psite
  path: quantification/inframe_psite/
  produced_when: te_quantification_method=plastid_psite and plastid enabled
  meaning: In-frame CDS P-site counts used for the default TE route.
- id: extended_orf_catalogue
  path: orf_predictions/catalogue/
  produced_when: extended_orf_analysis=true with required reference/novel transcript materials
  meaning: Cross-caller ORF union plus consensus/ filtered by orf_min_callers and orf_min_samples.
reuse_guidance:
  search_with_artifact_path_contains:
  - pipeline_info/params.json
  - multiqc/multiqc_report.html
  - quantification/salmon/salmon.merged.gene_counts.tsv
  - orf_predictions/ribotricer
  - genome/index/star
  required_confirmation:
  - Read run_get(include=["artifact_summary"]) before raw files.
  - Use run_artifacts to inspect artifacts.json and pipeline_fingerprint.
  - Read pipeline_info/params.json before deciding that a previous artifact is route-compatible.
