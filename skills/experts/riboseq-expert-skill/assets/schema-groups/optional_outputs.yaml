group:
  id: optional_outputs
  label: Optional outputs
  selection_rule: Use this group for parameters defined under the `Optional outputs` top-level schema
    section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/optional_outputs.md
  - assets/schema-groups/optional_outputs.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section `optional_outputs`
    for exact lookup.
parameters:
- group_id: optional_outputs
  name: save_align_intermeds
  source_name: save_align_intermeds
  type: boolean
  required: false
  default: true
  enum: null
  description: Save the intermediate BAM files from the alignment step.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  mapping_notes: Set only when the user wants a different output root, saved intermediate, or reporting
    behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Optional outputs
  raw_schema:
    type: boolean
    description: Save the intermediate BAM files from the alignment step.
    help_text: By default, intermediate BAM files will not be saved. The final BAM files created after
      the appropriate filtering step are always saved to limit storage usage. Set this parameter to
      also save other intermediate BAM files.
    fa_icon: fas fa-save
    default: true
