- group_id: riboseq_specific_options
  name: te_lfc_threshold
  source_name: te_lfc_threshold
  type: number
  required: false
  default: 0.2630344
  enum: null
  description: Minimum absolute log2 fold change for translational efficiency (TE) to be considered
    significant. Genes must meet both p-value and effect size thresholds. Default is log2(1.2) matching
    anota2seq. Maps to anota2seq selDeltaPT / deltaTE lfc_threshold_te.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 0.2630344
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Riboseq-specific options
  raw_schema:
    type: number
    default: 0.2630344
    description: Minimum absolute log2 fold change for translational efficiency (TE) to be considered
      significant. Genes must meet both p-value and effect size thresholds. Default is log2(1.2) matching
      anota2seq. Maps to anota2seq selDeltaPT / deltaTE lfc_threshold_te.
    fa_icon: fas fa-ruler-vertical
- group_id: riboseq_specific_options
  name: te_quantification_method
  source_name: te_quantification_method
  type: string
  required: false
  default: plastid_psite
  enum: &id001
  - alignment
  - pseudo
  - plastid_psite
  description: 'Quantification method for translational efficiency analysis: ''plastid_psite'' (in-frame
    P-site counts from plastid, default), ''alignment'' (STAR -> Salmon) or ''pseudo'' (Salmon pseudo-alignment).'
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - alignment
  - pseudo
  - plastid_psite
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Riboseq-specific options
  raw_schema:
    type: string
    default: plastid_psite
    enum: *id001
    description: 'Quantification method for translational efficiency analysis: ''plastid_psite'' (in-frame
      P-site counts from plastid, default), ''alignment'' (STAR -> Salmon) or ''pseudo'' (Salmon pseudo-alignment).'
    help_text: 'Default is ''plastid_psite'': Ribo-seq reads are counted only when their inferred
      P-site coincides with an in-frame codon position in an annotated CDS (derived from plastid wiggle
      tracks). This is the scientifically appropriate quantity for Ribo-seq, because Salmon''s underlying
      assumptions (uniform coverage, fragment-length distribution, multi-mapping resolution from longer/paired
      reads) are violated by short, length-constrained Ribo-seq footprints (see Ribomap, Bioinformatics
      2016). Choose ''alignment'' to keep STAR alignment followed by Salmon in alignment-based mode,
      e.g. for backward compatibility, comparison with prior runs, or downstream tools that expect
      Salmon-format transcript-level counts. Choose ''pseudo'' for direct Salmon pseudo-alignment
      from reads, an experimental alternative that uses the same k-mer index for both modalities and
      may help reduce length-related quantification biases without requiring read trimming.'
    fa_icon: fas fa-calculator
- group_id: riboseq_specific_options
  name: translational_efficiency_method
  source_name: translational_efficiency_method
  type: string
  required: false
  default: anota2seq
  enum: null
  description: Comma-separated list of translational efficiency methods to run; any of `anota2seq`,
    `deltate`, `dotseq`. Each runs independently. `dotseq` is ORF-level only (no gene-level fit) and
    requires `--extended_orf_analysis true`.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - anota2seq
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Riboseq-specific options
  raw_schema:
    type: string
    default: anota2seq
    description: Comma-separated list of translational efficiency methods to run; any of `anota2seq`,
      `deltate`, `dotseq`. Each runs independently. `dotseq` is ORF-level only (no gene-level fit)
      and requires `--extended_orf_analysis true`.
    pattern: ^(anota2seq|deltate|dotseq)(,(anota2seq|deltate|dotseq))*$
    fa_icon: fas fa-balance-scale
