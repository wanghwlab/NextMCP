- group_id: riboseq_specific_options
  name: equalise_read_lengths
  source_name: equalise_read_lengths
  type: boolean
  required: false
  default: false
  enum: null
  description: Trim RNA-seq reads to match Ribo-seq read lengths before quantification. This addresses
    potential biases when comparing the two modalities due to different read lengths.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Riboseq-specific options
  raw_schema:
    type: boolean
    default: false
    description: Trim RNA-seq reads to match Ribo-seq read lengths before quantification. This addresses
      potential biases when comparing the two modalities due to different read lengths.
    fa_icon: fas fa-ruler-horizontal
- group_id: riboseq_specific_options
  name: equalise_read_lengths_target
  source_name: equalise_read_lengths_target
  type: integer
  required: false
  default: null
  enum: null
  description: Target read length for RNA-seq trimming. If not specified, the average Ribo-seq read
    length will be derived from paired samples using seqkit stats. This parameter is required if RNA-seq
    samples have no paired Ribo-seq sample.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Riboseq-specific options
  raw_schema:
    type: integer
    minimum: 15
    description: Target read length for RNA-seq trimming. If not specified, the average Ribo-seq read
      length will be derived from paired samples using seqkit stats. This parameter is required if
      RNA-seq samples have no paired Ribo-seq sample.
    fa_icon: fas fa-ruler
- group_id: riboseq_specific_options
  name: ribo_lfc_threshold
  source_name: ribo_lfc_threshold
  type: number
  required: false
  default: 0
  enum: null
  description: Minimum absolute log2 fold change for translated mRNA (Ribo-seq) to be considered significant.
    Set to 0 to disable. Maps to anota2seq selDeltaP / deltaTE lfc_threshold_ribo.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 0
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Riboseq-specific options
  raw_schema:
    type: number
    default: 0
    description: Minimum absolute log2 fold change for translated mRNA (Ribo-seq) to be considered
      significant. Set to 0 to disable. Maps to anota2seq selDeltaP / deltaTE lfc_threshold_ribo.
    fa_icon: fas fa-ruler-vertical
- group_id: riboseq_specific_options
  name: rna_lfc_threshold
  source_name: rna_lfc_threshold
  type: number
  required: false
  default: 0
  enum: null
  description: Minimum absolute log2 fold change for total mRNA to be considered significant. Set
