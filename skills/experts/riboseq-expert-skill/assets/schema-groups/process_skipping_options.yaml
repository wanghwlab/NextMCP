  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Process skipping options
  raw_schema:
    type: integer
    default: 1
    minimum: 1
    description: Minimum number of ORF callers that must agree for an ORF to enter the consensus catalogue
      view.
    help_text: The full catalogue is an unfiltered cross-caller/cross-sample union and is always published.
      In addition, a consensus view (`orf_predictions/catalogue/consensus/`) is published containing
      only ORFs supported by at least this many distinct callers (and at least `--orf_min_samples`
      samples). Default 1 applies no caller filter, so the consensus view equals the full merged catalogue.
      Set 2 or higher for a higher-confidence catalogue that tames downstream ORF-level multiple testing.
    fa_icon: fas fa-users
