  mapping_flags: []
  source_section: Process skipping options
  raw_schema:
    type: boolean
    description: Skip the peptide-level small-ORF deduplication of the cross-sample ORF catalogue.
    help_text: By default the catalogue clusters its amino-acid sequences with MMseqs2 (`--min-seq-id
      0.9 -c 0.8`) and folds each multi-member small-ORF cluster (`aa_length` <= `--smorf_max_aa`)
      down to one representative, following the GENCODE Ribo-seq ORF catalogue convention (Mudge et
      al. 2022). Set true to publish the coordinate-merged catalogue without this sequence-level collapse,
      e.g. when you want to inspect every redundant copy. Has no effect unless `--extended_orf_analysis
      true`.
    fa_icon: fas fa-layer-group
