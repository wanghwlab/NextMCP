  raw_schema:
    type: boolean
    default: true
    description: Skip StringTie reference-guided transcript assembly and merge.
    help_text: When `false`, the pipeline runs StringTie per sample (reference-guided) then merges
      per-sample GTFs into a unified annotation. RNA-seq BAMs are used for assembly. Merged transcripts
      are classified with gffcompare and filtered to class codes set by `--gffcompare_class_codes`.
      The filtered novel GTF is concatenated with `--canonical_gtf` to produce `<outdir>/transcript_assembly/stringtie/hybrid_reference.gtf`.
      Ignored when `--novel_gtf` is supplied.
    fa_icon: fas fa-fast-forward
