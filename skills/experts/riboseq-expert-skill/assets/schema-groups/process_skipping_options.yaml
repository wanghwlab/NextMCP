group:
  id: process_skipping_options
  label: Process skipping options
  selection_rule: Use this group for parameters defined under the `Process skipping options` top-level
    schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/process_skipping_options.md
  - assets/schema-groups/process_skipping_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section `process_skipping_options`
    for exact lookup.
parameters:
- group_id: process_skipping_options
  name: extended_orf_analysis
  source_name: extended_orf_analysis
  type: boolean
  required: false
  default: null
  enum: null
  description: Discover novel ORFs in novel intergenic transcripts (from StringTie or user-supplied
    --novel_gtf) by feeding the hybrid GTF to genome-BAM ORF callers (Ribo-TISH predict, Ribotricer).
    Also enables the cross-caller ORF catalogue and ORF-level quantification, which do not need a
    novel-transcript source. Default false for backward compatibility.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass the value under nextflow_run(params=...) using the exact schema type, enum and
    constraints; this field is not a filesystem path.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Process skipping options
  raw_schema:
    type: boolean
    description: Discover novel ORFs in novel intergenic transcripts (from StringTie or user-supplied
      --novel_gtf) by feeding the hybrid GTF to genome-BAM ORF callers (Ribo-TISH predict, Ribotricer).
      Also enables the cross-caller ORF catalogue and ORF-level quantification, which do not need
      a novel-transcript source. Default false for backward compatibility.
    help_text: When true and a novel-transcript source is enabled (--skip_stringtie false or --novel_gtf),
      the hybrid GTF (<outdir>/transcript_assembly/stringtie/hybrid_reference.gtf) is passed to Ribo-TISH
      predict (-g) and Ribotricer prepare-orfs so that novel intergenic ORFs are within scope. RiboCode,
      riboWaltz and Salmon continue to read the reference transcriptome, and plastid P-site quantification
      the canonical backbone, regardless of this flag (RiboCode's transcriptome-coordinate BAM is
      keyed to the reference transcriptome FASTA used at alignment time). This flag also gates the
      cross-caller ORF catalogue, per-ORF P-site quantification and ORF-level differential translation,
      none of which need novel transcripts. When true but no novel-transcript source is configured,
      hybrid routing into the callers is a no-op and a warning is emitted, but the catalogue is still
      built against the full reference annotation.
    fa_icon: fas fa-expand-arrows-alt
- group_id: process_skipping_options
  name: novel_gtf
  source_name: novel_gtf
  type: string
  required: false
  default: null
  enum: null
  description: Optional user-supplied novel-transcript GTF. When provided, StringTie assembly is skipped
    and this GTF is used directly as the source of novel transcripts.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genes.gtf
  example_values:
  - <server_reference_root>/genes.gtf
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference, database, or prebuilt
    index value. Prefer reuse of confirmed server-side assets over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Process skipping options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.gtf(\.gz)?$
    description: Optional user-supplied novel-transcript GTF. When provided, StringTie assembly is
      skipped and this GTF is used directly as the source of novel transcripts.
    help_text: Useful when you already have a curated cell-type-specific annotation (e.g. from long-read
      RNA-seq or a published ORF catalogue). The supplied GTF is still passed through the gffcompare
      class-code filter (`--gffcompare_class_codes`, default `u` = intergenic only) so users can submit
      annotations containing any class of transcript and have the pipeline retain only the intergenic
      ones.
    fa_icon: fas fa-file-import
- group_id: process_skipping_options
  name: rrna_blacklist
  source_name: rrna_blacklist
  type: string
  required: false
  default: null
  enum: null
  description: Optional BED file of rRNA/repeat regions to exclude from the novel-transcript GTF (strand-aware
    intersect).
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/rrna_blacklist.bed
  example_values:
  - <server_reference_root>/rrna_blacklist.bed
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference, database, or prebuilt
    index value. Prefer reuse of confirmed server-side assets over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Process skipping options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.bed(\.gz)?$
    description: Optional BED file of rRNA/repeat regions to exclude from the novel-transcript GTF
      (strand-aware intersect).
    help_text: When supplied, novel transcripts overlapping the blacklist on the same strand are removed
      via `bedtools intersect -v -s`. UCSC publishes ready-made blacklists for hg38 and mm10; for
      other organisms you must construct one yourself or omit this parameter (the step is skipped
      silently).
    fa_icon: fas fa-ban
- group_id: process_skipping_options
  name: run_price
  source_name: run_price
  type: boolean
  required: false
  default: null
  enum: null
  description: Opt in to running PRICE as an additional ORF caller (Bayesian, slow).
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Process skipping options
  raw_schema:
    type: boolean
    description: Opt in to running PRICE as an additional ORF caller (Bayesian, slow).
    help_text: PRICE (Probabilistic inference of codon activities, Erhard et al. 2018) is a Bayesian
      ORF caller distributed as part of the Gedi Java framework (`gedi -e Price`). It is opt-in because
      the EM fit dominates runtime at full scale. PRICE is invoked once across the riboseq cohort
      (it estimates a shared codon-position model) so the whole BAM cohort is staged into a single
      task; expect higher disk I/O than per-sample callers on local executors. PRICE joins the cross-caller
      ORF catalogue alongside Ribo-TISH, RiboCode and Ribotricer.
    fa_icon: fas fa-fast-forward
- group_id: process_skipping_options
  name: run_ribotricer
  source_name: run_ribotricer
  type: boolean
  required: false
  default: null
  enum: null
  description: Opt in to running Ribotricer as an additional ORF caller.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Process skipping options
  raw_schema:
    type: boolean
    description: Opt in to running Ribotricer as an additional ORF caller.
    help_text: Ribotricer is disabled by default because benchmark data (FK/NGB, May 2026) showed
      its ORF-score column is rank-unstable across biological replicates (mean Spearman 0.288 vs Jaccard
      0.770). Its binary call set is reproducible, but the score should not be used as a primary ranking
      source. Enable with `--run_ribotricer true` if you need its calls; the pipeline will warn at
      runtime and exclude its score column from any cross-caller rank aggregation.
    fa_icon: fas fa-fast-forward
- group_id: process_skipping_options
  name: run_rpbp
  source_name: run_rpbp
  type: boolean
  required: false
  default: null
  enum: null
  description: Opt in to running Rp-Bp as an additional ORF caller (Bayesian, slow).
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes before changing
    this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Process skipping options
  raw_schema:
    type: boolean
    description: Opt in to running Rp-Bp as an additional ORF caller (Bayesian, slow).
    help_text: Rp-Bp (Malone et al. 2017) is a Bayesian-strict ORF caller that complements RiboCode's
      permissive canonical-CDS calls. Runtime is on the order of 20-24h per replicate at genome-wide
      scale because the MCMC fit dominates, hence it is opt-in. Plan accordingly. Rp-Bp's score column
      (Bayes factor) participates in the cross-caller rank aggregation alongside RiboCode and Ribo-TISH.
    fa_icon: fas fa-fast-forward
