  raw_schema:
    type: string
    default: u
    description: Comma-separated gffcompare class codes to retain when filtering novel transcripts.
    help_text: Default `u` keeps only unambiguously intergenic transcripts. Stranded users may add
      `x` (antisense overlap with a known locus) via `--gffcompare_class_codes 'u,x'` to recover translated
      antisense transcripts; this is unsafe for non-stranded or partially-stranded protocols. See
      https://ccb.jhu.edu/software/stringtie/gffcompare.shtml for the full class-code list.
    fa_icon: fas fa-filter
