group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome options` top-level
    schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section `reference_genome_options`
    for exact lookup.
parameters:
- group_id: reference_genome_options
  name: additional_fasta
  source_name: additional_fasta
  type: string
  required: false
  default: null
  enum: null
  description: FASTA file to concatenate to genome FASTA file e.g. containing spike-in sequences.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference, database, or prebuilt
    index value. Prefer reuse of confirmed server-side assets over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    fa_icon: far fa-file-code
    description: FASTA file to concatenate to genome FASTA file e.g. containing spike-in sequences.
    help_text: If provided, the sequences in this file will get concatenated to the existing genome
      FASTA file, a GTF file will be automatically created using the entire sequence as the gene,
      transcript, and exon features, and any alignment index will get created from the combined FASTA
      and GTF. It is recommended to save the reference with `--save_reference` to re-use the index
      for future runs so you do not need to create it again.
- group_id: reference_genome_options
  name: canonical_gtf
  source_name: canonical_gtf
  type: string
  required: false
  default: null
  enum: null
  description: Optional one-transcript-per-gene canonical GTF used as the annotation backbone for
    the genome-coordinate ORF callers (Ribo-TISH, Ribotricer), plastid P-site quantification and DTE.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genes.gtf
  example_values:
  - <server_reference_root>/genes.gtf
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference, database, or prebuilt
    index value. Prefer reuse of confirmed server-side assets over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.gtf(\.gz)?$
    description: Optional one-transcript-per-gene canonical GTF used as the annotation backbone for
      the genome-coordinate ORF callers (Ribo-TISH, Ribotricer), plastid P-site quantification and
      DTE.
    fa_icon: fas fa-code-branch
    help_text: 'When supplied, this GTF replaces the full multi-isoform `--gtf` as the annotation
      backbone for the genome-coordinate ORF callers (Ribo-TISH, Ribotricer), plastid P-site quantification
      and the translational-efficiency analysis. The full `--gtf` is retained both for genome-guided
      alignment (STAR/Salmon) and for the transcriptome-coordinate tools (RiboCode, riboWaltz, Salmon),
      whose input is the reference-transcriptome BAM and so must match the full multi-isoform transcript
      set. When omitted, the pipeline falls back to AGAT longest-CDS-isoform extraction from the full
      GTF; if that is unavailable, the full GTF is used as the backbone (with a multi-isoform ambiguity
      warning). Recommended sources: MANE Select for human (https://ftp.ncbi.nlm.nih.gov/refseq/MANE/MANE_human/current/),
      or `grep ''tag "Ensembl_canonical"'' input.gtf > canonical.gtf` for any Ensembl organism at
      release ≥104.'
- group_id: reference_genome_options
  name: fasta
  source_name: fasta
  type: string
  required: false
  default: null
  enum: null
  description: Path to FASTA genome file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference, database, or prebuilt
    index value. Prefer reuse of confirmed server-side assets over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    description: Path to FASTA genome file.
    help_text: This parameter is *mandatory* if `--genome` is not specified. If you don't have the
      appropriate alignment index available this will be generated for you automatically. Combine
      with `--save_reference` to save alignment index for future runs.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: gencode
  source_name: gencode
  type: boolean
  required: false
  default: null
  enum: null
  description: Specify if your GTF annotation is in GENCODE format.
  classification: route_shaping
