      from the input GTF file when running Salmon.
    help_text: 'This behaviour can be modified by specifying `--gtf_extra_attributes` when running
      the pipeline. Note that you can also specify more than one desired value, separated by a comma
      e.g. `--gtf_extra_attributes gene_id,...`.

