  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass the value under nextflow_run(params=...) using the exact schema type, enum and
    constraints; this field is not a filesystem path.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    fa_icon: fas fa-code-branch
    description: Specify if your GTF annotation is in GENCODE format.
