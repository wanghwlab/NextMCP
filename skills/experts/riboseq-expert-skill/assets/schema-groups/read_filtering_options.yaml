group:
  id: read_filtering_options
  label: Read filtering options
  selection_rule: Use this group for parameters defined under the `Read filtering
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/read_filtering_options.md
  - assets/schema-groups/read_filtering_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `read_filtering_options` for exact lookup.
parameters:
- group_id: read_filtering_options
  name: bbsplit_fasta_list
  source_name: bbsplit_fasta_list
  type: string
  required: false
  default: null
  enum: null
  description: Path to comma-separated file containing a list of reference genomes
    to filter reads against with BBSplit. You have to also explicitly set `--skip_bbsplit
    false` if you want to use BBSplit.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    fa_icon: fas fa-list-alt
    description: Path to comma-separated file containing a list of reference genomes
      to filter reads against with BBSplit. You have to also explicitly set `--skip_bbsplit
      false` if you want to use BBSplit.
    help_text: "The file should contain 2 columns: short name and full path to reference\
      \ genome(s) e.g. \n```\nmm10,/path/to/mm10.fa\necoli,/path/to/ecoli.fa\n```"
- group_id: read_filtering_options
  name: remove_ribo_rna
  source_name: remove_ribo_rna
  type: boolean
  required: false
  default: true
  enum: null
  description: Enable the removal of reads derived from ribosomal RNA.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: boolean
    fa_icon: fas fa-trash-alt
    description: Enable the removal of reads derived from ribosomal RNA.
    help_text: Any patterns found in the sequences defined by the '--ribo_database_manifest'
      parameter will be used. The tool used can be selected with '--ribo_removal_tool'.
    default: true
- group_id: read_filtering_options
  name: ribo_database_manifest
  source_name: ribo_database_manifest
  type: string
  required: false
  default: ${projectDir}/assets/rrna-db-defaults.txt
  enum: null
  description: Text file containing paths to fasta files (one per line) that will
    be used to create the database for rRNA removal.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/manifest.tsv
  example_values:
  - <server_reference_root>/manifest.tsv
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    default: ${projectDir}/assets/rrna-db-defaults.txt
    fa_icon: fas fa-database
    description: Text file containing paths to fasta files (one per line) that will
      be used to create the database for rRNA removal.
    help_text: 'By default, [rRNA databases](https://github.com/biocore/sortmerna/tree/master/data/rRNA_databases)
      defined in the SortMeRNA GitHub repo are used. You can see an example in the
      pipeline Github repository in `assets/rrna-default-dbs.txt`. This is used by
      SortMeRNA and Bowtie2 (RiboDetector does not require a reference database).

      Please note that commercial/non-academic entities require [`licensing for SILVA`](https://www.arb-silva.de/silva-license-information)
      for these default databases.'
- group_id: read_filtering_options
  name: ribo_removal_tool
  source_name: ribo_removal_tool
  type: string
  required: false
  default: sortmerna
  enum: &id001
  - sortmerna
  - bowtie2
  - ribodetector
  description: Specifies which tool to use for ribosomal RNA removal.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - sortmerna
  - bowtie2
  - ribodetector
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: string
    default: sortmerna
    fa_icon: fas fa-trash-alt
    description: Specifies which tool to use for ribosomal RNA removal.
    help_text: Available options are 'sortmerna', 'bowtie2', and 'ribodetector'. SortMeRNA
      uses k-mer matching against rRNA databases. Bowtie2 aligns reads against rRNA
      references and filters aligned reads. RiboDetector uses machine learning to
      identify rRNA reads without requiring a reference database.
    enum: *id001
- group_id: read_filtering_options
  name: bbsplit_index
  source_name: bbsplit_index
  type: string
  required: false
  default: null
  enum: null
  description: Path to directory or tar.gz archive for pre-built BBSplit index.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/bbsplit_index
  example_values:
  - <server_reference_root>/bbsplit_index
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: string
    format: path
    exists: true
    fa_icon: fas fa-bezier-curve
    description: Path to directory or tar.gz archive for pre-built BBSplit index.
    help_text: The BBSplit index will have to be built at least once with this pipeline
      (see `--save_reference` to save index). It can then be provided via `--bbsplit_index`
      for future runs.
- group_id: read_filtering_options
  name: extra_fqlint_args
  source_name: extra_fqlint_args
  type: string
  required: false
  default: --disable-validator P001
  enum: null
  description: Extra arguments to pass to the fq lint command.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - --disable-validator P001
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: string
    default: --disable-validator P001
    description: Extra arguments to pass to the fq lint command.
    fa_icon: far fa-check-square
- group_id: read_filtering_options
  name: ribodetector_chunk_size
  source_name: ribodetector_chunk_size
  type: integer
  required: false
  default: 100
  enum: null
  description: Chunk size for RiboDetector to control memory usage.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 100
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: integer
    default: 100
    fa_icon: fas fa-memory
    description: Chunk size for RiboDetector to control memory usage.
    help_text: Sets the number of read chunks processed at a time by RiboDetector,
      where each chunk contains 1024 reads. For example, chunk_size=100 means 102,400
      reads are loaded into memory at once. Lower values reduce memory consumption.
      The default of 100 typically results in ~8GB memory usage and keeps memory manageable
      without affecting throughput. Only used when 'ribo_removal_tool' is set to 'ribodetector'.
- group_id: read_filtering_options
  name: sortmerna_index
  source_name: sortmerna_index
  type: string
  required: false
  default: null
  enum: null
  description: Path to directory or tar.gz archive for pre-built sortmerna index.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/sortmerna_index
  example_values:
  - <server_reference_root>/sortmerna_index
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read filtering options
  raw_schema:
    type: string
    format: path
    exists: true
    fa_icon: fas fa-bezier-curve
    description: Path to directory or tar.gz archive for pre-built sortmerna index.
    help_text: The sortmerna index will have to be built at least once with this pipeline
      (see `--save_reference` to save index). It can then be provided via `--sortmerna_index`
      for future runs.
