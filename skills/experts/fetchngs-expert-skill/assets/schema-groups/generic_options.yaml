group:
  id: generic_options
  label: Generic options
  selection_rule: Use this group for parameters defined under the `Generic options`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/generic_options.md
  - assets/schema-groups/generic_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `generic_options` for exact lookup.
parameters:
- group_id: generic_options
  name: help
  source_name: help
  type: boolean
  required: false
  default: null
  enum: null
  description: Display help text.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    description: Display help text.
    fa_icon: fas fa-question-circle
    hidden: true
- group_id: generic_options
  name: monochrome_logs
  source_name: monochrome_logs
  type: boolean
  required: false
  default: null
  enum: null
  description: Do not use coloured log outputs.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    description: Do not use coloured log outputs.
    fa_icon: fas fa-palette
    hidden: true
- group_id: generic_options
  name: plaintext_email
  source_name: plaintext_email
  type: boolean
  required: false
  default: null
  enum: null
  description: Send plain-text email instead of HTML.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    description: Send plain-text email instead of HTML.
    fa_icon: fas fa-remove-format
    hidden: true
- group_id: generic_options
  name: publish_dir_mode
  source_name: publish_dir_mode
  type: string
  required: false
  default: copy
  enum: &id001
  - symlink
  - rellink
  - link
  - copy
  - copyNoFollow
  - move
  description: Method used to save pipeline results to output directory.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - symlink
  - rellink
  - link
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: string
    default: copy
    description: Method used to save pipeline results to output directory.
    help_text: The Nextflow `publishDir` option specifies which intermediate files
      should be saved to the output directory. This option tells the pipeline what
      method should be used to move these files. See [Nextflow docs](https://www.nextflow.io/docs/latest/process.html#publishdir)
      for details.
    fa_icon: fas fa-copy
    enum: *id001
    hidden: true
- group_id: generic_options
  name: validate_params
  source_name: validate_params
  type: boolean
  required: false
  default: true
  enum: null
  description: Boolean whether to validate parameters against the schema at runtime
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    description: Boolean whether to validate parameters against the schema at runtime
    default: true
    fa_icon: fas fa-check-square
    hidden: true
- group_id: generic_options
  name: validationFailUnrecognisedParams
  source_name: validationFailUnrecognisedParams
  type: boolean
  required: false
  default: null
  enum: null
  description: Validation of parameters fails when an unrecognised parameter is found.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    fa_icon: far fa-check-circle
    description: Validation of parameters fails when an unrecognised parameter is
      found.
    hidden: true
    help_text: By default, when an unrecognised parameter is found, it returns a warinig.
- group_id: generic_options
  name: validationLenientMode
  source_name: validationLenientMode
  type: boolean
  required: false
  default: null
  enum: null
  description: Validation of parameters in lenient more.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    fa_icon: far fa-check-circle
    description: Validation of parameters in lenient more.
    hidden: true
    help_text: Allows string values that are parseable as numbers or booleans. For
      further information see [JSONSchema docs](https://github.com/everit-org/json-schema#lenient-mode).
- group_id: generic_options
  name: validationShowHiddenParams
  source_name: validationShowHiddenParams
  type: boolean
  required: false
  default: null
  enum: null
  description: Show all params when using `--help`
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    fa_icon: far fa-eye-slash
    description: Show all params when using `--help`
    hidden: true
    help_text: By default, parameters set as _hidden_ in the schema are not shown
      on the command line when a user runs with `--help`. Specifying this option will
      tell the pipeline to show all parameters.
- group_id: generic_options
  name: version
  source_name: version
  type: boolean
  required: false
  default: null
  enum: null
  description: Display version and exit.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: boolean
    description: Display version and exit.
    fa_icon: fas fa-question-circle
    hidden: true
- group_id: generic_options
  name: email_on_fail
  source_name: email_on_fail
  type: string
  required: false
  default: null
  enum: null
  description: Email address for completion summary, only when pipeline fails.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: medium
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Generic options
  raw_schema:
    type: string
    description: Email address for completion summary, only when pipeline fails.
    fa_icon: fas fa-exclamation-triangle
    pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
    help_text: An email address to send a summary email to when the pipeline is completed
      - ONLY sent if the pipeline does not exit successfully.
    hidden: true
- group_id: generic_options
  name: hook_url
  source_name: hook_url
  type: string
  required: false
  default: null
  enum: null
  description: Incoming hook URL for messaging service
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Generic options
  raw_schema:
    type: string
    description: Incoming hook URL for messaging service
    fa_icon: fas fa-people-group
    help_text: Incoming hook URL for messaging service. Currently, MS Teams and Slack
      are supported.
    hidden: true
