group:
  id: input_output_options
  label: Input/output options
  selection_rule: Use this group for parameters defined under the `Input/output options`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/input_output_options.md
  - assets/schema-groups/input_output_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `input_output_options` for exact lookup.
parameters:
- group_id: input_output_options
  name: dbgap_key
  source_name: dbgap_key
  type: string
  required: false
  default: null
  enum: null
  description: dbGaP repository key.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/cart.jwt
  example_values:
  - <server_input_root>/cart.jwt
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local JWT cart
    file for protected dbGaP data. Use with `download_method` set to `sratools`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    fa_icon: fas fa-address-card
    help_text: Path to a JWT cart file used to access protected dbGAP data on SRA
      using the sra-toolkit. Users with granted access to controlled data can download
      the JWT cart file for the study from the SRA Run Selector upon logging in. The
      JWT file can only be used on cloud platforms and is valid for 1 hour upon creation.
    format: file-path
    description: dbGaP repository key.
- group_id: input_output_options
  name: download_method
  source_name: download_method
  type: string
  required: false
  default: ftp
  enum: &id001
  - aspera
  - ftp
  - sratools
  description: Method to download FastQ files. Available options are 'aspera', 'ftp'
    or 'sratools'. Default is 'ftp'.
  classification: route_shaping
  channel: params
  placeholder: ftp
  example_values:
  - aspera
  - ftp
  - sratools
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    default: ftp
    fa_icon: fas fa-download
    enum: *id001
    description: Method to download FastQ files. Available options are 'aspera', 'ftp'
      or 'sratools'. Default is 'ftp'.
    help_text: FTP and Aspera CLI download FastQ files directly from the ENA FTP whereas
      sratools uses sra-tools to download *.sra files and convert to FastQ.
- group_id: input_output_options
  name: input
  source_name: input
  type: string
  required: true
  default: null
  enum: null
  description: File containing SRA/ENA/GEO/DDBJ identifiers one per line to download
    their associated metadata and FastQ files.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/ids.csv
  example_values:
  - <server_input_root>/ids.csv
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Input/output options
  raw_schema:
    type: string
    format: file-path
    exists: true
    schema: assets/schema_input.json
    mimetype: text/csv
    pattern: ^\S+\.(csv|tsv|txt)$
    fa_icon: fas fa-file-excel
    description: File containing SRA/ENA/GEO/DDBJ identifiers one per line to download
      their associated metadata and FastQ files.
- group_id: input_output_options
  name: nf_core_pipeline
  source_name: nf_core_pipeline
  type: string
  required: false
  default: null
  enum: &id002
  - rnaseq
  - atacseq
  - viralrecon
  - taxprofiler
  description: Name of supported nf-core pipeline e.g. 'rnaseq'. A samplesheet for
    direct use with the pipeline will be created with the appropriate columns.
  classification: route_shaping
  channel: params
  placeholder: rnaseq
  example_values:
  - rnaseq
  - atacseq
  - viralrecon
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    fa_icon: fab fa-apple
    description: Name of supported nf-core pipeline e.g. 'rnaseq'. A samplesheet for
      direct use with the pipeline will be created with the appropriate columns.
    enum: *id002
- group_id: input_output_options
  name: outdir
  source_name: outdir
  type: string
  required: true
  default: null
  enum: null
  description: The output directory where the results will be saved. You have to use
    absolute paths to storage on Cloud infrastructure.
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/fetchngs
  example_values:
  - <server_output_root>/fetchngs
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    format: directory-path
    description: The output directory where the results will be saved. You have to
      use absolute paths to storage on Cloud infrastructure.
    fa_icon: fas fa-folder-open
- group_id: input_output_options
  name: skip_fastq_download
  source_name: skip_fastq_download
  type: boolean
  required: false
  default: null
  enum: null
  description: Only download metadata for public data database ids and don't download
    the FastQ files.
  classification: route_shaping
  channel: params
  placeholder: 'true'
  example_values:
  - 'true'
  - 'false'
  mapping_notes: Pass under `nextflow_run(params=...)` as a boolean. Set true for
    metadata and samplesheet output without FASTQ downloads.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: boolean
    fa_icon: fas fa-fast-forward
    description: Only download metadata for public data database ids and don't download
      the FastQ files.
- group_id: input_output_options
  name: email
  source_name: email
  type: string
  required: false
  default: null
  enum: null
  description: Email address for completion summary.
  classification: lookup_only
  channel: params
  placeholder: user@example.org
  example_values:
  - <server_output_root>/email
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: medium
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Input/output options
  raw_schema:
    type: string
    description: Email address for completion summary.
    fa_icon: fas fa-envelope
    help_text: Set this parameter to your e-mail address to get a summary e-mail with
      details of the run sent to you when the workflow exits. If set in your user
      config file (`~/.nextflow/config`) then you don't need to specify this on the
      command line for every run.
    pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
- group_id: input_output_options
  name: ena_metadata_fields
  source_name: ena_metadata_fields
  type: string
  required: false
  default: null
  enum: null
  description: Comma-separated list of ENA metadata fields to fetch before downloading
    data.
  classification: lookup_only
  channel: params
  placeholder: run_accession,experiment_accession,library_layout,fastq_ftp,fastq_md5
  example_values:
  - <server_output_root>/ena_metadata_fields
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    fa_icon: fas fa-columns
    description: Comma-separated list of ENA metadata fields to fetch before downloading
      data.
    help_text: The default list of fields used by the pipeline can be found at the
      top of the [`bin/sra_ids_to_runinfo.py`](https://github.com/nf-core/fetchngs/blob/master/bin/sra_ids_to_runinfo.py)
      script within the pipeline repo. This pipeline requires a minimal set of fields
      to download FastQ files i.e. `'run_accession,experiment_accession,library_layout,fastq_ftp,fastq_md5'`.
      Full list of accepted metadata fields can be obtained from the [ENA API](https://www.ebi.ac.uk/ena/portal/api/returnFields?dataPortal=ena&format=tsv&result=read_run).
- group_id: input_output_options
  name: nf_core_rnaseq_strandedness
  source_name: nf_core_rnaseq_strandedness
  type: string
  required: false
  default: auto
  enum: null
  description: Value for 'strandedness' entry added to samplesheet created when using
    '--nf_core_pipeline rnaseq'.
  classification: lookup_only
  channel: params
  placeholder: auto
  example_values:
  - <server_output_root>/nf_core_rnaseq_strandedness
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    fa_icon: fas fa-dna
    description: Value for 'strandedness' entry added to samplesheet created when
      using '--nf_core_pipeline rnaseq'.
    help_text: The default is 'auto' which can be used with nf-core/rnaseq v3.10 onwards
      to auto-detect strandedness during the pipeline execution.
    default: auto
- group_id: input_output_options
  name: sample_mapping_fields
  source_name: sample_mapping_fields
  type: string
  required: false
  default: experiment_accession,run_accession,sample_accession,experiment_alias,run_alias,sample_alias,experiment_title,sample_title,sample_description
  enum: null
  description: Comma-separated list of ENA metadata fields used to create a separate
    'id_mappings.csv' and 'multiqc_config.yml' with selected fields that can be used
    to rename samples in general and in MultiQC.
  classification: lookup_only
  channel: params
  placeholder: experiment_accession,run_accession,sample_accession
  example_values:
  - <server_output_root>/samplesheet.csv
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Input/output options
  raw_schema:
    type: string
    fa_icon: fas fa-columns
    description: Comma-separated list of ENA metadata fields used to create a separate
      'id_mappings.csv' and 'multiqc_config.yml' with selected fields that can be
      used to rename samples in general and in MultiQC.
    default: experiment_accession,run_accession,sample_accession,experiment_alias,run_alias,sample_alias,experiment_title,sample_title,sample_description
