- group_id: reference_genome_options
  name: genome
  source_name: genome
  type: string
  required: false
  default: null
  enum: null
  description: Name of iGenomes reference.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/genome
  example_values:
  - <server_reference_root>/genome
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    description: Name of iGenomes reference.
    fa_icon: fas fa-book
    help_text: "If using a reference genome configured in the pipeline using iGenomes,\
      \ use this parameter to give the ID for the reference. This is then used to\
      \ build the full paths for all required reference genome files e.g. `--genome\
      \ GRCh38`. \n\nSee the [nf-core website docs](https://nf-co.re/usage/reference_genomes)\
      \ for more details."
- group_id: reference_genome_options
  name: macs_gsize
  source_name: macs_gsize
  type: number
  required: false
  default: null
  enum: null
  description: Effective genome size parameter required by MACS3.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/macs_gsize
  example_values:
  - <server_reference_root>/macs_gsize
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: number
    description: Effective genome size parameter required by MACS3.
    help_text: '[Effective genome size](https://github.com/taoliu/MACS#-g--gsize)
      parameter required by MACS3. If using an iGenomes reference these have been
      provided for any of the genomes available in the igenomes.config, and for the
      following read lengths (50,75,100,150,200) that should be set using the `--read_length`
      parameter. For other genomes, if this parameter is not specified it will be
      inferred using the provided `--read_length` or otherwise the pipeline execution
      will stop with an error.'
    fa_icon: fas fa-arrows-alt-h
