group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `reference_genome_options` for exact lookup.
parameters:
- group_id: reference_genome_options
  name: fasta
  source_name: fasta
  type: string
  required: true
  default: null
  enum: null
  description: Path to FASTA genome file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    description: Path to FASTA genome file.
    help_text: This parameter is *mandatory* if `--genome` is not specified. If you
      don't have the appropriate alignment index available this will be generated
      for you automatically. Combine with `--save_reference` to save alignment index
      for future runs.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: gene_bed
  source_name: gene_bed
  type: string
  required: false
  default: null
  enum: null
  description: Path to BED file containing gene intervals. This will be created from
    the GTF file if not specified.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/gene_bed.bed
  example_values:
  - <server_reference_root>/gene_bed.bed
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.bed(\.gz)?$
    fa_icon: fas fa-procedures
    description: Path to BED file containing gene intervals. This will be created
      from the GTF file if not specified.
- group_id: reference_genome_options
  name: gff
  source_name: gff
  type: string
  required: false
  default: null
  enum: null
  description: Path to GFF3 annotation file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/gff
  example_values:
  - <server_reference_root>/gff
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.gff(\.gz)?$
    fa_icon: fas fa-code-branch
    description: Path to GFF3 annotation file.
    help_text: Either this parameter or `--gtf` is *mandatory* if --genome is not
      specified.
- group_id: reference_genome_options
  name: gtf
  source_name: gtf
  type: string
  required: false
  default: null
  enum: null
  description: Path to GTF annotation file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genes.gtf
  example_values:
  - <server_reference_root>/genes.gtf
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.gtf(\.gz)?$
    description: Path to GTF annotation file.
    fa_icon: fas fa-code-branch
    help_text: Either this parameter or `--gff` is *mandatory* if --genome is not
      specified.
- group_id: reference_genome_options
  name: save_reference
  source_name: save_reference
  type: boolean
  required: false
  default: null
  enum: null
  description: If generated by the pipeline save the BWA index in the results directory.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/save_reference
  example_values:
  - <server_reference_root>/save_reference
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    description: If generated by the pipeline save the BWA index in the results directory.
    help_text: If the BWA index is generated by the pipeline use this parameter to
      save it to your results folder. These can then be used for future pipeline runs,
      reducing processing times.
    fa_icon: fas fa-save
- group_id: reference_genome_options
  name: blacklist
  source_name: blacklist
  type: string
  required: false
  default: null
  enum: null
  description: Path to blacklist regions in BED format, used for filtering alignments.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/blacklist
  example_values:
  - <server_reference_root>/blacklist
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    format: path
    exists: true
    description: Path to blacklist regions in BED format, used for filtering alignments.
    help_text: If provided, alignments that overlap with the regions in this file
      will be filtered out (see [ENCODE blacklists](https://sites.google.com/site/anshulkundaje/projects/blacklists)).
      The file should be in BED format. Blacklisted regions for *GRCh37*, *GRCh38*,
      *GRCm38*, *hg19*, *hg38*, *mm10* are bundled with the pipeline in the [`/assets/blacklists`](https://github.com/nf-core/chipseq/tree/master/assets/blacklists)
      directory, and as such will be automatically used if any of those genomes are
      specified with the `--genome` parameter.
    fa_icon: fas fa-book-dead
- group_id: reference_genome_options
  name: bowtie2_index
  source_name: bowtie2_index
