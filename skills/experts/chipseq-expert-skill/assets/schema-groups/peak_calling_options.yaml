group:
  id: peak_calling_options
  label: Peak calling options
  selection_rule: Use this group for parameters defined under the `Peak calling options`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/peak_calling_options.md
  - assets/schema-groups/peak_calling_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `peak_calling_options` for exact lookup.
parameters:
- group_id: peak_calling_options
  name: broad_cutoff
  source_name: broad_cutoff
  type: number
  required: false
  default: 0.1
  enum: null
  description: Specifies broad cutoff value for MACS3. Only used when --narrow_peak
    isnt specified.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 0.1
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: number
    default: 0.1
    description: Specifies broad cutoff value for MACS3. Only used when --narrow_peak
      isnt specified.
    fa_icon: fas fa-hand-scissors
- group_id: peak_calling_options
  name: narrow_peak
  source_name: narrow_peak
  type: boolean
  required: false
  default: null
  enum: null
  description: Run MACS3 in narrowPeak mode.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: boolean
    description: Run MACS3 in narrowPeak mode.
    help_text: MACS3 is run by default with the [`--broad`](https://github.com/taoliu/MACS#--broad)
      flag. Specify this flag to call peaks in narrowPeak mode.
    fa_icon: fas fa-arrows-alt-h
- group_id: peak_calling_options
  name: save_macs_pileup
  source_name: save_macs_pileup
  type: boolean
  required: false
  default: null
  enum: null
  description: Instruct MACS3 to create bedGraph files normalised to signal per million
    reads.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: boolean
    description: Instruct MACS3 to create bedGraph files normalised to signal per
      million reads.
    fa_icon: fas fa-save
- group_id: peak_calling_options
  name: skip_consensus_peaks
  source_name: skip_consensus_peaks
  type: boolean
  required: false
  default: null
  enum: null
  description: Skip consensus peak generation, annotation and counting.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/skip_consensus_peaks
  example_values:
  - <server_reference_root>/skip_consensus_peaks
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: boolean
    description: Skip consensus peak generation, annotation and counting.
    fa_icon: fas fa-fast-forward
- group_id: peak_calling_options
  name: skip_peak_annotation
  source_name: skip_peak_annotation
  type: boolean
  required: false
  default: null
  enum: null
  description: Skip annotation of MACS3 and consensus peaks with HOMER.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/skip_peak_annotation
  example_values:
  - <server_reference_root>/skip_peak_annotation
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: boolean
    fa_icon: fas fa-fast-forward
    description: Skip annotation of MACS3 and consensus peaks with HOMER.
- group_id: peak_calling_options
  name: skip_peak_qc
  source_name: skip_peak_qc
  type: boolean
  required: false
  default: null
  enum: null
  description: Skip MACS3 peak QC plot generation.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: boolean
    fa_icon: fas fa-fast-forward
    description: Skip MACS3 peak QC plot generation.
- group_id: peak_calling_options
  name: macs_fdr
  source_name: macs_fdr
  type: number
  required: false
  default: null
  enum: null
  description: Minimum FDR (q-value) cutoff for peak detection, --macs_fdr and --macs_pvalue
    are mutually exclusive.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: number
    description: Minimum FDR (q-value) cutoff for peak detection, --macs_fdr and --macs_pvalue
      are mutually exclusive.
    fa_icon: fas fa-sort-amount-down
- group_id: peak_calling_options
  name: macs_pvalue
  source_name: macs_pvalue
  type: number
  required: false
  default: null
  enum: null
  description: p-value cutoff for peak detection, --macs_fdr and --macs_pvalue are
    mutually exclusive. If --macs_pvalue cutoff is set, q-value will not be calculated
    and reported as -1 in the final .xls file.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: number
    description: p-value cutoff for peak detection, --macs_fdr and --macs_pvalue are
      mutually exclusive. If --macs_pvalue cutoff is set, q-value will not be calculated
      and reported as -1 in the final .xls file.
    fa_icon: fas fa-sort-amount-down
- group_id: peak_calling_options
  name: min_reps_consensus
  source_name: min_reps_consensus
  type: integer
  required: false
  default: 1
  enum: null
  description: Number of biological replicates required from a given condition for
    a peak to contribute to a consensus peak.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 1
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Peak calling options
  raw_schema:
    type: integer
    default: 1
    description: Number of biological replicates required from a given condition for
      a peak to contribute to a consensus peak.
    help_text: If you are confident you have good reproducibility amongst your replicates
      then you can increase the value of this parameter to create a 'reproducible'
      set of consensus peaks. For example, a value of 2 will mean peaks that have
      been called in at least 2 replicates will contribute to the consensus set of
      peaks, and as such peaks that are unique to a given replicate will be discarded.
    fa_icon: fas fa-sort-numeric-down
