- group_id: adapter_trimming_options
  name: trim_nextseq
  source_name: trim_nextseq
  type: integer
  required: false
  default: null
  enum: null
  description: Instructs Trim Galore to apply the --nextseq=X option, to trim based
    on quality after removing poly-G tails.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Adapter trimming options
  raw_schema:
    type: integer
    description: Instructs Trim Galore to apply the --nextseq=X option, to trim based
      on quality after removing poly-G tails.
    help_text: This enables the option Cutadapt `--nextseq-trim=3'CUTOFF` option via
      Trim Galore, which will set a quality cutoff (that is normally given with -q
      instead), but qualities of G bases are ignored. This trimming is in common for
      the NextSeq- and NovaSeq-platforms, where basecalls without any signal are called
      as high-quality G bases.
    fa_icon: fas fa-cut
