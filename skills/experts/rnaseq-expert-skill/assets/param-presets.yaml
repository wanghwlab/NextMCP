channel_boundaries:
  params: Pipeline-facing options such as input, outdir, references, route selectors, skip switches, save switches, and tool-specific extra arguments.
  config_files: Server-local Nextflow config files, including resource caps and executor-specific overrides.
  from_run_id: Public restart path for a previous nextmcp run.
  extra_args: Use only when no normalized field exists, such as passing -entry for interactive.nf.
default_path_rule: Use only nextmcp server filesystem paths returned by tools or confirmed by the user.
presets:
  star_salmon_default:
    use_when: Standard FASTQ RNA-seq analysis.
    params:
      aligner: star_salmon
      igenomes_ignore: true
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq
      fasta: <server_reference_root>/genome.fa
      gtf: <server_reference_root>/genes.gtf

  star_rsem:
    use_when: STAR alignment with RSEM expression estimates.
    params:
      aligner: star_rsem
      igenomes_ignore: true
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-rsem
      fasta: <server_reference_root>/genome.fa
      gtf: <server_reference_root>/genes.gtf

  hisat2_alignment_qc:
    use_when: HISAT2 alignment and QC without expression quantification.
    params:
      aligner: hisat2
      igenomes_ignore: true
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-hisat2
      fasta: <server_reference_root>/genome.fa
      gtf: <server_reference_root>/genes.gtf
      hisat2_index: <server_reference_root>/hisat2/

  pseudoalignment_only_salmon:
    use_when: Salmon-only quantification from FASTQ.
    params:
      skip_alignment: true
      pseudo_aligner: salmon
      igenomes_ignore: true
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-salmon-only
      transcript_fasta: <server_reference_root>/transcripts.fa
      salmon_index: <server_reference_root>/salmon/

  pseudoalignment_only_kallisto:
    use_when: Kallisto-only quantification from FASTQ.
    params:
      skip_alignment: true
      pseudo_aligner: kallisto
      igenomes_ignore: true
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-kallisto-only
      transcript_fasta: <server_reference_root>/transcripts.fa
      kallisto_index: <server_reference_root>/kallisto/

  bam_reprocessing:
    use_when: Reprocess BAMs generated by a previous nf-core/rnaseq run.
    params:
      skip_alignment: true
      aligner: star_salmon
      igenomes_ignore: true
    placeholders:
      input: <server_output_root>/<source_run>/pipeline_info/samplesheet_with_bams.csv
      outdir: <server_output_root>/rnaseq-bam-reprocess

  umi_in_read_sequence:
    use_when: UMI sequence is embedded in reads.
    params:
      with_umi: true
      umitools_extract_method: regex
      umi_dedup_tool: umitools
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-umi
      umitools_bc_pattern: <kit_specific_regex>

  umi_in_read_name:
    use_when: UMI sequence is already in the read name.
    params:
      with_umi: true
      skip_umi_extract: true
      umitools_umi_separator: ':'
      umi_dedup_tool: umitools
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-umi-readname

  contamination_screening:
    use_when: Add BBSplit, SortMeRNA, or Kraken2/Bracken checks.
    params:
      skip_bbsplit: false
      remove_ribo_rna: true
      contaminant_screening: kraken2_bracken
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-contamination
      bbsplit_fasta_list: <server_reference_root>/bbsplit_fasta_list.csv
      ribo_database_manifest: <server_reference_root>/rrna-db-manifest.txt
      kraken_db: <server_reference_root>/kraken2/

  sentieon_star:
    use_when: User asks to accelerate STAR with Sentieon.
    params:
      aligner: star_salmon
      use_sentieon_star: true
    prerequisites:
      - Server-side Nextflow secret SENTIEON_LICENSE_BASE64 must already be configured.
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-sentieon

  preprocessing_only:
    use_when: FASTQ preprocessing and QC without alignment or pseudoalignment.
    params:
      skip_alignment: true
      skip_pseudo_alignment: true
    placeholders:
      input: <server_input_root>/samplesheet.csv
      outdir: <server_output_root>/rnaseq-preprocess-only

  interactive_step:
    use_when: Run one entry from interactive.nf.
    params:
      outdir: <server_output_root>/rnaseq-interactive
    extra_args:
      - -entry
      - <STEP_NAME>
    placeholders:
      input: <server_input_root>/samplesheet.csv
      reads_dir: <server_output_root>/previous_step/reads
      bam_dir: <server_output_root>/previous_step/bam
