pipeline:
  id: rnaseq
  name: nf-core/rnaseq
  version: 3.22.2
  summary: RNA sequencing analysis pipeline for gene and isoform quantification with extensive QC.
source_basis:
  - authoring bundle fields: schema, documents, and source_files
  - pipeline directory: /root/key_projects/nextmcp/nf_pipeline/rnaseq
  - targeted extra: interactive.nf alternate step workflow
server_path_boundary:
  rule: All runtime paths are resolved on the nextmcp server filesystem.
  placeholders:
    input: <server_input_root>/samplesheet.csv
    outdir: <server_output_root>/rnaseq
    reference_root: <server_reference_root>/rnaseq
required_inputs:
  - name: input
    required_for: Most runs
    placeholder: <server_input_root>/samplesheet.csv
    notes: CSV samplesheet with FASTQ paths or pipeline-generated BAM paths.
  - name: outdir
    required_for: Published results
    placeholder: <server_output_root>/rnaseq
    notes: Results directory on the nextmcp server.
  - name: fasta
    required_for: Runs that build genome, STAR, Salmon, or Kallisto resources from references.
    placeholder: <server_reference_root>/genome.fa
    notes: Genome FASTA. May be replaced by compatible pre-built indices where documented.
  - name: gtf
    required_for: Standard quantification and QC routes.
    placeholder: <server_reference_root>/genes.gtf
    notes: Gene annotation GTF. GFF3 is an alternate schema field when the user has GFF3 only.
supported_modes:
  - id: star_salmon_default
    entry_target: pipeline id rnaseq
    use_when: Default route for splice-aware alignment plus Salmon gene and transcript matrices.
    route_params:
      aligner: star_salmon
  - id: star_rsem
    entry_target: pipeline id rnaseq
    use_when: User requests RSEM gene and isoform quantification from STAR-compatible alignments.
    route_params:
      aligner: star_rsem
  - id: hisat2_alignment_qc
    entry_target: pipeline id rnaseq
    use_when: User prefers HISAT2 or has STAR memory limits and accepts no expression quantification from HISAT2.
    route_params:
      aligner: hisat2
  - id: pseudoalignment_only
    entry_target: pipeline id rnaseq
    use_when: User wants Salmon or Kallisto quantification without genomic alignment.
    route_params:
      skip_alignment: true
      pseudo_aligner: salmon
  - id: bam_reprocessing
    entry_target: pipeline id rnaseq
    use_when: User has samplesheets with BAMs generated by an earlier nf-core/rnaseq run.
    route_params:
      skip_alignment: true
  - id: preprocessing_only
    entry_target: pipeline id rnaseq
    use_when: User only wants FASTQ QC, trimming, and filtering outputs.
    route_params:
      skip_alignment: true
      skip_pseudo_alignment: true
  - id: interactive_steps
    entry_target: server-local path to interactive.nf
    use_when: User asks to run one source-backed exploratory step such as STEP_QC or STEP_ALIGN_STAR.
alternate_entry:
  script: interactive.nf
  path_rule: Use nextflow_list_pipelines only when the server-local pipeline root is needed, then append interactive.nf.
  entries:
    - STEP_BUILD_STAR_INDEX
    - STEP_BUILD_SALMON_INDEX
    - STEP_BUILD_HISAT2_INDEX
    - STEP_BUILD_RSEM_INDEX
    - STEP_QC
    - STEP_TRIM
    - STEP_FILTER_RRNA
    - STEP_ALIGN_STAR
    - STEP_ALIGN_HISAT2
    - STEP_QUANTIFY_SALMON
    - STEP_QUANTIFY_RSEM
    - STEP_ASSEMBLE_STRINGTIE
    - STEP_QC_RSEQC
    - STEP_QC_QUALIMAP
    - STEP_QC_DESEQ2
resource_override:
  channel: config_files
  source_basis: conf/base.config uses label-based process resources; nextflow.config defines reports under params.outdir.
  guidance: Create a small server-local Nextflow config and pass it with nextflow_run(config_files=[...]).
  example: |
    process {
      resourceLimits = [cpus: 32, memory: '256.GB', time: '72.h']
    }
limitations:
  - HISAT2 route does not produce expression quantification in the documented pipeline.
  - BAM reprocessing is intended for BAM files generated by an earlier run of this same pipeline.
  - Sentieon STAR requires a server-side Nextflow secret named SENTIEON_LICENSE_BASE64.
  - SortMeRNA default SILVA-derived databases may require license review for commercial use.
