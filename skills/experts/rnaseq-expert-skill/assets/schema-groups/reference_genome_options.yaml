- group_id: reference_genome_options
  name: hisat2_build_memory
  source_name: hisat2_build_memory
  type: string
  required: false
  default: 200.GB
  enum: null
  description: Minimum memory required to use splice sites and exons in the HiSAT2
    index build process.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/hisat2_build_memory
  example_values:
  - <server_reference_root>/hisat2_build_memory
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    default: 200.GB
    fa_icon: fas fa-memory
    pattern: ^\d+(\.\d+)?\.?\s*(K|M|G|T)?B$
    description: Minimum memory required to use splice sites and exons in the HiSAT2
      index build process.
    help_text: HiSAT2 requires significant RAM to build genome indices for large genomes
      with splice sites and exons (human genome typically needs 200GB). If you provide
      less memory than this threshold, splice sites and exons will be ignored, reducing
      memory requirements. For small genomes, set a lower value; for larger genomes,
      provide more memory.
    errorMessage: Memory format must be a valid string like '200.GB', '16.MB', '8KB'.
