group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `reference_genome_options` for exact lookup.
parameters:
- group_id: reference_genome_options
  name: additional_fasta
  source_name: additional_fasta
  type: string
  required: false
  default: null
  enum: null
  description: FASTA file to concatenate to genome FASTA file e.g. containing spike-in
    sequences.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    fa_icon: far fa-file-code
    description: FASTA file to concatenate to genome FASTA file e.g. containing spike-in
      sequences.
    help_text: If provided, sequences in this file will be concatenated to the genome
      FASTA file. A GTF file will be automatically created using these sequences,
      and alignment indices will be created from the combined files. Use `--save_reference`
      to reuse these indices in future runs. Cannot be used together with `--transcript_fasta`
      when building a pseudo-aligner index - either omit `--transcript_fasta` or provide
      a pre-built index that already contains the spike-ins.
- group_id: reference_genome_options
  name: fasta
  source_name: fasta
  type: string
  required: false
  default: null
  enum: null
  description: Path to FASTA genome file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    description: Path to FASTA genome file.
    help_text: This parameter is mandatory if `--genome` is not specified. If you
      don't have the appropriate alignment index, it will be generated automatically.
      Use with `--save_reference` to store the index for future runs.
    fa_icon: far fa-file-code
    errorMessage: The FASTA file path must end with .fa, .fna, .fasta optionally with
      .gz, must not contain spaces, and must exist.
- group_id: reference_genome_options
  name: gencode
  source_name: gencode
  type: boolean
