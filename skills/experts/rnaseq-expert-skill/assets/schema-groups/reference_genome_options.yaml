  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    fa_icon: fas fa-code-branch
    description: Specify if your GTF annotation is in GENCODE format.
    help_text: If your GTF file is in GENCODE format and you want to run Salmon (using
      `--pseudo_aligner salmon`), enable this parameter to build the Salmon index
      correctly.
