group:
  id: alignment_options
  label: Alignment options
  selection_rule: Use this group for parameters defined under the `Alignment options`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/alignment_options.md
  - assets/schema-groups/alignment_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `alignment_options` for exact lookup.
parameters:
- group_id: alignment_options
  name: aligner
  source_name: aligner
  type: string
  required: false
  default: star_salmon
  enum: &id001
  - star_salmon
  - star_rsem
  - hisat2
  description: Specifies the alignment algorithm to use - available options are 'star_salmon',
    'star_rsem' and 'hisat2'.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - star_salmon
  - star_rsem
  - hisat2
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: string
    default: star_salmon
    description: Specifies the alignment algorithm to use - available options are
      'star_salmon', 'star_rsem' and 'hisat2'.
    fa_icon: fas fa-map-signs
    enum: *id001
- group_id: alignment_options
  name: bam_csi_index
  source_name: bam_csi_index
  type: boolean
  required: false
  default: null
  enum: null
  description: Create a CSI index for BAM files instead of the traditional BAI index.
    This will be required for genomes with larger chromosome sizes.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/bam_csi_index
  example_values:
  - <server_reference_root>/bam_csi_index
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: boolean
    description: Create a CSI index for BAM files instead of the traditional BAI index.
      This will be required for genomes with larger chromosome sizes.
    fa_icon: fas fa-sort-alpha-down
- group_id: alignment_options
  name: extra_star_align_args
  source_name: extra_star_align_args
  type: string
  required: false
  default: null
  enum: null
  description: Extra arguments to pass to STAR alignment command in addition to defaults
    defined by the pipeline. Only available for the STAR-Salmon route.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: string
    minLength: 1
    description: Extra arguments to pass to STAR alignment command in addition to
      defaults defined by the pipeline. Only available for the STAR-Salmon route.
    fa_icon: fas fa-plus
- group_id: alignment_options
  name: pseudo_aligner
  source_name: pseudo_aligner
  type: string
  required: false
  default: null
  enum: &id002
  - salmon
  - kallisto
  description: Specifies the pseudo aligner to use - available options are 'salmon'.
    Runs in addition to '--aligner'.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - salmon
  - kallisto
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: string
    description: Specifies the pseudo aligner to use - available options are 'salmon'.
      Runs in addition to '--aligner'.
    fa_icon: fas fa-hamburger
    enum: *id002
- group_id: alignment_options
  name: pseudo_aligner_kmer_size
  source_name: pseudo_aligner_kmer_size
  type: integer
  required: false
  default: 31
  enum: null
  description: Kmer length passed to indexing step of pseudoaligners
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 31
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: integer
    default: 31
    description: Kmer length passed to indexing step of pseudoaligners
    help_text: Setting an appropriate kmer size is crucial for quantification with
      Kallisto or Salmon. This is particularly important for short reads (<50bp),
      where the default size of 31 can cause problems.
    fa_icon: fas fa-ruler-horizontal
- group_id: alignment_options
  name: salmon_quant_libtype
  source_name: salmon_quant_libtype
  type: string
  required: false
  default: null
  enum: &id003
  - A
  - IS
  - ISF
  - ISR
  - IU
  - MS
  - MSF
  - MSR
  - MU
  - OS
  - OSF
  - OSR
  - OU
  - SF
  - SR
  - U
  description: Override Salmon library type inferred based on strandedness defined
    in meta object.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - A
  - IS
  - ISF
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: string
    fa_icon: fas fa-fast-forward
    description: ' Override Salmon library type inferred based on strandedness defined
      in meta object.'
    help_text: Refer to the [Salmon documentation](https://salmon.readthedocs.io/en/latest/library_type.html)
      for details on library types.
    enum: *id003
- group_id: alignment_options
  name: star_ignore_sjdbgtf
  source_name: star_ignore_sjdbgtf
  type: boolean
  required: false
  default: null
  enum: null
  description: When using pre-built STAR indices do not re-extract and use splice
    junctions from the GTF file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genes.gtf
  example_values:
  - <server_reference_root>/genes.gtf
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: boolean
    fa_icon: fas fa-ban
    description: When using pre-built STAR indices do not re-extract and use splice
      junctions from the GTF file.
- group_id: alignment_options
  name: stranded_threshold
  source_name: stranded_threshold
  type: number
  required: false
  default: 0.8
  enum: null
  description: The fraction of stranded reads that must be assigned to a strandedness
    for confident assignment. Must be at least 0.5.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 0.8
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: number
    minimum: 0.5
    maximum: 1
    default: 0.8
    description: The fraction of stranded reads that must be assigned to a strandedness
      for confident assignment. Must be at least 0.5.
- group_id: alignment_options
  name: stringtie_ignore_gtf
  source_name: stringtie_ignore_gtf
  type: boolean
  required: false
  default: null
  enum: null
  description: Perform reference-guided de novo assembly of transcripts using StringTie
    i.e. dont restrict to those in GTF file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genes.gtf
  example_values:
  - <server_reference_root>/genes.gtf
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: boolean
    description: Perform reference-guided de novo assembly of transcripts using StringTie
      i.e. dont restrict to those in GTF file.
    fa_icon: fas fa-ban
- group_id: alignment_options
  name: unstranded_threshold
  source_name: unstranded_threshold
  type: number
  required: false
  default: 0.1
  enum: null
  description: The difference in fraction of stranded reads assigned to 'forward'
    and 'reverse' below which a sample is classified as 'unstranded'. By default the
    forward and reverse fractions must differ by less than 0.1 for the sample to be
    called as unstranded.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 0.1
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: number
    minimum: 0
    maximum: 1
    default: 0.1
    description: The difference in fraction of stranded reads assigned to 'forward'
      and 'reverse' below which a sample is classified as 'unstranded'. By default
      the forward and reverse fractions must differ by less than 0.1 for the sample
      to be called as unstranded.
- group_id: alignment_options
  name: use_sentieon_star
  source_name: use_sentieon_star
  type: boolean
  required: false
  default: null
  enum: null
  description: Optionally accelerate STAR with Sentieon
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Alignment options
  raw_schema:
    type: boolean
    description: Optionally accelerate STAR with Sentieon
    fa_icon: fas fa-running
- group_id: alignment_options
  name: extra_kallisto_quant_args
