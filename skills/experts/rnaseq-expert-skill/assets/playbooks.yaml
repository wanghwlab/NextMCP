playbooks:
  - id: star_salmon_default
    use_when: Standard RNA-seq analysis with STAR alignment and Salmon quantification.
    prerequisites:
      - Confirm project and server-local samplesheet path.
      - Confirm outdir and reference paths or compatible pre-built STAR and Salmon resources.
      - Check whether strandedness is known or set to auto in the samplesheet.
    recommended_preset: star_salmon_default
    tool_sequence:
      - project_list() when the project id is unknown
      - project_get(project) when the project root or recent runs matter
      - fs_list(mode="manifest") for samplesheet, FASTA, GTF, or index paths that still need confirmation
      - nextflow_run(prepare=true) before launch when inputs or target outputs still need checking
      - nextflow_run(pipeline="rnaseq", project=..., params=...)
      - run_get(include=["progress","artifact_summary","diagnosis","next_actions"])
      - run_artifacts(...) after artifact_summary names result sections
    outputs_to_review:
      - multiqc/multiqc_report.html
      - star_salmon/salmon.merged.gene_counts.tsv
      - star_salmon/salmon.merged.transcript_counts.tsv
      - star_salmon/*/quant.sf
      - star_salmon/*Log.final.out
      - star_salmon/markduplicates/
      - pipeline_info/params.json

  - id: star_rsem_quantification
    use_when: User requests RSEM gene and isoform quantification.
    prerequisites:
      - Confirm STAR/RSEM-compatible references or let the pipeline build them.
      - Do not reuse STAR-Salmon BAMs for STAR-RSEM reprocessing.
    recommended_preset: star_rsem
    outputs_to_review:
      - star_rsem/rsem.merged.gene_counts.tsv
      - star_rsem/rsem.merged.transcript_counts.tsv
      - star_rsem/*.genes.results
      - star_rsem/*.isoforms.results
      - multiqc/multiqc_report.html

  - id: hisat2_alignment_qc
    use_when: User has STAR memory limits or wants HISAT2 alignment and QC.
    prerequisites:
      - Confirm the user accepts that HISAT2 does not produce expression quantification here.
      - Confirm HISAT2 index or enough memory to build it. The schema default for hisat2_build_memory is 200.GB.
    recommended_preset: hisat2_alignment_qc
    outputs_to_review:
      - hisat2/*.bam
      - hisat2/*.log
      - multiqc/multiqc_report.html

  - id: pseudoalignment_only
    use_when: User wants Salmon or Kallisto quantification without genomic alignment.
    prerequisites:
      - Set skip_alignment true and choose pseudo_aligner salmon or kallisto.
      - Prefer a decoy-aware Salmon index for Salmon, especially when skipping genomic alignment.
      - For Kallisto single-end data, confirm fragment length and standard deviation fields when needed.
    recommended_preset: pseudoalignment_only_salmon
    outputs_to_review:
      - salmon/salmon.merged.gene_counts.tsv
      - salmon/salmon.merged.transcript_counts.tsv
      - kallisto/kallisto.merged.gene_counts.tsv
      - multiqc/multiqc_report.html

  - id: bam_reprocessing
    use_when: User wants to reuse BAMs generated by an earlier nf-core/rnaseq run.
    prerequisites:
      - Recover or confirm samplesheets/samplesheet_with_bams.csv from the source run.
      - Set skip_alignment true.
      - Keep aligner compatible with the source run: star_salmon BAMs with star_salmon, star_rsem BAMs with star_rsem.
      - Read run_get(detail="full") on the source run when launch_spec or resume compatibility matters.
    recommended_preset: bam_reprocessing
    history_lookup:
      - run_list(artifact_path_contains="samplesheet_with_bams.csv") when the source run id is unknown
      - run_get(include=["artifact_summary"]) on candidate runs
      - run_artifacts(...) to find the samplesheet and params.json
    outputs_to_review:
      - pipeline_info/samplesheet_with_bams.csv
      - multiqc/multiqc_report.html

  - id: umi_run
    use_when: User has UMI barcodes in reads or read names.
    prerequisites:
      - Set with_umi true.
      - Confirm UMI location and pattern before choosing skip_umi_extract, umitools_extract_method, umitools_bc_pattern, umitools_bc_pattern2, or umitools_umi_separator.
      - Choose umi_dedup_tool as umitools or umicollapse.
    recommended_preset: umi_in_read_sequence
    outputs_to_review:
      - star_salmon/umitools/
      - star_salmon/*umi_dedup.sorted.bam
      - multiqc/multiqc_report.html

  - id: filtering_and_contamination
    use_when: User asks for BBSplit, rRNA removal, or Kraken2/Bracken contamination screening.
    prerequisites:
      - For BBSplit, provide bbsplit_fasta_list or bbsplit_index and set skip_bbsplit false.
      - For rRNA removal, set remove_ribo_rna true and confirm ribo_database_manifest or sortmerna_index.
      - For Kraken2/Bracken, set contaminant_screening and kraken_db; prefer kraken2_bracken when abundance estimates matter.
      - Review database license and suitability before launch.
    recommended_preset: contamination_screening
    outputs_to_review:
      - bbsplit/
      - sortmerna/
      - kraken2/
      - multiqc/multiqc_report.html

  - id: preprocessing_only
    use_when: User only wants raw read QC, trimming, BBSplit, or rRNA filtering.
    prerequisites:
      - Set skip_alignment true and skip_pseudo_alignment true.
      - Confirm whether skip_trimming, trimmer, remove_ribo_rna, or skip_bbsplit changes the requested outputs.
    recommended_preset: preprocessing_only
    outputs_to_review:
      - fastqc/
      - trimgalore/ or fastp/
      - bbsplit/
      - sortmerna/
      - multiqc/multiqc_report.html

  - id: interactive_entry
    use_when: User explicitly requests an exploratory step and the matching custom interactive.nf extension is confirmed installed.
    availability: This custom extension is not shipped here; scope it out when unavailable.
    prerequisites:
      - Resolve the server-local pipeline root only if the runtime needs an explicit interactive.nf path.
      - Pass the selected entry through extra_args because nextflow_run has no normalized entry field.
      - Confirm entry-specific inputs such as reads_dir, bam_dir, transcript_fasta, star_index, salmon_index, or counts_dir.
    recommended_preset: interactive_step
    outputs_to_review:
      - results/<run_id>/
      - run_get(include=["progress","artifact_summary","diagnosis","next_actions"])
