group:
  id: cellranger_multi_options
  label: Cellranger Multi options
  selection_rule: Use this group for parameters defined under the `Cellranger Multi
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/cellranger_multi_options.md
  - assets/schema-groups/cellranger_multi_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `cellranger_multi_options` for exact lookup.
parameters:
- group_id: cellranger_multi_options
  name: cellranger_multi_barcodes
  source_name: cellranger_multi_barcodes
  type: string
  required: false
  default: null
  enum: null
  description: Additional samplesheet to provide information about multiplexed samples.
    See the 'Usage' section for more details.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/cellranger_multi_barcodes
  example_values:
  - <server_input_root>/cellranger_multi_barcodes
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Cellranger Multi options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/csv
    description: Additional samplesheet to provide information about multiplexed samples.
      See the 'Usage' section for more details.
