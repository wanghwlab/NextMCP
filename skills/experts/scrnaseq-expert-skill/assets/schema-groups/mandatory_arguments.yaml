group:
  id: mandatory_arguments
  label: Mandatory arguments
  selection_rule: Use this group for parameters defined under the `Mandatory arguments`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/mandatory_arguments.md
  - assets/schema-groups/mandatory_arguments.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `mandatory_arguments` for exact lookup.
parameters:
- group_id: mandatory_arguments
  name: aligner
  source_name: aligner
  type: string
  required: false
  default: simpleaf
  enum: &id001
  - kallisto
  - star
  - simpleaf
  - cellranger
  - cellrangerarc
  - cellrangermulti
  description: Name of the tool to use for scRNA (pseudo-) alignment.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/aligner
  example_values:
  - kallisto
  - star
  - simpleaf
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Mandatory arguments
  raw_schema:
    type: string
    description: Name of the tool to use for scRNA (pseudo-) alignment.
    default: simpleaf
    help_text: "The workflow can handle three types of methods:\n\n- Kallisto/Bustools\n\
      - SimpleAF \n- STARsolo\n\nTo choose which one to use, please specify either\
      \ `simpleaf`, `star` or `kallisto` as a parameter option for `--aligner`. By\
      \ default, the pipeline runs the `simpleaf` option. Note that specifying another\
      \ aligner option also requires choosing appropriate parameters (see below) for\
      \ the selected option."
    fa_icon: fas fa-align-center
    enum: *id001
- group_id: mandatory_arguments
  name: barcode_whitelist
  source_name: barcode_whitelist
  type: string
  required: false
  default: null
  enum: null
  description: If not using the 10X Genomics platform, a custom barcode whitelist
    can be used with `--barcode_whitelist`.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/barcode_whitelist
  example_values:
  - <server_input_root>/barcode_whitelist
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Mandatory arguments
  raw_schema:
    type: string
    description: If not using the 10X Genomics platform, a custom barcode whitelist
      can be used with `--barcode_whitelist`.
    fa_icon: fas fa-barcode
    format: file-path
    exists: true
- group_id: mandatory_arguments
  name: protocol
  source_name: protocol
  type: string
  required: false
  default: auto
  enum: null
  description: "The protocol that was used to generate the single cell data, e.g.\
    \ 10x Genomics v2 Chemistry.\n\n Can be 'auto' (cellranger only), '10XV1', '10XV2',\
    \ '10XV3', '10XV4', or any other protocol string that will get directly passed\
    \ the respective aligner."
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/protocol
  example_values:
  - <server_input_root>/protocol
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Mandatory arguments
  raw_schema:
    type: string
    description: "The protocol that was used to generate the single cell data, e.g.\
      \ 10x Genomics v2 Chemistry.\n\n Can be 'auto' (cellranger only), '10XV1', '10XV2',\
      \ '10XV3', '10XV4', or any other protocol string that will get directly passed\
      \ the respective aligner."
    help_text: "The default is to auto-detect the protocol when running cellranger.\
      \ For all other aligners, the protocol MUST be manually specified. \n\n The\
      \ following protocols are recognized by the pipeline and mapped to the corresponding\
      \ protocol name of the respective aligner: '10XV1', '10XV2', '10XV3', '10XV4'.\
      \ \n\nAny other protocol value is passed to the aligner verbatim to support\
      \ other sequencing platforms. See the [kallisto](https://pachterlab.github.io/kallisto/manual#bus),\
      \ [simpleaf](https://simpleaf.readthedocs.io/en/latest/quant-command.html#a-note-on-the-chemistry-flag),\
      \ [starsolo](https://gensoft.pasteur.fr/docs/STAR/2.7.9a/STARsolo.html)"
    default: auto
    fa_icon: fas fa-cogs
