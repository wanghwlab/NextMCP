group:
  id: annotation
  label: Annotation
  selection_rule: Use this group for parameters defined under the `Annotation` top-level
    schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/annotation.md
  - assets/schema-groups/annotation.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `annotation` for exact lookup.
parameters:
- group_id: annotation
  name: bcftools_annotations
  source_name: bcftools_annotations
  type: string
  required: false
  default: null
  enum: null
  description: A vcf file containing custom annotations to be used with bcftools annotate.
    Needs to be bgzipped.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/bcftools_annotations
  example_values:
  - <server_reference_root>/bcftools_annotations
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Annotation
  raw_schema:
    type: string
    format: file-path
    pattern: ^\S+\.vcf\.gz$
    exists: true
    fa_icon: fas fa-file
    description: A vcf file containing custom annotations to be used with bcftools
      annotate. Needs to be bgzipped.
