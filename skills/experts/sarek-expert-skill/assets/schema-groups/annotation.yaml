- group_id: annotation
  name: dbnsfp_fields
  source_name: dbnsfp_fields
  type: string
  required: false
  default: rs_dbSNP,HGVSc_VEP,HGVSp_VEP,1000Gp3_EAS_AF,1000Gp3_AMR_AF,LRT_score,GERP++_RS,gnomAD_exomes_AF
  enum: null
  description: Fields to annotate with
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/dbnsfp_fields
  example_values:
  - <server_reference_root>/dbnsfp_fields
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Annotation
  raw_schema:
    type: string
    fa_icon: fas fa-border-all
    description: Fields to annotate with
    default: rs_dbSNP,HGVSc_VEP,HGVSp_VEP,1000Gp3_EAS_AF,1000Gp3_AMR_AF,LRT_score,GERP++_RS,gnomAD_exomes_AF
    help_text: 'To be used with `--vep_dbnsfp`.

      This params can be used to retrieve individual values from the dbNSFP file.
      The values correspond to the name of the columns in the dbNSFP file and are
      separated by comma.

      The column names might differ between the different dbNSFP versions. Please
      check the Readme.txt file, which is provided with the dbNSFP file, to obtain
      the correct column names. The Readme file contains also a short description
      of the provided values and the version of the tools used to generate them.


      Default value are explained below:


      rs_dbSNP - rs number from dbSNP

      HGVSc_VEP - HGVS coding variant presentation from VEP. Multiple entries separated
      by '';'', corresponds to Ensembl_transcriptid

      HGVSp_VEP - HGVS protein variant presentation from VEP. Multiple entries separated
      by '';'', corresponds to Ensembl_proteinid

      1000Gp3_EAS_AF - Alternative allele frequency in the 1000Gp3 East Asian descendent
      samples

      1000Gp3_AMR_AF - Alternative allele counts in the 1000Gp3 American descendent
      samples

      LRT_score - Original LRT two-sided p-value (LRTori), ranges from 0 to 1

      GERP++_RS - Conservation score. The larger the score, the more conserved the
      site, ranges from -12.3 to 6.17

      gnomAD_exomes_AF - Alternative allele frequency in the whole gnomAD exome samples.'
