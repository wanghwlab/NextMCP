group:
  id: main_options
  label: Main options
  selection_rule: Use this group for parameters defined under the `Main options` top-level
    schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/main_options.md
  - assets/schema-groups/main_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `main_options` for exact lookup.
parameters:
- group_id: main_options
  name: intervals
  source_name: intervals
  type: string
  required: false
  default: null
  enum: null
  description: Path to target bed file in case of whole exome or targeted sequencing
    or intervals file.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/intervals
  example_values:
  - <server_input_root>/intervals
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main options
  raw_schema:
    type: string
    fa_icon: fas fa-file-alt
    format: file-path
    pattern: \S+\.(bed|interval_list)$
    exists: true
    help_text: "To speed up preprocessing and variant calling processes, the execution\
      \ is parallelized across a reference chopped into smaller pieces.\n\nParts of\
      \ preprocessing and variant calling are done by these intervals, the different\
      \ resulting files are then merged.\nThis can parallelize processes, and push\
      \ down wall clock time significantly.\n\nWe are aligning to the whole genome,\
      \ and then run Base Quality Score Recalibration and Variant Calling on the supplied\
      \ regions.\n\n**Whole Genome Sequencing:**\n\nThe (provided) intervals are chromosomes\
      \ cut at their centromeres (so each chromosome arm processed separately) also\
      \ additional unassigned contigs.\n\nWe are ignoring the `hs37d5` contig that\
      \ contains concatenated decoy sequences.\n\nThe calling intervals can be defined\
      \ using a .list or a BED file.\nA .list file contains one interval per line\
      \ in the format `chromosome:start-end` (1-based coordinates).\nA BED file must\
      \ be a tab-separated text file with one interval per line.\nThere must be at\
      \ least three columns: chromosome, start, and end (0-based coordinates).\nAdditionally,\
      \ the score column of the BED file can be used to provide an estimate of how\
      \ many seconds it will take to call variants on that interval.\nThe fourth column\
      \ remains unused.\n\n```\n|chr1|10000|207666|NA|47.3|\n```\nThis indicates that\
      \ variant calling on the interval chr1:10001-207666 takes approximately 47.3\
      \ seconds.\n\nThe runtime estimate is used in two different ways.\nFirst, when\
      \ there are multiple consecutive intervals in the file that take little time\
      \ to compute, they are processed as a single job, thus reducing the number of\
      \ processes that needs to be spawned.\nSecond, the jobs with largest processing\
      \ time are started first, which reduces wall-clock time.\nIf no runtime is given,\
      \ a time of 200000 nucleotides per second is assumed. See `--nucleotides_per_second`\
      \ on how to customize this.\nActual figures vary from 2 nucleotides/second to\
      \ 30000 nucleotides/second.\nIf you prefer, you can specify the full path to\
      \ your reference genome when you run the pipeline:\n\n> **NB** If none provided,\
      \ will be generated automatically from the FASTA reference\n> **NB** Use --no_intervals\
      \ to disable automatic generation.\n\n**Targeted Sequencing:**\n\nThe recommended\
      \ flow for targeted sequencing data is to use the workflow as it is, but also\
      \ provide a `BED` file containing targets for all steps using the `--intervals`\
      \ option. In addition, the parameter `--wes` should be set.\nIt is advised to\
      \ pad the variant calling regions (exons or target) to some extent before submitting\
      \ to the workflow.\n\nThe procedure is similar to whole genome sequencing, except\
      \ that only BED file are accepted. See above for formatting description.\nAdding\
      \ every exon as an interval in case of `WES` can generate >200K processes or\
      \ jobs, much more forks, and similar number of directories in the Nextflow work\
      \ directory. These are appropriately  grouped together to reduce number of processes\
      \ run in parallel (see above and `--nucleotides_per_second` for details). \n\
      Furthermore, primers and/or baits are not 100% specific, (certainly not for\
      \ MHC and KIR, etc.), quite likely there going to be reads mapping to multiple\
      \ locations.\nIf you are certain that the target is unique for your genome (all\
      \ the reads will certainly map to only one location), and aligning to the whole\
      \ genome is an overkill, it is actually better to change the reference itself."
    description: Path to target bed file in case of whole exome or targeted sequencing
      or intervals file.
- group_id: main_options
  name: no_intervals
  source_name: no_intervals
  type: boolean
  required: false
  default: null
  enum: null
  description: Disable usage of intervals.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Main options
  raw_schema:
    type: boolean
    fa_icon: fas fa-ban
    description: Disable usage of intervals.
    help_text: "Intervals are parts of the chopped up genome used to speed up preprocessing\
      \ and variant calling. See `--intervals` for more info. \n\nIf  `--no_intervals`\
      \ is set no intervals will be taken into account for speed up or data processing."
- group_id: main_options
  name: skip_tools
  source_name: skip_tools
  type: string
  required: false
  default: null
  enum: null
  description: Disable specified tools.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main options
  raw_schema:
    type: string
    fa_icon: fas fa-forward
    description: Disable specified tools.
    help_text: 'Multiple tools can be specified, separated by commas.


      > **NB** `--skip_tools baserecalibrator_report` is actually just not saving
      the reports.

      > **NB** `--skip_tools markduplicates_report` does not skip `MarkDuplicates`
      but prevent the collection of duplicate metrics that slows down performance.'
    pattern: ^((baserecalibrator|baserecalibrator_report|bcftools|dnascope_filter|documentation|fastqc|haplotypecaller_filter|haplotyper_filter|markduplicates|markduplicates_report|mosdepth|multiqc|samtools|vcftools|versions)?,?)*(?<!,)$
- group_id: main_options
  name: tools
  source_name: tools
  type: string
  required: false
  default: null
  enum: null
  description: Tools to use for contamination removal, duplicate marking, variant
    calling and/or for annotation.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/tools
  example_values:
  - <server_reference_root>/tools
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main options
  raw_schema:
    type: string
    fa_icon: fas fa-toolbox
    description: Tools to use for contamination removal, duplicate marking, variant
      calling and/or for annotation.
    help_text: "Multiple tools separated with commas.\n\n**Variant Calling:**\n\n\
      Germline variant calling can currently be performed with the following variant\
      \ callers:\n- SNPs/Indels: DeepVariant, FreeBayes, GATK HaplotypeCaller, mpileup,\
      \ Sentieon Haplotyper \n- Structural Variants: indexcov, Manta, TIDDIT\n- Copy-number:\
      \ CNVKit\n\nTumor-only somatic variant calling can currently be performed with\
      \ the following variant callers:\n- SNPs/Indels: FreeBayes, Lofreq, mpileup,\
      \ Mutect2, Sentieon TNScope, Strelka\n- Structural Variants: Manta, Sentieon\
      \ TNScope, TIDDIT\n- Copy-number: CNVKit, ControlFREEC\n\nSomatic variant calling\
      \ can currently only be performed with the following variant callers:\n- SNPs/Indels:\
      \ FreeBayes, Mutect2, Sentieon TNScope, Strelka2 \n- Structural variants: Manta,\
      \ TIDDIT\n- Copy-Number: ASCAT, CNVKit, Control-FREEC, Sentieon TNScope \n-\
      \ Microsatellite Instability: MSIsensor2, MSIsensorpro\n\n> **NB** Mutect2 for\
      \ somatic variant calling cannot be combined with `--no_intervals`\n\n**Annotation:**\n\
      \ \n- snpEff, VEP, merge (both consecutively), and bcftools annotate (needs\
      \ `--bcftools_annotation`).\n\n> **NB** As Sarek will use bgzip and tabix to\
      \ compress and index VCF files annotated, it expects VCF files to be sorted\
      \ when starting from `--step annotate`."
    pattern: ^((ascat|bbsplit|bcfann|cnvkit|controlfreec|deepvariant|freebayes|haplotypecaller|indexcov|lofreq|manta|merge|mpileup|msisensor2|msisensorpro|muse|mutect2|ngscheckmate|sentieon_dedup|sentieon_dnascope|sentieon_haplotyper|sentieon_tnscope|snpeff|snpsift|strelka|tiddit|vep|varlociraptor)?,?)*(?<!,)$
- group_id: main_options
  name: wes
  source_name: wes
  type: boolean
  required: false
  default: null
  enum: null
  description: Enable when exome or panel data is provided.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Main options
  raw_schema:
    type: boolean
    fa_icon: fas fa-dna
    description: Enable when exome or panel data is provided.
    help_text: With this parameter flags in various tools are set for targeted sequencing
      data. It is recommended to enable for whole-exome and panel data analysis.
- group_id: main_options
  name: nucleotides_per_second
  source_name: nucleotides_per_second
  type: integer
  required: false
  default: 200000
  enum: null
  description: Estimate interval size.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 200000
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Main options
  raw_schema:
    type: integer
    fa_icon: fas fa-clock
    description: Estimate interval size.
    help_text: "Intervals are parts of the chopped up genome used to speed up preprocessing\
      \ and variant calling. See `--intervals` for more info. \n\nChanging this parameter,\
      \ changes the number of intervals that are grouped and processed together. Bed\
      \ files from target sequencing can contain thousands or small intervals. Spinning\
      \ up a new process for each can be quite resource intensive. Instead it can\
      \ be desired to process small intervals together on larger nodes. \nIn order\
      \ to make use of this parameter, no runtime estimate can be present in the bed\
      \ file (column 5). "
    default: 200000
    minimum: 1
- group_id: main_options
  name: split_fastq
  source_name: split_fastq
  type: integer
  required: false
  default: 50000000
  enum: null
  description: Specify how many reads each split of a FastQ file contains. Set 0 to
    turn off splitting at all.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 50000000
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: low
  mapping_flags:
  - uses_oneOf
  source_section: Main options
  raw_schema:
    type: integer
    oneOf:
    - minimum: 250
    - const: 0
    default: 50000000
    fa_icon: fas fa-clock
    description: Specify how many reads each split of a FastQ file contains. Set 0
      to turn off splitting at all.
    help_text: Use the the tool FastP to split FASTQ file by number of reads. This
      parallelizes across fastq file shards speeding up mapping. Note although the
      minimum value is 250 reads, if you have fewer than 250 reads a single FASTQ
      shard will still be created.
