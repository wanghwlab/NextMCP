  name: clip_r1
  source_name: clip_r1
  type: integer
  required: false
  default: 0
  enum: null
  description: Remove bp from the 5' end of read 1
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 0
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: FASTQ Preprocessing
  raw_schema:
    type: integer
    default: 0
    minimum: 0
    fa_icon: fas fa-cut
    description: Remove bp from the 5' end of read 1
    help_text: This may be useful if the qualities were very poor, or if there is
