  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: FASTQ Preprocessing
  raw_schema:
    type: boolean
    fa_icon: fas fa-cut
    description: Removing poly-G tails.
    help_text: DetectS polyG in read tails and trim them. Corresponds to the FastP
