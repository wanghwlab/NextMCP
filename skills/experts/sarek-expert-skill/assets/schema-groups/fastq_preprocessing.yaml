- group_id: fastq_preprocessing
  name: trim_fastq
  source_name: trim_fastq
  type: boolean
  required: false
  default: null
  enum: null
  description: Run FastP for read trimming
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: FASTQ Preprocessing
  raw_schema:
    type: boolean
    fa_icon: fas fa-cut
    description: Run FastP for read trimming
    help_text: Use this to perform adapter trimming. Adapter are detected automatically
      by using the FastP flag `--detect_adapter_for_pe`. For more info see [FastP](https://github.com/OpenGene/fastp).
- group_id: fastq_preprocessing
  name: trim_nextseq
  source_name: trim_nextseq
  type: boolean
  required: false
  default: null
  enum: null
  description: Removing poly-G tails.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
