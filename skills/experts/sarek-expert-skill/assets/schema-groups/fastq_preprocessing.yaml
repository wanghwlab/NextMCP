    `fastq_preprocessing` for exact lookup.
parameters:
- group_id: fastq_preprocessing
  name: save_split_fastqs
  source_name: save_split_fastqs
  type: boolean
  required: false
  default: null
  enum: null
  description: If set, publishes split FASTQ files. Intended for testing purposes.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: FASTQ Preprocessing
  raw_schema:
    type: boolean
    fa_icon: fas fa-vial
    description: If set, publishes split FASTQ files. Intended for testing purposes.
- group_id: fastq_preprocessing
  name: save_trimmed
  source_name: save_trimmed
  type: boolean
  required: false
  default: null
  enum: null
  description: Save trimmed FastQ file intermediates.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
