group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `reference_genome_options` for exact lookup.
parameters:
- group_id: reference_genome_options
  name: ascat_alleles
  source_name: ascat_alleles
  type: string
  required: false
  default: null
  enum: null
  description: Path to ASCAT allele zip file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/ascat_alleles
  example_values:
  - <server_reference_root>/ascat_alleles
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    pattern: ^\S+\.zip$
    exists: true
    fa_icon: fas fa-file
    description: Path to ASCAT allele zip file.
    help_text: If you use AWS iGenomes, this has already been set for you appropriately.
- group_id: reference_genome_options
  name: ascat_genome
  source_name: ascat_genome
  type: string
  required: false
  default: null
  enum: &id001
