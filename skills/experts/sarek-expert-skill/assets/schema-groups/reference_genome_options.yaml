  - hg38
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    description: ASCAT genome.
    help_text: 'Must be set to run ASCAT, either hg19 or hg38.


