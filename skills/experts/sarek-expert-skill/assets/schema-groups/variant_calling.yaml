group:
  id: variant_calling
  label: Variant Calling
  selection_rule: Use this group for parameters defined under the `Variant Calling`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/variant_calling.md
  - assets/schema-groups/variant_calling.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `variant_calling` for exact lookup.
parameters:
- group_id: variant_calling
  name: cf_chrom_len
  source_name: cf_chrom_len
  type: string
  required: false
  default: null
  enum: null
  description: Specify a custom chromosome length file.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/cf_chrom_len
  example_values:
  - <server_input_root>/cf_chrom_len
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Variant Calling
  raw_schema:
    type: string
    format: file-path
    pattern: ^\S+\.(fai|len)$
    exists: true
    fa_icon: fas fa-ruler-horizontal
    description: Specify a custom chromosome length file.
    help_text: 'Control-FREEC requires a file containing all chromosome lengths. By
      default the fasta.fai is used. If the fasta.fai file contains chromosomes not
      present in the intervals, it fails (see: https://github.com/BoevaLab/FREEC/issues/106).


      In this case, a custom chromosome length can be specified. It must be of the
      same format as the fai, but only contain the relevant chromosomes.




      '
