  source_name: only_paired_variant_calling
  type: boolean
  required: false
  default: null
  enum: null
  description: If true, skips germline variant calling for matched normal to tumor
    sample. Normal samples without matched tumor will still be processed through germline
    variant calling tools.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Variant Calling
  raw_schema:
    type: boolean
    fa_icon: fas fa-forward
    description: If true, skips germline variant calling for matched normal to tumor
      sample. Normal samples without matched tumor will still be processed through
      germline variant calling tools.
    help_text: This can speed up computation for somatic variant calling with matched
      normal samples. If false, all normal samples are processed as well through the
      germline variantcalling tools. If true, only somatic variant calling is done.
- group_id: variant_calling
  name: pon
  source_name: pon
  type: string
  required: false
  default: null
  enum: null
  description: Panel-of-normals VCF (bgzipped) for GATK Mutect2
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/pon
  example_values:
  - <server_input_root>/pon
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Variant Calling
  raw_schema:
    type: string
    fa_icon: fas fa-file
    format: file-path
    pattern: ^\S+\.vcf\.gz$
    exists: true
    description: Panel-of-normals VCF (bgzipped) for GATK Mutect2
    help_text: "Without PON, there will be no calls with PASS in the INFO field, only\
      \ an unfiltered VCF is written.\nIt is highly recommended to make your own PON,\
      \ as it depends on sequencer and library preparation.\n\nThe pipeline is shipped\
      \ with a panel-of-normals for `--genome GATK.GRCh38` provided by [GATK](https://gatk.broadinstitute.org/hc/en-us/articles/360035890631-Panel-of-Normals-PON-).\
      \ \n\nSee [PON documentation](https://gatk.broadinstitute.org/hc/en-us/articles/360042479112-CreateSomaticPanelOfNormals-BETA)\n\
      > **NB** PON file should be bgzipped."
