- group_id: variant_calling
  name: joint_mutect2
  source_name: joint_mutect2
  type: boolean
  required: false
  default: null
  enum: null
  description: Runs Mutect2 in joint (multi-sample) mode for better concordance among
    variant calls of tumor samples from the same patient. Mutect2 outputs will be
    stored in a subfolder named with patient ID under `variant_calling/mutect2/` folder.
    Only a single normal sample per patient is allowed. Tumor-only mode is also supported.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Variant Calling
  raw_schema:
    type: boolean
    fa_icon: fas fa-angle-double-right
    description: Runs Mutect2 in joint (multi-sample) mode for better concordance
      among variant calls of tumor samples from the same patient. Mutect2 outputs
      will be stored in a subfolder named with patient ID under `variant_calling/mutect2/`
      folder. Only a single normal sample per patient is allowed. Tumor-only mode
      is also supported.
