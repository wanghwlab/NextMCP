- group_id: variant_calling
  name: sentieon_dnascope_emit_mode
  source_name: sentieon_dnascope_emit_mode
  type: string
  required: false
  default: variant
  enum: null
  description: Option for selecting output and emit-mode of Sentieon's Dnascope.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - variant
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Variant Calling
  raw_schema:
    type: string
    default: variant
    fa_icon: fas fa-toolbox
    description: Option for selecting output and emit-mode of Sentieon's Dnascope.
    help_text: The option `--sentieon_dnascope_emit_mode` can be set to the same string
      values as the Dnascope's `--emit_mode`. To output both a vcf and a gvcf, specify
      both a vcf-option (currently, `all`, `confident` and `variant`) and `gvcf`.
      For example, to obtain a vcf and gvcf one could set `--sentieon_dnascope_emit_mode`
      to `variant, gvcf`.
    pattern: ^(all|confident|gvcf|variant|gvcf,all|gvcf,confident|gvcf,variant|all,gvcf|confident,gvcf|variant,gvcf)(?<!,)$
