  source_name: freebayes_filter
  type: string
  required: false
  default: '30'
  enum: null
  description: Filtering expression for vcflib/vcffilter
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - '30'
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Variant Calling
  raw_schema:
    type: string
    default: '30'
    description: Filtering expression for vcflib/vcffilter
    help_text: Freebayes offers a QUAL score for each called variant. The QUAL estimate
      provides the phred-scaled probability that the locus is not polymorphic provided
      the data and the model. This is reasonably-well calibrated, so you can specify
      that you want things where we expect error rates of no more than 1/100 (QUAL
      > 20) or 1/1000 (QUAL > 30). Where the default setting for sarek is QUAL > 30.
