group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `reference_genome_options` for exact lookup.
parameters:
- group_id: reference_genome_options
  name: fasta
  source_name: fasta
  type: string
  required: false
  default: null
  enum: null
  description: Path to FASTA genome file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    description: Path to FASTA genome file.
    help_text: This parameter is *mandatory* if `--genome` is not specified. If you
      don't have the appropriate alignment index available this will be generated
      for you automatically. Combine with `--save_reference` to save alignment index
      for future runs.
    fa_icon: far fa-file-code
- group_id: reference_genome_options
  name: gene_bed
  source_name: gene_bed
  type: string
  required: false
  default: null
  enum: null
  description: Path to BED file containing gene intervals. This will be created from
    the GTF file if not specified.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/gene_bed.bed
  example_values:
  - <server_reference_root>/gene_bed.bed
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.bed(\.gz)?$
    fa_icon: fas fa-procedures
    description: Path to BED file containing gene intervals. This will be created
      from the GTF file if not specified.
- group_id: reference_genome_options
  name: gff
  source_name: gff
  type: string
  required: false
  default: null
