- group_id: reference_genome_options
  name: keep_mito
  source_name: keep_mito
  type: boolean
  required: false
  default: false
  enum: null
  description: Reads mapping to mitochondrial contig are not filtered from alignments.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/keep_mito
  example_values:
  - <server_reference_root>/keep_mito
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    description: Reads mapping to mitochondrial contig are not filtered from alignments.
    fa_icon: fas fa-cart-arrow-down
    default: false
- group_id: reference_genome_options
  name: save_reference
  source_name: save_reference
  type: boolean
  required: false
  default: null
  enum: null
  description: If generated by the pipeline save the aligner index (e.g. BWA) in the
    results directory.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/save_reference
  example_values:
  - <server_reference_root>/save_reference
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    description: If generated by the pipeline save the aligner index (e.g. BWA) in
      the results directory.
    help_text: If the index generated by the aligner is generated by the pipeline
      use this parameter to save it to your results folder. These can then be used
      for future pipeline runs, reducing processing times.
    fa_icon: fas fa-save
- group_id: reference_genome_options
