    exists: true
    mimetype: text/plain
    pattern: ^\S+\.gff(\.gz)?$
    fa_icon: fas fa-code-branch
    description: Path to GFF3 annotation file.
    help_text: This parameter must be specified if `--genome` or `--gtf` are not specified.
- group_id: reference_genome_options
  name: gtf
  source_name: gtf
  type: string
  required: false
  default: null
