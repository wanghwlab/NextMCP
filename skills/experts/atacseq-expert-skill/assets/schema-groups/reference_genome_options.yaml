    description: Name of iGenomes reference.
    fa_icon: fas fa-book
    help_text: "If using a reference genome configured in the pipeline using iGenomes,\
      \ use this parameter to give the ID for the reference. This is then used to\
      \ build the full paths for all required reference genome files e.g. `--genome\
      \ GRCh38`. \n\nSee the [nf-core website docs](https://nf-co.re/usage/reference_genomes)\
      \ for more details."
- group_id: reference_genome_options
  name: macs_gsize
  source_name: macs_gsize
  type: number
  required: false
  default: null
  enum: null
  description: Effective genome size parameter required by MACS2.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/macs_gsize
  example_values:
  - <server_reference_root>/macs_gsize
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: number
    description: Effective genome size parameter required by MACS2.
    help_text: '[Effective genome size](https://github.com/taoliu/MACS#-g--gsize)
      parameter required by MACS2. If using an iGenomes reference these have been
      provided when `--genome` is set as *GRCh37*, *GRCh38*, *GRCm38*, *WBcel235*,
      *BDGP6*, *R64-1-1*, *EF2*, *hg38*, *hg19* and *mm10*. For other genomes, if
      this parameter is not specified then the MACS2 peak-calling and differential
      analysis will be skipped.'
    fa_icon: fas fa-arrows-alt-h
