    fa_icon: fas fa-procedures
    description: Path to BED file containing transcription start sites. This will
      be created from the gene BED file if not specified.
- group_id: reference_genome_options
  name: ataqv_mito_reference
  source_name: ataqv_mito_reference
  type: string
  required: false
  default: null
  enum: null
  description: Sets the value of the ataqv --mitochondrial-reference-name argument
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/ataqv_mito_reference
  example_values:
  - <server_reference_root>/ataqv_mito_reference
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    description: Sets the value of the ataqv --mitochondrial-reference-name argument
    help_text: By default takes the value of the mito_name parameter, if set. However,
      some plants and algae have chloroplast genomes in addition to a mitochondrial
      genome and thus mito_name can have values as multiple names that are separated
      by a | symbol that will break ataqv, in these cases this parameter can be used
      to overwrite these values.
    fa_icon: fas fa-signature
- group_id: reference_genome_options
  name: blacklist
  source_name: blacklist
  type: string
  required: false
  default: null
  enum: null
  description: Path to blacklist regions in BED format, used for filtering alignments.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/blacklist
  example_values:
  - <server_reference_root>/blacklist
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    format: path
    exists: true
    description: Path to blacklist regions in BED format, used for filtering alignments.
    help_text: If provided, alignments that overlap with the regions in this file
      will be filtered out (see [ENCODE blacklists](https://sites.google.com/site/anshulkundaje/projects/blacklists)).
      The file should be in BED format. Blacklisted regions for *GRCh37*, *GRCh38*,
      *GRCm38*, *hg19*, *hg38*, *mm10* are bundled with the pipeline in the [`blacklists`](../assets/blacklists/)
      directory, and as such will be automatically used if any of those genomes are
      specified with the `--genome` parameter.
    fa_icon: fas fa-book-dead
