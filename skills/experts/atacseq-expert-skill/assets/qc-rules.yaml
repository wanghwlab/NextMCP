checks:
- id: run_completion
  severity: high
  source: run_get(include=["progress","diagnosis","artifact_summary"])
  good_signal: Run succeeded and published expected results.
  bad_signal: Run failed, stalled, or reported a blocking diagnosis.
  action: Inspect run_get diagnosis and next_actions first; then run_logs or fs_read for details.

- id: alignment_rate
  severity: high
  source: <ALIGNER>/merged_library/samtools_stats/*.flagstat
  good_signal: More than 80% of reads align uniquely to the reference genome.
  bad_signal: Alignment rate below 50% or excessive unmapped reads.
  action: Confirm reference genome matches the organism. Check adapter trimming efficiency in trimgalore logs. Verify samplesheet paths are correct.

- id: duplication_rate
  severity: high
  source: <ALIGNER>/merged_library/picard_metrics/*.metrics.txt
  good_signal: Duplication rate is within expected range for ATAC-seq, often below 30-50% depending on protocol.
  bad_signal: Extremely high duplication rate above 70%, suggesting over-amplification or low input.
  action: Check if keep_dups was enabled. Verify PCR cycle count during library prep. Consider increasing sequencing depth.

- id: mitochondrial_content
  severity: high
  source: <ALIGNER>/merged_library/samtools_stats/*.idxstats
  good_signal: Mitochondrial reads are filtered as expected (unless keep_mito is set).
  bad_signal: Mitochondrial reads dominate alignments, indicating poor nuclear signal.
  action: Verify keep_mito is not unintentionally enabled. Review sample quality; high mitochondrial content is common in some tissues/cell types.

- id: library_complexity
  severity: medium
  source: <ALIGNER>/merged_library/preseq/*.lc_extrap.txt
  good_signal: Preseq curves show good complexity with continued unique read gain.
  bad_signal: Library complexity is very low (curve plateaus early), indicating over-PCR or insufficient input.
  action: Review PCR cycles and input DNA amount. Consider deeper sequencing only if complexity supports it.

- id: peak_counts_and_frip
  severity: medium
  source: <ALIGNER>/merged_library/macs2/<PEAK_TYPE>/qc/*.FRiP_mqc.tsv
  good_signal: Reasonable peak counts per sample (typically 50k-200k for broad, 20k-100k for narrow) and FRiP >0.1.
  bad_signal: Very few peaks called or FRiP near zero, indicating poor enrichment.
  action: Check alignment quality and filtering parameters. Verify narrow_peak vs broad_peak choice matches biology. Review read depth.

- id: consensus_peak_reproducibility
  severity: medium
  source: <ALIGNER>/merged_library/macs2/<PEAK_TYPE>/consensus/*.boolean.intersect.plot.pdf
  good_signal: UpSetR plots show good overlap across replicates/conditions.
  bad_signal: Very little consensus peak overlap, suggesting poor replicate reproducibility.
  action: Verify sample grouping in samplesheet. Check if min_reps_consensus should be increased. Review batch effects in DESeq2 PCA.

- id: deseq2_sample_clustering
  severity: medium
  source: <ALIGNER>/merged_library/macs2/<PEAK_TYPE>/consensus/deseq2/*.plots.pdf
  good_signal: PCA and heatmap show samples clustering by biological condition.
  bad_signal: Samples cluster by technical factors (batch, sequencing lane) rather than biology.
  action: Review experimental design. Check for batch effects. Consider including batch as a covariate in downstream DESeq2 analysis.

- id: ataqv_quality
  severity: low
  source: <ALIGNER>/merged_library/ataqv/<PEAK_TYPE>/html/
  good_signal: ataqv HTML report shows metrics within expected ATAC-seq ranges.
  bad_signal: ataqv flags poor metrics such as low TSS enrichment or abnormal fragment distribution.
  action: Review TSS enrichment scores and fragment length distributions. Check if nucleosome pattern is visible.

- id: multiqc_completeness
  severity: low
  source: multiqc/<PEAK_TYPE>/multiqc_report.html
  good_signal: MultiQC contains FastQC, Trim Galore, samtools, picard, MACS2, and other expected modules.
  bad_signal: Modules missing or unexpectedly empty.
  action: If skip flags are enabled, absent modules are expected. If missing unexpectedly, inspect run logs for module failures.

- id: trimming_efficiency
  severity: low
  source: trimgalore/logs/*.log
  good_signal: High percentage of reads retain after adapter/quality trimming.
  bad_signal: Very low retained reads or high untrimmed rate.
  action: Verify adapter sequence matches library prep (default Nextera 'CTGTCTCTTATA'). For custom adapters, provide adapter sequence via params. If reads are already trimmed, use skip_trimming.
