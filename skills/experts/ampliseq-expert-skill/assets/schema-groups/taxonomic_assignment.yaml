group:
  id: taxonomic_assignment
  label: Taxonomic assignment
  selection_rule: Use this group for parameters defined under the `Taxonomic assignment`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/taxonomic_assignment.md
  - assets/schema-groups/taxonomic_assignment.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `taxonomic_assignment` for exact lookup.
parameters:
- group_id: taxonomic_assignment
  name: addsh
  source_name: addsh
  type: boolean
  required: false
  default: null
  enum: null
  description: If ASVs should be assigned to UNITE species hypotheses (SHs). Only
    relevant for ITS data.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Taxonomic assignment
  raw_schema:
    type: boolean
    description: If ASVs should be assigned to UNITE species hypotheses (SHs). Only
      relevant for ITS data.
- group_id: taxonomic_assignment
  name: cut_dada_ref_taxonomy
  source_name: cut_dada_ref_taxonomy
  type: boolean
  required: false
  default: null
  enum: null
  description: If the expected amplified sequences are extracted from the DADA2 reference
    taxonomy database
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/cut_dada_ref_taxonomy
  example_values:
  - <server_reference_root>/cut_dada_ref_taxonomy
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Taxonomic assignment
  raw_schema:
    type: boolean
    help_text: Expected amplified sequences are extracted from the DADA2 reference
      taxonomy using the primer sequences, that might improve classification. This
      is not applied to species classification (assignSpecies) but only for lower
      taxonomic levels (assignTaxonomy).
    description: If the expected amplified sequences are extracted from the DADA2
      reference taxonomy database
