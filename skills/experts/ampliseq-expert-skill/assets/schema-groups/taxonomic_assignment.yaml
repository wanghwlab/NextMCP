  channel: params
  placeholder: null
  example_values:
  - none
  - full
  - its1
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Taxonomic assignment
  raw_schema:
    type: string
    help_text: If data is long read ITS sequences, that need to be cut to ITS region
      (full ITS, only ITS1, or only ITS2) for taxonomy assignment.
    description: 'Part of ITS region to use for taxonomy assignment: "full", "its1",
      or "its2"'
    default: none
    enum: *id001
- group_id: taxonomic_assignment
  name: dada_addspecies_allowmultiple
  source_name: dada_addspecies_allowmultiple
  type: boolean
  required: false
  default: null
  enum: null
  description: If multiple exact matches against different species are returned
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Taxonomic assignment
  raw_schema:
    type: boolean
    help_text: Defines the behavior when multiple exact matches against different
