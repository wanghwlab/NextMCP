  raw_schema:
    type: string
    help_text: 'Choose any of the supported databases, and optionally also specify
      the version. Database and version are separated by an equal sign (`=`, e.g.
      `silve=138`) . This will download the desired database and initiate taxonomic
      classification with Kraken2 and the chosen database.


      Consider using `--kraken2_confidence` to set a confidence score threshold.


      The following databases are supported:

      - RDP - Ribosomal Database Project - 16S rRNA

      - SILVA ribosomal RNA gene database project - 16S rRNA

      - Greengenes - 16S rRNA

      - Standard Kraken2 database (RefSeq archaea, bacteria, viral, plasmid, human,
      UniVec_Core) - any amplicon


      Generally, using `rdp`, `silva`, `greengenes`, `standard` will select the most
      recent supported version.


      Please note that commercial/non-academic entities [require licensing](https://www.arb-silva.de/silva-license-information)
      for SILVA v132 database (non-default) but not from v138 on.'
    description: Name of supported database, and optionally also version number
