    description: If multiple exact matches against different species are returned
- group_id: taxonomic_assignment
  name: dada_ref_taxonomy
  source_name: dada_ref_taxonomy
  type: string
  required: false
  default: silva=138.2
  enum: &id002
  - coidb
  - coidb=221216
  - greengenes2
  - greengenes2=2024.09
  - gtdb
  - gtdb=R05-RS95
  - gtdb=R06-RS202
  - gtdb=R07-RS207
  - gtdb=R08-RS214
  - gtdb=R09-RS220
  - gtdb=R10-RS226
  - midori2-co1
  - midori2-co1=gb250
  - pr2
  - pr2=4.13.0
  - pr2=4.14.0
  - pr2=5.0.0
  - pr2=5.1.0
  - rdp
  - rdp=18
  - sbdi-gtdb
  - sbdi-gtdb=R10-RS226-2
  - sbdi-gtdb=R09-RS220-2
  - sbdi-gtdb=R09-RS220-1
  - sbdi-gtdb=R08-RS214-1
  - sbdi-gtdb=R07-RS207-1
  - sbdi-gtdb=R06-RS202-3
  - sbdi-gtdb=R06-RS202-1
  - silva
  - silva=138.2
  - silva=138
  - silva=132
  - unite-alleuk
  - unite-alleuk=10.0
  - unite-alleuk=9.0
  - unite-alleuk=8.3
  - unite-alleuk=8.2
  - unite-fungi
  - unite-fungi=10.0
  - unite-fungi=9.0
  - unite-fungi=8.3
  - unite-fungi=8.2
  - zehr-nifh
  - zehr-nifh=2.5.0
  description: Name of supported database, and optionally also version number
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/dada_ref_taxonomy
  example_values:
  - coidb
  - coidb=221216
  - greengenes2
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Taxonomic assignment
  raw_schema:
    type: string
    help_text: 'Choose any of the supported databases, and optionally also specify
      the version. Database and version are separated by an equal sign (`=`, e.g.
      `silva=138`) . This will download the desired database, format it to produce
      a file that is compatible with DADA2''s assignTaxonomy and another file that
      is compatible with DADA2''s addSpecies.


      The following databases are supported:

      - GTDB - Genome Taxonomy Database - 16S rRNA

      - SBDI-GTDB, a Sativa-vetted version of the GTDB 16S rRNA

      - PR2 - Protist Reference Ribosomal Database - 18S rRNA

      - RDP - Ribosomal Database Project - 16S rRNA

      - SILVA ribosomal RNA gene database project - 16S rRNA

      - UNITE - eukaryotic nuclear ribosomal ITS region - ITS

      - COIDB - eukaryotic Cytochrome Oxidase I (COI) from The Barcode of Life Data
      System (BOLD) - COI


      Generally, using `gtdb`, `pr2`, `rdp`, `sbdi-gtdb`, `silva`, `coidb`, `unite-fungi`,
      or `unite-alleuk` will select the most recent supported version.


      Please note that commercial/non-academic entities [require licensing](https://www.arb-silva.de/silva-license-information)
      for SILVA v132 database (non-default) but not from v138 on (default).'
    description: Name of supported database, and optionally also version number
    default: silva=138.2
    enum: *id002
