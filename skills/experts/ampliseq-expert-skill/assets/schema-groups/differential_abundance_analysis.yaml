group:
  id: differential_abundance_analysis
  label: Differential abundance analysis
  selection_rule: Use this group for parameters defined under the `Differential abundance
    analysis` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/differential_abundance_analysis.md
  - assets/schema-groups/differential_abundance_analysis.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `differential_abundance_analysis` for exact lookup.
parameters:
- group_id: differential_abundance_analysis
  name: ancom
  source_name: ancom
  type: boolean
  required: false
  default: null
  enum: null
  description: Perform differential abundance analysis with ANCOM
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: boolean
    description: Perform differential abundance analysis with ANCOM
    fa_icon: fas fa-greater-than-equal
- group_id: differential_abundance_analysis
  name: ancom_sample_min_count
  source_name: ancom_sample_min_count
  type: integer
  required: false
  default: 1
  enum: null
  description: Minimum sample counts to retain a sample for ANCOM analysis. Any sample
    below that threshold will be removed.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/samplesheet.csv
  example_values:
  - <server_input_root>/samplesheet.csv
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: integer
    default: 1
    description: Minimum sample counts to retain a sample for ANCOM analysis. Any
      sample below that threshold will be removed.
    fa_icon: fas fa-greater-than-equal
- group_id: differential_abundance_analysis
  name: ancombc
  source_name: ancombc
  type: boolean
  required: false
  default: null
  enum: null
  description: Perform differential abundance analysis with ANCOMBC
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: boolean
    description: Perform differential abundance analysis with ANCOMBC
    help_text: ANCOMBC will be performed on all suitable columns in the metadata sheet.
      Empty values will be removed, therefore it is possible to perform tests on subsets.
      The reference level will default to highest alphanumeric group (e.g. in alphabetical
      or numeric order, as applicable) within each metadata column. Formula for specific
      tests can be supplied with `--ancombc_formula`.
    fa_icon: fas fa-greater-than-equal
- group_id: differential_abundance_analysis
  name: ancombc_effect_size
  source_name: ancombc_effect_size
  type: number
  required: false
  default: 1
  enum: null
  description: Effect size threshold for differential abundance barplot for `--ancombc`
    and `--ancombc_formula`
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 1
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: number
    default: 1
    minimum: 0
    description: Effect size threshold for differential abundance barplot for `--ancombc`
      and `--ancombc_formula`
    fa_icon: fas fa-greater-than-equal
- group_id: differential_abundance_analysis
  name: ancombc_significance
  source_name: ancombc_significance
  type: number
  required: false
  default: 0.05
  enum: null
  description: Significance threshold for differential abundance barplot for `--ancombc`
    and `--ancombc_formula`
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - 0.05
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: number
    default: 0.05
    minimum: 0
    maximum: 1
    description: Significance threshold for differential abundance barplot for `--ancombc`
      and `--ancombc_formula`
    fa_icon: fas fa-greater-than-equal
- group_id: differential_abundance_analysis
  name: ancombc_formula
  source_name: ancombc_formula
  type: string
  required: false
  default: null
  enum: null
  description: Formula to perform differential abundance analysis with ANCOMBC
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: string
    description: Formula to perform differential abundance analysis with ANCOMBC
    help_text: 'Comma separated list of model formula(s), e.g. "treatment1,treatment2".
      The reference level will default to highest alphanumeric group (e.g. in alphabetical
      or numeric order, as applicable) within each formula term. The reference level
      can be overwritten by `--ancombc_formula_reflvl`. Model formula should contain
      only independent terms in the sample metadata. These can be continuous variables
      or factors, and they can have interactions as in a typical R formula. Essentially,
      columns in the metadata sheet can be chosen that have no empty values, not only
      unique values, or not only identical values.

      For example, "treatment1+treatment2" tests whether the data partitions based
      on "treatment1" and "treatment2" sample metadata. "treatment1*treatment2" test
      both of those effects as well as their interaction.

      More examples can be found in the R documentation, https://cran.r-project.org/doc/manuals/r-release/R-intro.html#Formulae-for-statistical-models'
    fa_icon: fas fa-greater-than-equal
- group_id: differential_abundance_analysis
  name: ancombc_formula_reflvl
  source_name: ancombc_formula_reflvl
  type: string
  required: false
  default: null
  enum: null
  description: Reference level for `--ancombc_formula`
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Differential abundance analysis
  raw_schema:
    type: string
    description: Reference level for `--ancombc_formula`
    help_text: 'This will only affect ANCOM-BC started by `--ancombc_formula`, but
      for all provided model formula, therefore it might be best to restrict `--ancombc_formula`
      to one formula. The syntax is as follows: ''column_name::column_value'' or for
      multiple ''column_name1::column_value1 column_name2::column_value2'''
    fa_icon: fas fa-greater-than-equal
