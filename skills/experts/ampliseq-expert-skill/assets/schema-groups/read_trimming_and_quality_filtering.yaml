group:
  id: read_trimming_and_quality_filtering
  label: Read trimming and quality filtering
  selection_rule: Use this group for parameters defined under the `Read trimming and
    quality filtering` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/read_trimming_and_quality_filtering.md
  - assets/schema-groups/read_trimming_and_quality_filtering.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `read_trimming_and_quality_filtering` for exact lookup.
parameters:
- group_id: read_trimming_and_quality_filtering
  name: ignore_failed_filtering
  source_name: ignore_failed_filtering
  type: boolean
  required: false
  default: null
  enum: null
  description: Ignore files with too few reads after quality filtering.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: boolean
    description: Ignore files with too few reads after quality filtering.
    help_text: Ignore files with fewer reads than specified by `--min_read_counts`
      after trimming and continue the pipeline without those samples. Please review
      all quality trimming and filtering options before using this parameter. For
      example, one sample with shorter sequences than other samples might loose all
      sequences due to minimum length requirements by read truncation (see --trunclenf).
    fa_icon: fas fa-arrow-right
- group_id: read_trimming_and_quality_filtering
  name: max_ee
  source_name: max_ee
  type: integer
  required: false
  default: 2
  enum: null
  description: DADA2 read filtering option
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 2
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    default: 2
    description: DADA2 read filtering option
    help_text: 'After truncation, reads with higher than `max_ee` "expected errors"
      will be discarded. In case of very long reads, you might want to increase this
      value.  We recommend (to start with) a value corresponding to approximately
      1 expected error per 100-200 bp (default: 2)'
    fa_icon: fas fa-equals
- group_id: read_trimming_and_quality_filtering
  name: max_len
  source_name: max_len
  type: integer
  required: false
  default: null
  enum: null
  description: DADA2 read filtering option
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    description: DADA2 read filtering option
    fa_icon: fas fa-less-than-equal
    help_text: Remove reads with length greater than `max_len` after trimming and
      truncation. Must be a positive integer.
- group_id: read_trimming_and_quality_filtering
  name: min_len
  source_name: min_len
  type: integer
  required: false
  default: 50
  enum: null
  description: DADA2 read filtering option
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 50
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    default: 50
    description: DADA2 read filtering option
    fa_icon: fas fa-greater-than-equal
    help_text: Remove reads with length less than `min_len` after trimming and truncation.
- group_id: read_trimming_and_quality_filtering
  name: trunc_qmin
  source_name: trunc_qmin
  type: integer
  required: false
  default: 25
  enum: null
  description: If --trunclenf and --trunclenr are not set, these values will be automatically
    determined using this median quality score
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 25
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    default: 25
    description: If --trunclenf and --trunclenr are not set, these values will be
      automatically determined using this median quality score
    help_text: 'Automatically determine `--trunclenf` and `--trunclenr` before the
      median quality score drops below `--trunc_qmin`. The fraction of reads retained
      is defined by `--trunc_rmin`, which might override the quality cutoff.


      For example:


      ```bash

      --trunc_qmin 35

      ```


      Please note:


      1. The code choosing `--trunclenf` and `--trunclenr` using `--trunc_qmin` automatically
      cannot take amplicon length or overlap requirements for merging into account,
      therefore use with caution.

      2. A minimum value of 25 is recommended. However, high quality data with a large
      paired sequence overlap might justify a higher value (e.g. 35). Also, very low
      quality data might require a lower value.

      3. If the quality cutoff is too low to include a certain fraction of reads that
      is specified by `--trunc_rmin` (e.g. 0.75 means at least 75% percent of reads
      are retained), a lower cutoff according to `--trunc_rmin` superseeds the quality
      cutoff.

      4. The calculations for the values of `--trunclenf` and `--trunclenr` are made
      before any quality score-based read truncation (using `--truncq`) is performed.'
    fa_icon: fas fa-greater-than-equal
- group_id: read_trimming_and_quality_filtering
  name: trunc_rmin
  source_name: trunc_rmin
  type: number
  required: false
  default: 0.75
  enum: null
  description: Assures that values chosen with --trunc_qmin will retain a fraction
    of reads.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 0.75
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: number
    default: 0.75
    description: Assures that values chosen with --trunc_qmin will retain a fraction
      of reads.
    help_text: Value can range from 0 to 1. 0 means no reads need to be retained and
      1 means all reads need to be retained. The minimum lengths of --trunc_qmin and
      --trunc_rmin are chosen as DADA2 cutoffs.
    minimum: 0
    maximum: 1
    fa_icon: fas fa-greater-than-equal
- group_id: read_trimming_and_quality_filtering
  name: trunclenf
  source_name: trunclenf
  type: integer
  required: false
  default: null
  enum: null
  description: DADA2 read truncation value for forward strand, set this to 0 for no
    truncation
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    description: DADA2 read truncation value for forward strand, set this to 0 for
      no truncation
    help_text: 'Read denoising by DADA2 creates an error profile specific to a sequencing
      run and uses this to correct sequencing errors. This method prefers when all
      reads to have the same length and as high quality as possible while maintaining
      at least 20 bp overlap for merging. One cutoff for the forward read `--trunclenf`
      and one for the reverse read `--trunclenr` truncate all longer reads at that
      position and drop all shorter reads.

      If not set, these cutoffs will be determined automatically for the position
      before the mean quality score drops below `--trunc_qmin`.


      For example:


      ```bash

      --trunclenf 180 --trunclenr 120

      ```


      Please note:


      1. Overly aggressive truncation might lead to insufficient overlap for read
      merging

      2. Too little truncation might reduce denoised reads

      3. The code choosing these values automatically cannot take the points above
      into account, therefore checking read numbers is essential'
    fa_icon: fas fa-ban
- group_id: read_trimming_and_quality_filtering
  name: trunclenr
  source_name: trunclenr
  type: integer
  required: false
  default: null
  enum: null
  description: DADA2 read truncation value for reverse strand, set this to 0 for no
    truncation
  classification: lookup_only
  channel: params
  placeholder: null
  example_values: []
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    description: DADA2 read truncation value for reverse strand, set this to 0 for
      no truncation
    help_text: 'Read denoising by DADA2 creates an error profile specific to a sequencing
      run and uses this to correct sequencing errors. This method prefers when all
      reads to have the same length and as high quality as possible while maintaining
      at least 20 bp overlap for merging. One cutoff for the forward read `--trunclenf`
      and one for the reverse read `--trunclenr` truncate all longer reads at that
      position and drop all shorter reads.

      If not set, these cutoffs will be determined automatically for the position
      before the mean quality score drops below `--trunc_qmin`.


      For example:


      ```bash

      --trunclenf 180 --trunclenr 120

      ```


      Please note:


      1. Overly aggressive truncation might lead to insufficient overlap for read
      merging

      2. Too little truncation might reduce denoised reads

      3. The code choosing these values automatically cannot take the points above
      into account, therefore checking read numbers is essential'
    fa_icon: fas fa-ban
- group_id: read_trimming_and_quality_filtering
  name: truncq
  source_name: truncq
  type: integer
  required: false
  default: 2
  enum: null
  description: Truncate each read at the first instance of a quality score less than
    or equal to `--truncq`.
  classification: lookup_only
  channel: params
  placeholder: null
  example_values:
  - 2
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Read trimming and quality filtering
  raw_schema:
    type: integer
    default: 2
    fa_icon: fas fa-greater-than-equal
    minimum: 0
    description: Truncate each read at the first instance of a quality score less
      than or equal to `--truncq`.
    help_text: Applied before read length truncation, but in the same step as read
      length truncation. The parameter is equivalent to `truncQ` in DADA2's filterAndTrim
      method. `--truncq` defaults to 2, which was already the default previously.
      If `--trunc_qmin` and `--trunc_rmin` are used to automatically calculate `--trunclenf`
      and `--trunclenr`, these values are determined using the read metrics calculated
      on the read input before DADA2 filterAndTrim is called, and so before `--truncq`
      is applied.
