group:
  id: input_output_options
  label: Main arguments
  selection_rule: Use this group for parameters defined under the `Main arguments`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/input_output_options.md
  - assets/schema-groups/input_output_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `input_output_options` for exact lookup.
parameters:
- group_id: input_output_options
  name: input
  source_name: input
  type: string
  required: false
  default: null
  enum: null
  description: Path to tab-separated sample sheet
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/input
  example_values:
  - <server_output_root>/input
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main arguments
  raw_schema:
    type: string
    format: file-path
    mimetype: text/tsv
    pattern: ^\S+\.(tsv|csv|yml|yaml|txt)$
    fa_icon: fas fa-dna
    description: Path to tab-separated sample sheet
    help_text: "Path to sample sheet, either tab-separated (.tsv), comma-separated\
      \ (.csv), or in YAML format (.yml/.yaml), that points to compressed fastq files.\n\
      \nThe sample sheet must have two to four tab-separated columns/entries with\
      \ the following headers: \n- `sampleID` (required): Unique sample IDs, must\
      \ start with a letter, and can only contain letters, numbers or underscores\n\
      - `forwardReads` (required): Paths to (forward) reads zipped FastQ files\n-\
      \ `reverseReads` (optional): Paths to reverse reads zipped FastQ files, required\
      \ if the data is paired-end\n- `run` (optional): If the data was produced by\
      \ multiple sequencing runs, any string\n\nRelated parameters are:\n- `--pacbio`\
      \ and `--iontorrent` if the sequencing data is PacBio data or IonTorrent data\
      \ (default expected: paired-end Illumina data)\n- `--single_end` if the sequencing\
      \ data is single-ended Illumina data (default expected: paired-end Illumina\
      \ data)\n- Choose an appropriate reference taxonomy for the type of amplicon\
      \ (16S/18S/ITS/CO1) (default: DADA2 assignTaxonomy and 16S rRNA sequence database)"
    schema: assets/schema_input.json
- group_id: input_output_options
  name: input_fasta
  source_name: input_fasta
  type: string
  required: false
  default: null
  enum: null
  description: Path to ASV/OTU fasta file
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/genome.fa
  example_values:
  - <server_output_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main arguments
  raw_schema:
    type: string
    format: file-path
    mimetype: text/tsv
    pattern: ^\S+\.(fasta|fas|fna|fa|ffn)$
    fa_icon: fas fa-dna
    description: Path to ASV/OTU fasta file
    help_text: 'Path to fasta format file with sequences that will be taxonomically
      classified. The fasta file input option can be used to taxonomically classify
      previously produced ASV/OTU sequences.


      The fasta sequence header line may contain a description, that will be kept
      as part of the sequence name. However, tabs will be changed into spaces.


      Related parameters are:

      - Choose an appropriate reference taxonomy for the type of amplicon (16S/18S/ITS/CO1)
      (default: DADA2 assignTaxonomy and 16S rRNA sequence database)'
- group_id: input_output_options
  name: input_folder
  source_name: input_folder
  type: string
  required: false
  default: null
  enum: null
  description: Path to folder containing zipped FastQ files
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/input_folder
  example_values:
  - <server_output_root>/input_folder
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Main arguments
  raw_schema:
    type: string
    format: directory-path
    fa_icon: fas fa-dna
    description: Path to folder containing zipped FastQ files
    help_text: "Path to folder containing compressed fastq files.\n\nExample for input\
      \ data organization from one sequencing run with two samples, paired-end data:\n\
      \n```bash\ndata\n  \u251C\u2500sample1_1_L001_R1_001.fastq.gz\n  \u251C\u2500\
      sample1_1_L001_R2_001.fastq.gz\n  \u251C\u2500sample2_1_L001_R1_001.fastq.gz\n\
      \  \u2514\u2500sample2_1_L001_R2_001.fastq.gz\n```\n\nPlease note the following\
      \ requirements:\n\n1. The path must be enclosed in quotes\n2. The folder must\
      \ contain gzip compressed demultiplexed fastq files. If the file names do not\
      \ follow the default (`\"/*_R{1,2}_001.fastq.gz\"`), please check `--extension`.\n\
      3. Sample identifiers are extracted from file names, i.e. the string before\
      \ the first underscore `_`, these must be unique\n4. If your data is scattered,\
      \ produce a sample sheet\n5. All sequencing data should originate from one sequencing\
      \ run, because processing relies on run-specific error models that are unreliable\
      \ when data from several sequencing runs are mixed. Sequencing data originating\
      \ from multiple sequencing runs requires additionally the parameter `--multiple_sequencing_runs`\
      \ and a specific folder structure.\n\nRelated parameters are:\n- `--pacbio`\
      \ and `--iontorrent` if the sequencing data is PacBio data or IonTorrent data\
      \ (default expected: paired-end Illumina data)\n- `--single_end` if the sequencing\
      \ data is single-ended Illumina data (default expected: paired-end Illumina\
      \ data)\n- `--multiple_sequencing_runs` if the sequencing data originates from\
      \ multiple sequencing runs\n- `--extension` if the sequencing file names do\
      \ not follow the default (`\"/*_R{1,2}_001.fastq.gz\"`)\n- Choose an appropriate\
      \ reference taxonomy for the type of amplicon (16S/18S/ITS/CO1) (default: DADA2\
      \ assignTaxonomy and 16S rRNA sequence database)"
- group_id: input_output_options
  name: metadata
  source_name: metadata
  type: string
  required: false
  default: null
  enum: null
  description: Path to metadata sheet, when missing most downstream analysis are skipped
    (barplots, PCoA plots, ...).
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/metadata
  example_values:
  - <server_output_root>/metadata
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Main arguments
  raw_schema:
    type: string
    format: file-path
    description: Path to metadata sheet, when missing most downstream analysis are
      skipped (barplots, PCoA plots, ...).
    help_text: 'This is optional, but for performing downstream analysis such as barplots,
      diversity indices or differential abundance testing, a metadata file is essential.


      Related parameter:

      - `--metadata_category` (optional) to choose columns that are used for testing
      significance


      For example:


      ```bash

      --metadata "path/to/metadata.tsv"

      ```


      Please note the following requirements:


      1. The path must be enclosed in quotes

      2. The metadata file has to follow the QIIME2 specifications (https://docs.qiime2.org/2021.2/tutorials/metadata/)


      The first column in the tab-separated metadata file is the sample identifier
      column (required header: `ID`) and defines the sample or feature IDs associated
      with your study. In addition to the sample identifier column, the metadata file
      is required to have at least one column with multiple different non-numeric
      values but not all unique.

      **NB**: without additional columns there might be no groupings for the downstream
      analyses.


      Sample identifiers should be 36 characters long or less, and also contain only
      ASCII alphanumeric characters (i.e. in the range of [a-z], [A-Z], or [0-9]),
      or the dash (-) character. For downstream analysis, by default all numeric columns,
      blanks or NA are removed, and only columns with multiple different values but
      not all unique are selected.


      The columns which are to be assessed can be specified by `--metadata_category`.
      If `--metadata_category` isn''t specified than all columns that fit the specification
      are automatically chosen.'
    fa_icon: fas fa-file-csv
- group_id: input_output_options
  name: multiregion
  source_name: multiregion
  type: string
  required: false
  default: null
  enum: null
  description: Path to multi-region definition sheet, for multi-region analysis with
    Sidle
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/multiregion
  example_values:
  - <server_output_root>/multiregion
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main arguments
  raw_schema:
    type: string
    format: file-path
    mimetype: text/tsv
    pattern: ^\S+\.(tsv|csv|yml|yaml|txt)$
    fa_icon: fas fa-dna
    description: Path to multi-region definition sheet, for multi-region analysis
      with Sidle
    help_text: "Path to file with information about sequenced regions, either tab-separated\
      \ (.tsv), comma-separated (.csv), or in YAML format (.yml/.yaml). This initiates\
      \ scaffolding multiple regions along a reference.\n\nThe file must have four\
      \ headers: \n- `region`: Unique region identifier\n- `region_length`: Minimal\
      \ length of region\n- `FW_primer`: Forward primer sequence\n- `RV_primer`: Reverse\
      \ primer sequence\n\nFor more details check the usage documentation.\n\nRelated\
      \ parameters are:\n- `--sidle_ref_taxonomy` to select the reference taxonomic\
      \ database\n- `--sidle_ref_tax_custom`, `--sidle_ref_seq_custom` and related\
      \ parameters for custom reference taxonomic database files"
    schema: assets/schema_multiregion.json
- group_id: input_output_options
  name: outdir
  source_name: outdir
  type: string
  required: true
  default: null
  enum: null
  description: The output directory where the results will be saved. You have to use
    absolute paths to storage on Cloud infrastructure.
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/ampliseq
  example_values:
  - <server_output_root>/ampliseq
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local path or manifest-like
    value. Confirm the concrete path with `fs_list(mode="manifest")` when uncertain.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Main arguments
  raw_schema:
    type: string
    format: directory-path
    description: The output directory where the results will be saved. You have to
      use absolute paths to storage on Cloud infrastructure.
    fa_icon: fas fa-folder-open
- group_id: input_output_options
  name: save_intermediates
  source_name: save_intermediates
  type: boolean
  required: false
  default: null
  enum: null
  description: Save intermediate results such as QIIME2's qza and qzv files
  classification: route_shaping
  channel: params
  placeholder: <server_output_root>/save_intermediates
  example_values:
  - <server_output_root>/save_intermediates
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Main arguments
  raw_schema:
    type: boolean
    description: Save intermediate results such as QIIME2's qza and qzv files
    fa_icon: fas fa-folder-open
- group_id: input_output_options
  name: FW_primer
  source_name: FW_primer
  type: string
  required: false
  default: null
  enum: null
  description: Forward primer sequence
  classification: lookup_only
  channel: params
  placeholder: <server_output_root>/FW_primer
  example_values:
  - <server_output_root>/FW_primer
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Main arguments
  raw_schema:
    type: string
    description: Forward primer sequence
    help_text: 'In amplicon sequencing methods, PCR with specific primers produces
      the amplicon of interest. These primer sequences need to be trimmed from the
      reads before further processing and are also required for producing an appropriate
      classifier. Do not use here any technical sequence such as adapter sequences
      but only the primer sequence that matches the biological amplicon.


      For example:


      ```bash

      --FW_primer "GTGYCAGCMGCCGCGGTAA" --RV_primer "GGACTACNVGGGTWTCTAAT"

      ```'
    fa_icon: fas fa-arrow-circle-right
- group_id: input_output_options
  name: RV_primer
  source_name: RV_primer
  type: string
  required: false
  default: null
  enum: null
  description: Reverse primer sequence
  classification: lookup_only
  channel: params
  placeholder: <server_output_root>/RV_primer
  example_values:
  - <server_output_root>/RV_primer
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Main arguments
  raw_schema:
    type: string
    description: Reverse primer sequence
    help_text: 'In amplicon sequencing methods, PCR with specific primers produces
      the amplicon of interest. These primer sequences need to be trimmed from the
      reads before further processing and are also required for producing an appropriate
      classifier. Do not use here any technical sequence such as adapter sequences
      but only the primer sequence that matches the biological amplicon.


      For example:


      ```bash

      --FW_primer GTGYCAGCMGCCGCGGTAA --RV_primer GGACTACNVGGGTWTCTAAT

      ```'
    fa_icon: fas fa-arrow-alt-circle-left
- group_id: input_output_options
  name: email
  source_name: email
  type: string
  required: false
  default: null
  enum: null
  description: Email address for completion summary.
  classification: lookup_only
  channel: params
  placeholder: <server_output_root>/email
  example_values:
  - <server_output_root>/email
  mapping_notes: Set only when the user wants a different output root, saved intermediate,
    or reporting behavior. Keep values in `params`, not `config_files`.
  lookup_priority: medium
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Main arguments
  raw_schema:
    type: string
    description: Email address for completion summary.
    fa_icon: fas fa-envelope
    help_text: Set this parameter to your e-mail address to get a summary e-mail with
      details of the run sent to you when the workflow exits. If set in your user
      config file (`~/.nextflow/config`) then you don't need to specify this on the
      command line for every run.
    pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
