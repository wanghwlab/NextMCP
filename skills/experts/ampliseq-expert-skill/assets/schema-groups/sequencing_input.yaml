  source_section: Sequencing input
  raw_schema:
    type: boolean
    description: If data is single-ended IonTorrent reads instead of Illumina
    fa_icon: fas fa-align-justify
- group_id: sequencing_input
  name: min_read_counts
  source_name: min_read_counts
  type: integer
  required: false
  default: 1
  enum: null
  description: Set read count threshold for failed samples.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/min_read_counts
  example_values:
  - <server_input_root>/min_read_counts
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: integer
    default: 1
    description: Set read count threshold for failed samples.
    help_text: Samples with less reads than this threshold at input or after trimming
      stop the pipeline. Using `--ignore_empty_input_files` or `--ignore_failed_trimming
      ignores` samples with read numbers below the threshold and lets the pipeline
      continue with less samples.
    fa_icon: fas fa-greater-than-equal
- group_id: sequencing_input
  name: multiple_sequencing_runs
  source_name: multiple_sequencing_runs
  type: boolean
  required: false
  default: null
  enum: null
  description: 'If using `--input_folder`: samples were sequenced in multiple sequencing
    runs'
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/multiple_sequencing_runs
  example_values:
  - <server_input_root>/multiple_sequencing_runs
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: boolean
    description: 'If using `--input_folder`: samples were sequenced in multiple sequencing
      runs'
    help_text: "Expects one sub-folder per sequencing run in the folder specified\
      \ by `--input_folder` containing sequencing data of the specific run.\nSample\
      \ identifiers are taken from sequencing files, specifically the string before\
      \ the first underscore will be the sample ID. Sample IDs across all sequencing\
      \ runs (all sequencing files) have to be unique. If this is not the case, please\
      \ use a sample sheet as input instead.\n\nExample for input data organization:\n\
      \n```bash\ndata\n  |-run1\n  |  |-sample1_1_L001_R1_001.fastq.gz\n  |  |-sample1_1_L001_R2_001.fastq.gz\n\
      \  |  |-sample2_1_L001_R1_001.fastq.gz\n  |  |-sample2_1_L001_R2_001.fastq.gz\n\
      \  |\n  |-run2\n     |-sample3_1_L001_R1_001.fastq.gz\n     |-sample3_1_L001_R2_001.fastq.gz\n\
      \     |-sample4_1_L001_R1_001.fastq.gz\n     |-sample4_1_L001_R2_001.fastq.gz\n\
      ```\n\nExample command to analyze this data in one pipeline run:\n\n```bash\n\
      nextflow run nf-core/ampliseq \\\n    -profile singularity \\\n    --input_folder\
      \ \"data\" \\\n    --FW_primer \"GTGYCAGCMGCCGCGGTAA\" \\\n    --RV_primer \"\
      GGACTACNVGGGTWTCTAAT\" \\\n    --metadata \"data/Metadata.tsv\" \\\n    --multiple_sequencing_runs\n\
      ```"
    fa_icon: fas fa-running
- group_id: sequencing_input
  name: pacbio
