- group_id: sequencing_input
  name: illumina_pe_its
  source_name: illumina_pe_its
  type: boolean
  required: false
  default: null
  enum: null
  description: If analysing ITS amplicons or any other region with large length variability
    with Illumina paired end reads
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/illumina_pe_its
  example_values:
  - <server_input_root>/illumina_pe_its
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: boolean
    description: If analysing ITS amplicons or any other region with large length
      variability with Illumina paired end reads
    help_text: 'This will cause the pipeline to

      - not truncate input reads if not `--trunclenf` and `--trunclenr` are overwriting
      defaults

      - remove reverse complement primers from the end of reads in case the read length
      exceeds the amplicon length'
    fa_icon: fas fa-align-justify
