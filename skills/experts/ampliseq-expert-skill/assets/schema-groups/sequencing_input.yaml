group:
  id: sequencing_input
  label: Sequencing input
  selection_rule: Use this group for parameters defined under the `Sequencing input`
    top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/sequencing_input.md
  - assets/schema-groups/sequencing_input.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `sequencing_input` for exact lookup.
parameters:
- group_id: sequencing_input
  name: ignore_empty_input_files
  source_name: ignore_empty_input_files
  type: boolean
  required: false
  default: null
  enum: null
  description: Ignore input files with too few reads.
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/ignore_empty_input_files
  example_values:
  - <server_input_root>/ignore_empty_input_files
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: boolean
    description: Ignore input files with too few reads.
    help_text: Ignore input files with less reads than specified by `--min_read_counts`
      and continue the pipeline without those samples.
    fa_icon: fas fa-arrow-right
