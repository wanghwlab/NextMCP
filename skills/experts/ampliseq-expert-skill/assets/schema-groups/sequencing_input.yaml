  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: boolean
    description: If data is single-ended PacBio reads instead of Illumina
    fa_icon: fas fa-align-justify
- group_id: sequencing_input
  name: quality_type
  source_name: quality_type
  type: string
  required: false
  default: Auto
  enum: &id001
  - Auto
  - FastqQuality
  - SFastqQuality
  description: Type of quality scores in raw read data
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/quality_type
  example_values:
  - Auto
  - FastqQuality
  - SFastqQuality
  mapping_notes: Map this value exactly to one current schema enum under `nextflow_run(params=...)`;
    do not invent spelling variants.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: string
    default: Auto
    description: Type of quality scores in raw read data
    help_text: 'From R package ''ShortRead'' function ''readFastq'': Representation
      to be used for quality scores, must be one of `Auto` (infer automatically),
      `FastqQuality` (Phred-like base 33 encoding), `SFastqQuality` (Illumina base
      64 encoding).'
    enum: *id001
    fa_icon: fab fa-amilia
- group_id: sequencing_input
  name: single_end
  source_name: single_end
  type: boolean
  required: false
  default: null
  enum: null
  description: If data is single-ended Illumina reads instead of paired-end
  classification: route_shaping
  channel: params
  placeholder: <server_input_root>/single_end
  example_values:
  - <server_input_root>/single_end
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: boolean
    description: If data is single-ended Illumina reads instead of paired-end
    help_text: When using a sample sheet with `--input` containing forward and reverse
      reads, specifying `--single_end` will only extract forward reads and treat the
      data as single ended instead of extracting forward and reverse reads.
    fa_icon: fas fa-align-left
- group_id: sequencing_input
  name: extension
  source_name: extension
  type: string
  required: false
  default: /*_R{1,2}_001.fastq.gz
  enum: null
  description: 'If using `--input_folder`: naming of sequencing files'
  classification: lookup_only
  channel: params
  placeholder: <server_input_root>/extension
  example_values:
  - <server_input_root>/extension
  mapping_notes: Preserve the current schema field name and pass under `nextflow_run(params=...)`.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Sequencing input
  raw_schema:
    type: string
    default: /*_R{1,2}_001.fastq.gz
    description: 'If using `--input_folder`: naming of sequencing files'
    help_text: 'Indicates the naming of sequencing files (default: `"/*_R{1,2}_001.fastq.gz"`).


      Please note:


      1. The prepended slash (`/`) is required

      2. The star (`*`) is the required wildcard for sample names

      3. The curly brackets (`{}`) enclose the orientation for paired end reads, separated
      by a comma (`,`).

      4. The pattern must be enclosed in quotes


      For example for one sample (name: `1`) with forward (file: `1_a.fastq.gz`) and
      reverse (file: `1_b.fastq.gz`) reads in folder `data`:


      ```bash

      --input_folder "data" --extension "/*_{a,b}.fastq.gz"

      ```'
    fa_icon: fab fa-amilia
