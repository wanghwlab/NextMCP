group:
  id: reference_genome_options
  label: Reference genome options
  selection_rule: Use this group for parameters defined under the `Reference genome
    options` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/reference_genome_options.md
  - assets/schema-groups/reference_genome_options.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `reference_genome_options` for exact lookup.
parameters:
- group_id: reference_genome_options
  name: bwamem_index
  source_name: bwamem_index
  type: string
  required: false
  default: null
  enum: null
  description: Path to the BWA-MEM index filename base
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/bwamem_index
  example_values:
  - <server_reference_root>/bwamem_index
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    format: directory-path
    description: Path to the BWA-MEM index filename base
    help_text: 'Directory for a bwa-mem genome reference index. Only used when using
      the bwa-mem aligner.


      Note that this is not a complete path, but the directory containing the reference.
      For example, if you have file paths such as `/path/to/ref/genome.fa.bwamem.c2t.bwt`,
      you should specify `/path/to/ref/`.'
    fa_icon: far fa-dot-circle
- group_id: reference_genome_options
  name: fasta
  source_name: fasta
  type: string
  required: false
  default: null
  enum: null
  description: Path to FASTA genome file
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?(\.gz)?$
    description: Path to FASTA genome file
    help_text: If you have no genome reference available, the pipeline can build one
      using a FASTA file. This requires additional time and resources, so it's better
      to use a pre-build index if possible. You can use the command line option `--save_reference`
      to keep the generated references so that they can be added to your config and
      used again in the future. If aligner is Bismark and bismark_index is specified,
      this parameter is ignored.
- group_id: reference_genome_options
  name: fasta_index
  source_name: fasta_index
  type: string
  required: false
  default: null
  enum: null
  description: Path to Fasta index file.
  classification: route_shaping
  channel: params
  placeholder: <server_reference_root>/genome.fa
  example_values:
  - <server_reference_root>/genome.fa
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: high
  confidence: low
  mapping_flags:
  - has_pattern_constraint
  source_section: Reference genome options
  raw_schema:
    type: string
    format: file-path
    exists: true
    mimetype: text/plain
    pattern: ^\S+\.fn?a(sta)?.fai$
    description: Path to Fasta index file.
    help_text: The FASTA index file (`.fa.fai`) is only needed when using the bwa_meth
      aligner. It is used by MethylDackel. If using Bismark this parameter is ignored.
    fa_icon: fas fa-bookmark
- group_id: reference_genome_options
  name: bismark_index
  source_name: bismark_index
  type: string
  required: false
  default: null
  enum: null
  description: Path to a directory containing a Bismark reference index.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/bismark_index
  example_values:
  - <server_reference_root>/bismark_index
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    format: path
    description: Path to a directory containing a Bismark reference index.
    fa_icon: fas fa-dot-circle
- group_id: reference_genome_options
  name: bwameth_index
  source_name: bwameth_index
  type: string
  required: false
  default: null
  enum: null
  description: bwameth index filename base
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/bwameth_index
  example_values:
  - <server_reference_root>/bwameth_index
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    format: path
    description: bwameth index filename base
    help_text: 'Directory for a bwa-meth genome reference index. Only used when using
      the bwa-meth aligner.


      Note that this is not a complete path, but the directory containing the reference.
      For example, if you have file paths such as `/path/to/ref/genome.fa.bwameth.c2t.bwt`,
      you should specify `/path/to/ref/`.'
    fa_icon: far fa-dot-circle
- group_id: reference_genome_options
  name: genome
  source_name: genome
  type: string
  required: false
  default: null
  enum: null
  description: Name of iGenomes reference.
  classification: lookup_only
  channel: params
  placeholder: <server_reference_root>/genome
  example_values:
  - <server_reference_root>/genome
  mapping_notes: Pass under `nextflow_run(params=...)` as a server-local reference,
    database, or prebuilt index value. Prefer reuse of confirmed server-side assets
    over rebuilding when appropriate.
  lookup_priority: medium
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    description: Name of iGenomes reference.
    fa_icon: fas fa-book
    help_text: 'If using a reference genome configured in the pipeline using iGenomes,
      use this parameter to give the ID for the reference. This is then used to build
      the full paths for all required reference genome files e.g. `--genome GRCh38`.


      See the [nf-core website docs](https://nf-co.re/usage/reference_genomes) for
      more details.'
- group_id: reference_genome_options
  name: igenomes_base
  source_name: igenomes_base
  type: string
  required: false
  default: s3://ngi-igenomes/igenomes/
  enum: null
  description: The base path to the igenomes reference files
  classification: non_runtime
  channel: authoring_only
  placeholder: null
  example_values:
  - s3://ngi-igenomes/igenomes/
  mapping_notes: Preserved for exact schema coverage, but do not surface in ordinary
    nextmcp runtime planning unless the user explicitly asks for this helper or metadata
    field.
  lookup_priority: low
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: string
    format: directory-path
    description: The base path to the igenomes reference files
    fa_icon: fas fa-ban
    hidden: true
    default: s3://ngi-igenomes/igenomes/
- group_id: reference_genome_options
  name: igenomes_ignore
  source_name: igenomes_ignore
  type: boolean
  required: false
  default: null
  enum: null
  description: Do not load the iGenomes reference config.
  classification: non_runtime
  channel: authoring_only
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Preserved for exact schema coverage, but do not surface in ordinary
    nextmcp runtime planning unless the user explicitly asks for this helper or metadata
    field.
  lookup_priority: low
  confidence: high
  mapping_flags: []
  source_section: Reference genome options
  raw_schema:
    type: boolean
    description: Do not load the iGenomes reference config.
    fa_icon: fas fa-ban
    hidden: true
    help_text: Do not load `igenomes.config` when running the pipeline. You may choose
      this option if you observe clashes between custom parameters and those supplied
      in `igenomes.config`.
