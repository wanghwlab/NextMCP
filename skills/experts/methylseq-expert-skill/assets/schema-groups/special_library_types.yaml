    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Special library types
  raw_schema:
    type: boolean
    fa_icon: fas fa-cubes
    description: Preset for EM-seq libraries.
    help_text: 'Equivalent to `--clip_r1 10` `--clip_r2 10` `--three_prime_clip_r1
      10` `--three_prime_clip_r2 10`.


      Also sets the `--maxins` flag to `1000` for Bismark.'
- group_id: special_library_types
  name: pbat
  source_name: pbat
  type: boolean
  required: false
  default: null
  enum: null
  description: Preset for working with PBAT libraries.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Special library types
  raw_schema:
    type: boolean
    fa_icon: fas fa-outdent
    description: Preset for working with PBAT libraries.
    help_text: 'Specify this parameter when working with PBAT _(Post Bisulfite Adapter
      Tagging)_ libraries.


      Using this parameter sets the `--pbat` flag when aligning with Bismark. This
      tells Bismark to align complementary strands (the opposite of `--directional`).


      Additionally, this is a trimming preset equivalent to `--clip_r1 8` `--clip_r2
      8` `--three_prime_clip_r1 8` `--three_prime_clip_r2 8`, unless `--skip_trimming_presets`
      is set to `true`'
- group_id: special_library_types
  name: rrbs
  source_name: rrbs
  type: boolean
  required: false
  default: null
  enum: null
  description: Turn on if dealing with MspI digested material.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Special library types
  raw_schema:
    type: boolean
    description: Turn on if dealing with MspI digested material.
    help_text: 'Use this parameter when working with RRBS _(Reduced Representation
      Bisulfite Sequencing)_ data, that is digested using MspI.


      Specifying `--rrbs` will pass on the `--rrbs` parameter to TrimGalore! See the
      [TrimGalore! documentation](https://github.com/FelixKrueger/TrimGalore/blob/master/Docs/Trim_Galore_User_Guide.md#rrbs-specific-options-mspi-digested-material)
      to read more about the effects of this option.


      This parameter also makes the pipeline skip the deduplication step.'
    fa_icon: fas fa-compress
- group_id: special_library_types
  name: single_cell
  source_name: single_cell
