    fa_icon: fas fa-cut
    description: Trimming preset for single-cell bisulfite libraries.
    help_text: 'Equivalent to `--clip_r1 6` `--clip_r2 6` `--three_prime_clip_r1 6`
      `--three_prime_clip_r2 6`.


      Also sets the `--non_directional` flag for Bismark.'
