group:
  id: special_library_types
  label: Special library types
  selection_rule: Use this group for parameters defined under the `Special library
    types` top-level schema section.
  lookup_order:
  - assets/schema-index.yaml
  - references/schema-groups/special_library_types.md
  - assets/schema-groups/special_library_types.yaml
  coverage_notes: Preserves the original `nextflow_schema.json` top-level section
    `special_library_types` for exact lookup.
parameters:
- group_id: special_library_types
  name: accel
  source_name: accel
  type: boolean
  required: false
  default: null
  enum: null
  description: Trimming preset for the Accel kit.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
  - true
  - false
  mapping_notes: Pass under `nextflow_run(params=...)`. Check playbooks and step recipes
    before changing this route-shaping switch.
  lookup_priority: high
  confidence: high
  mapping_flags: []
  source_section: Special library types
  raw_schema:
    type: boolean
    fa_icon: fas fa-cut
    help_text: Equivalent to `--clip_r1 10` `--clip_r2 15` `--three_prime_clip_r1
      10` `--three_prime_clip_r2 10`
    description: Trimming preset for the Accel kit.
- group_id: special_library_types
  name: em_seq
  source_name: em_seq
  type: boolean
  required: false
  default: null
  enum: null
  description: Preset for EM-seq libraries.
  classification: route_shaping
  channel: params
  placeholder: null
  example_values:
