    fa_icon: fas fa-wave-square
    help_text: "Specify to run Bismark with the `--slam` flag to run bismark in [SLAM-seq\
      \ mode](https://github.com/FelixKrueger/Bismark/blob/master/CHANGELOG.md#slam-seq-mode)\
